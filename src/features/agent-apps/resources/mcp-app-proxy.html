<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MCP App Proxy</title>
  <style>
    html, body { margin: 0; height: 100%; width: 100%; overflow: hidden; background: #1f1f1f; }
    body { display: flex; flex-direction: column; }
    * { box-sizing: border-box; }
    iframe { background-color: transparent; border: 0px none transparent; padding: 0px; overflow: hidden; flex-grow: 1; }
  </style>
</head>
<body>
  <!--
    MCP Apps sandbox proxy (双 iframe 模型的中间层):
    - 与宿主(父页)之间走 "ui/notifications/sandbox-*" JSON-RPC 控制面(握手/下发模板标识);
    - 同源 fetch 预构建模板(./apps/<name>@<version>.html), 注入强制 CSP + 设计令牌后写入内层
      sandbox iframe 的 srcdoc;
    - 其余 JSON-RPC 帧在 View(内层) 与宿主之间双向透传, 本页不解析业务语义,
      协议演进只需改宿主侧 mcp-app-host 包。
    - 防串扰: 宿主下发帧必须带匹配 nonce(转发给 View 前剥离, 保持 View 侧纯标准 JSON-RPC);
      View 上行帧由本页附加 nonce 后转发给宿主。
  -->
  <script>
    (function () {
      "use strict";

      var inner = document.createElement("iframe");
      inner.style = "width:100%; height:100%; border:none;";
      // 只给 allow-scripts: 内层落入 opaque origin, 与本页跨源。
      //
      // 刻意不给 allow-same-origin(与 widget-proxy / artifact-proxy 的取舍不同):
      // 两者叠加会让内层与本页同源, 模板脚本可经 parent.document 直接操作本页——而本页
      // 自身没有 CSP, 注入的 CSP 只作用于内层, 于是模板能读走 currentNonce 并向宿主
      // 伪造任意 JSON-RPC。MCP App 独有 tools/call(可触发后端副作用与计费), 宿主只能靠
      // nonce 区分帧来源, 这条逃逸面必须封死。
      //
      // 代价: 内层不能用 localStorage / sessionStorage / indexedDB / document.cookie
      // (opaque origin 下访问会抛)。协议链路不依赖它们——postMessage 与 event.source
      // 比较跨源照常工作, 模板产物(含 MCP SDK)实测零引用。第三方模板需在接入文档里
      // 明确这条约束: 状态持久化走 tapnow/setWidgetState, 不要用浏览器存储。
      inner.setAttribute("sandbox", "allow-scripts");
      document.body.appendChild(inner);

      var parentOrigin = "*";
      var currentNonce = null;
      var resourceLoaded = false;
      var proxyReadyTimer = null;
      var proxyReadyAttempts = 0;
      var PROXY_READY_INTERVAL_MS = 500;
      var PROXY_READY_MAX_ATTEMPTS = 30;

      function stopProxyReadyAnnouncements() {
        if (proxyReadyTimer === null) return;
        clearInterval(proxyReadyTimer);
        proxyReadyTimer = null;
      }

      function announceProxyReady() {
        if (currentNonce !== null || proxyReadyAttempts >= PROXY_READY_MAX_ATTEMPTS) {
          stopProxyReadyAnnouncements();
          return;
        }
        proxyReadyAttempts += 1;
        window.parent.postMessage(
          { jsonrpc: "2.0", method: "ui/notifications/sandbox-proxy-ready", params: {} },
          "*"
        );
      }

      function startProxyReadyAnnouncements() {
        announceProxyReady();
        if (currentNonce === null && proxyReadyAttempts < PROXY_READY_MAX_ATTEMPTS) {
          proxyReadyTimer = setInterval(announceProxyReady, PROXY_READY_INTERVAL_MS);
        }
      }

      // ENV_POLICY:BEGIN — local host only; nonce/source checks remain below.
      function isAllowedOrigin(origin) {
        if (typeof origin !== "string" || origin === "null") return false;
        try {
          var url = new URL(origin);
          return (url.protocol === "http:" || url.protocol === "https:")
            && origin === location.origin;
        } catch (e) {
          return false;
        }
      }
      // ENV_POLICY:END

      // 模板标识白名单: 防路径穿越, 只允许 <name>@v<N>.<hash8> 形态的文件。
      // hash 来自 manifest(受同源与 CI 守卫保护), 仍按对抗性输入做形态校验。
      var RESOURCE_NAME_REGEX = /^[a-z0-9-]+$/;
      var RESOURCE_VERSION_REGEX = /^v\d+$/;
      var RESOURCE_HASH_REGEX = /^[a-f0-9]{8}$/;

      // widget 目录的定位: 部署态 proxy 在 /<proxyHash>/ 下, 而 widget 与 manifest 部署在桶根
      // /apps/(不参与 proxy hash, 见 usercontent-sandbox/scripts/hash.mjs); 本地同源态两者
      // 同在 /usercontent-proxy/ 下。据 proxy 自身所在目录是否为 10 位 hash 目录来区分。
      function resolveAppsBase() {
        var segments = location.pathname.split("/").filter(Boolean);
        var dir = segments.length >= 2 ? segments[segments.length - 2] : "";
        return /^[a-f0-9]{10}$/.test(dir) ? "/apps/" : "./apps/";
      }

      var APPS_BASE = resolveAppsBase();

      var manifestPromise = null;

      function loadManifest() {
        if (!manifestPromise) {
          manifestPromise = fetch(APPS_BASE + "manifest.json").then(function (response) {
            if (!response.ok) throw new Error("manifest fetch failed: " + response.status);
            return response.json();
          });
          // 双重作用: 抑制预取时的 unhandled rejection; 失败后清空缓存, 使宿主重试装载时
          // 重新拉取, 不被上一次的 rejected promise 永久粘住。
          manifestPromise.catch(function () {
            manifestPromise = null;
          });
        }
        return manifestPromise;
      }

      // manifest 不依赖握手参数, 页面加载即预取——把这次 RTT 与宿主握手重叠, 不拖慢首屏。
      loadManifest();

      // 注意: 本 proxy 不注入任何样式——保持对模板中立(第三方模板自带样式, 强灌
      // :root 变量会污染)。主题走标准通道: 宿主经 hostContext.styles.variables 下发,
      // View 用 SDK 自行应用; TapNow 自有模板的产品令牌由构建期打进单文件产物
      // (见 packages/mcp-app-widgets/src/shared/design-tokens.css)。proxy 只负责安全(CSP)。
      // 仅接受严格 https origin 形态的域(防御纵深: 拒绝含引号/分号/空白的值,
      // 杜绝经拼接注入额外 CSP 指令或破坏 meta content 属性)。
      function buildCspPolicy() {
        var imgSources = "data: blob:";
        var mediaSources = "blob:";
        // 默认近乎全禁: 无网络(connect-src 'none')、无外部脚本/样式(仅 inline, 适配单文件构建产物)、
        // 无嵌套 iframe、无表单提交。img 仅放行宿主交付的 data/blob 本地媒体。
        return "default-src 'none'; "
          + "script-src 'unsafe-inline'; "
          + "style-src 'unsafe-inline'; "
          + "font-src data:; "
          + "img-src " + imgSources + "; "
          + "media-src " + mediaSources + "; "
          + "connect-src 'none'; "
          + "frame-src 'none'; "
          + "form-action 'none'; "
          + "base-uri 'none'";
      }

      // CSP 注入不用正则/字符串替换找 <head>——注释、<title>/<textarea> 等 raw-text 里的
      // 假 <head> 都能骗过字符串匹配, 把 CSP 插进惰性上下文而失效(与 widget-proxy 同一
      // 结论)。当前模板虽为一方构建产物, 但按对抗性输入标准处理, M3 第三方模板可直接复用。
      // DOMParser 惰性解析不执行脚本, 拿真实 <head> 前置 CSP meta 后整体序列化,
      // CSP 必然先于文档内任何脚本生效。
      function buildSrcdocWithCsp(html, policy) {
        var doc = new DOMParser().parseFromString(html, "text/html");
        var head = doc.head;
        var meta = doc.createElement("meta");
        meta.setAttribute("http-equiv", "Content-Security-Policy");
        meta.setAttribute("content", policy);
        head.insertBefore(meta, head.firstChild);
        return "<!doctype html>" + doc.documentElement.outerHTML;
      }

      // PRODUCT_KIT_LOCAL_TRANSPORT:BEGIN
      // Keep the captured reference intact. This exact, hash-bound derivative only
      // changes the thumbnail transport from vendor HTTPS to host-owned pixels.
      async function localizeProductKitTransport(html, name, version) {
        if (name !== "product-kit") return html;
        if (version !== "v1") throw new Error("unsupported local product-kit version");
        var expected = "758d09b3f06e99a6b4e47a782d33ef90b9f12935c140b8bdfe88ca41f76e2535";
        var digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(html));
        var hash = Array.from(new Uint8Array(digest), function (byte) {return byte.toString(16).padStart(2, "0");}).join("");
        var original = 'thumbnail_url:f().url().refine(e=>e.startsWith("https://"))';
        if (hash !== expected || html.split(original).length !== 2) throw new Error("product-kit reference integrity mismatch");
        var local = String.raw`thumbnail_url:f().max(500000).regex(/^data:image\/(?:png|jpeg|webp);base64,[A-Za-z0-9+/]+={0,2}$/)`;
        return html.replace(original, local);
      }
      // PRODUCT_KIT_LOCAL_TRANSPORT:END

      // ECOMMERCE_LOCAL_BILLING:BEGIN
      // Captured bytes remain evidence; this display-only derivative describes the local provider.
      async function localizeEcommerceBilling(html, name, version) {
        if (name !== "ecommerce-photoset") return html;
        if (version !== "v2") throw new Error("unsupported local ecommerce-photoset version");
        var digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(html));
        var hash = Array.from(new Uint8Array(digest), function (byte) {return byte.toString(16).padStart(2, "0");}).join("");
        if (hash !== "a7b6a057ceeb55ec0cef26e35d33e18c42c53aec26b2c1d6032e04294b401861") throw new Error("ecommerce-photoset reference integrity mismatch");
        var changes = [["estimatingCost:\"Estimating Tapies…\"", "estimatingCost:\"Checking generation cost…\""], ["estimateUnavailable:\"Cost is temporarily unavailable. Confirming will still charge actual generation usage.\"", "estimateUnavailable:\"No cost estimate is provided. The configured provider bills actual usage.\""], ["confirmBilling:\"Estimated cost\"", "confirmBilling:\"Local task submission\""], ["confirmBillingWarning:\"Confirming will submit these tasks and charge Tapies.\"", "confirmBillingWarning:\"Confirmation submits local generation tasks; the configured provider bills actual usage.\""], ["estimatingCost:\"正在估算 Tapies…\"", "estimatingCost:\"正在查询生成费用…\""], ["estimateUnavailable:\"暂时无法估价；确认后仍会按实际生成用量扣费。\"", "estimateUnavailable:\"未提供费用估算。已配置供应商按实际用量计费。\""], ["confirmBilling:\"预计费用\"", "confirmBilling:\"本地任务提交\""], ["confirmBillingWarning:\"确认后将提交这些任务并扣除 Tapies。\"", "confirmBillingWarning:\"确认后提交本地生成任务；已配置供应商按实际用量计费。\""], ["estimatingCost:\"Tapies を見積もっています…\"", "estimatingCost:\"生成コストを確認しています…\""], ["estimateUnavailable:\"現在コストを見積もれません。確定すると実際の生成量に応じて課金されます。\"", "estimateUnavailable:\"費用の見積もりは提供されていません。設定済みプロバイダーが実際の使用量に応じて請求します。\""], ["confirmBilling:\"見積もりコスト\"", "confirmBilling:\"ローカルタスクの送信\""], ["confirmBillingWarning:\"確定するとタスクが送信され、Tapies が請求されます。\"", "confirmBillingWarning:\"確定するとローカル生成タスクを送信します。設定済みプロバイダーが実際の使用量に応じて請求します。\""], ["estimatingCost:\"Tapies를 계산하는 중…\"", "estimatingCost:\"생성 비용을 확인하는 중…\""], ["estimateUnavailable:\"현재 비용을 계산할 수 없습니다. 확인하면 실제 생성 사용량에 따라 과금됩니다.\"", "estimateUnavailable:\"비용 견적이 제공되지 않습니다. 설정된 공급자가 실제 사용량에 따라 청구합니다.\""], ["confirmBilling:\"예상 비용\"", "confirmBilling:\"로컬 작업 제출\""], ["confirmBillingWarning:\"확인하면 작업이 제출되고 Tapies가 청구됩니다.\"", "confirmBillingWarning:\"확인하면 로컬 생성 작업이 제출됩니다. 설정된 공급자가 실제 사용량에 따라 청구합니다.\""], ["estimatingCost:\"Estimation des Tapies…\"", "estimatingCost:\"Vérification du coût de génération…\""], ["estimateUnavailable:\"Le coût est temporairement indisponible. La consommation réelle sera tout de même facturée après confirmation.\"", "estimateUnavailable:\"Aucune estimation de coût fournie. Le fournisseur configuré facture la consommation réelle.\""], ["confirmBilling:\"Coût estimé\"", "confirmBilling:\"Envoi de tâches locales\""], ["confirmBillingWarning:\"La confirmation enverra ces tâches et débitera des Tapies.\"", "confirmBillingWarning:\"La confirmation envoie des tâches de génération locales ; le fournisseur configuré facture la consommation réelle.\""]];
        changes.forEach(function (change) {
          if (html.split(change[0]).length !== 2) throw new Error("ecommerce-photoset billing text integrity mismatch");
          html = html.replace(change[0], change[1]);
        });
        return html;
      }
      // ECOMMERCE_LOCAL_BILLING:END

      // PREVIS_LOCAL_BILLING:BEGIN
      async function localizePrevisBilling(html, name, version) {
        if (name !== "previs") return html;
        if (version !== "v3") throw new Error("unsupported local previs version");
        var digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(html));
        var hash = Array.from(new Uint8Array(digest), function (byte) {return byte.toString(16).padStart(2, "0");}).join("");
        if (hash !== "584fd5b21ed83b53dfd0b55c2ab5edf36956b22a5b2ef0adae9dcad068b30394") throw new Error("previs reference integrity mismatch");
        var changes = [["variantPrice:\"Generate 9 options · 26 credits\"", "variantPrice:\"Generate 9 options · provider pricing\""], ["variantPrice:\"生成 9 个选项 · 26 积分\"", "variantPrice:\"生成 9 个选项 · 费用由供应商决定\""], ["catch{if(!o())return!1;D={...D,[i]:{...n,status:\"failed\",error:\"submit_failed\"}}}", "catch(z){if(!o())return!1;D={...D,[i]:{...n,status:\"failed\",error:z?.data?.code===\"configuration_required\"||z?.code===\"configuration_required\"?\"configuration_required\":\"submit_failed\"}}}"], ["r.error===\"submit_failed\"?_.submitRetry:_.variantFailed", "r.error===\"configuration_required\"?_.configurationRequired:r.error===\"submit_failed\"?_.submitRetry:_.variantFailed"], ["function yo(e){_=Co[e??\"\"]??Co[\"en-US\"],document.documentElement.lang=e||\"en-US\"}", "const pvLocalConfiguration={\"zh-CN\":\"尚未配置图片生成服务，请连接API后重试。任务尚未派发。\",\"en-US\":\"Image generation is not configured. Connect the API and retry. No task was dispatched.\",\"ja-JP\":\"画像生成サービスが未設定です。APIを接続して再試行してください。タスクは送信されていません。\",\"ko-KR\":\"이미지 생성 서비스가 설정되지 않았습니다. API를 연결한 후 다시 시도하세요. 작업은 전송되지 않았습니다.\",\"fr-FR\":\"La génération d’images n’est pas configurée. Connectez l’API puis réessayez. Aucune tâche n’a été envoyée.\"};function yo(e){_={...(Co[e??\"\"]??Co[\"en-US\"]),configurationRequired:pvLocalConfiguration[e]??pvLocalConfiguration[\"en-US\"]},document.documentElement.lang=e||\"en-US\"}"]];
        changes.forEach(function (change) {if (html.split(change[0]).length !== 2) throw new Error("previs billing text integrity mismatch");html = html.replace(change[0], change[1]);});
        return html;
      }
      // PREVIS_LOCAL_BILLING:END

      function notifyParent(method, params) {
        window.parent.postMessage(
          { jsonrpc: "2.0", method: method, params: params || {}, nonce: (params && params.nonce) || currentNonce },
          parentOrigin === "*" ? "*" : parentOrigin
        );
      }

      function handleResourceReady(params, origin) {
        if (resourceLoaded) return;
        if (!params || typeof params.nonce !== "string" || !params.resource) return;
        // 宿主已接住 ready 并返回 nonce，停止有上限的重发；后续由 nonce 控制面接管。
        stopProxyReadyAnnouncements();
        var name = params.resource.name;
        var version = params.resource.version;
        if (!RESOURCE_NAME_REGEX.test(String(name)) || !RESOURCE_VERSION_REGEX.test(String(version))) {
          notifyParent("ui/notifications/sandbox-resource-error", {
            nonce: params.nonce,
            message: "invalid resource identifier"
          });
          return;
        }
        resourceLoaded = true;
        currentNonce = params.nonce;
        parentOrigin = origin;

        loadManifest()
          .then(function (manifest) {
            var key = name + "@" + version;
            var hash = manifest && manifest.widgets ? manifest.widgets[key] : null;
            if (!RESOURCE_HASH_REGEX.test(String(hash))) {
              throw new Error("widget not in manifest: " + key);
            }
            return fetch(APPS_BASE + key + "." + hash + ".html");
          })
          .then(function (response) {
            if (!response.ok) throw new Error("template fetch failed: " + response.status);
            return response.text();
          })
          .then(function (templateHtml) {
            return localizeProductKitTransport(templateHtml, name, version);
          })
          .then(function (templateHtml) {
            return localizeEcommerceBilling(templateHtml, name, version);
          })
          .then(function (templateHtml) {
            return localizePrevisBilling(templateHtml, name, version);
          })
          .then(async function (templateHtml) {
            if (name !== "animatic") return templateHtml;
            var errors = await import("../animatic-local-errors.mjs");
            return errors.localizeAnimaticErrors(templateHtml, name, version);
          })
          .then(function (templateHtml) {
            inner.srcdoc = buildSrcdocWithCsp(templateHtml, buildCspPolicy(params.csp));
          })
          .catch(function (error) {
            resourceLoaded = false;
            notifyParent("ui/notifications/sandbox-resource-error", {
              nonce: currentNonce,
              message: String((error && error.message) || "template load failed")
            });
          });
      }

      window.addEventListener("message", function (event) {
        var data = event.data;
        if (!data || typeof data !== "object" || data.jsonrpc !== "2.0") return;

        if (event.source === window.parent && isAllowedOrigin(event.origin)) {
          if (data.method === "ui/notifications/sandbox-resource-ready") {
            handleResourceReady(data.params, event.origin);
            return;
          }
          // 宿主 → View: 校验 nonce 后剥离, 保持 View 侧收到纯标准 JSON-RPC。
          if (currentNonce === null || data.nonce !== currentNonce) return;
          if (!inner.contentWindow) return;
          var forwarded = {};
          for (var key in data) {
            if (Object.prototype.hasOwnProperty.call(data, key) && key !== "nonce") {
              forwarded[key] = data[key];
            }
          }
          inner.contentWindow.postMessage(forwarded, "*");
          return;
        }

        if (event.source === inner.contentWindow) {
          if (currentNonce === null) return;
          // View → 宿主: 附加 nonce 转发, 宿主据此过滤串扰帧。
          var outbound = {};
          for (var innerKey in data) {
            if (Object.prototype.hasOwnProperty.call(data, innerKey)) {
              outbound[innerKey] = data[innerKey];
            }
          }
          outbound.nonce = currentNonce;
          window.parent.postMessage(outbound, parentOrigin);
        }
      });

      // 内联脚本先挂监听再通知。ready 做有上限重发，覆盖父页 React effect 尚未挂载的竞态；
      // 收到 sandbox-resource-ready 后立即停止，不在稳定态制造额外消息流量。
      startProxyReadyAnnouncements();
    })();
  </script>
</body>
</html>
