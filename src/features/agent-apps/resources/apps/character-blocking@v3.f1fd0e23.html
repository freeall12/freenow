<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Character Blocking</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: transparent; }
    body {
      font-family: var(--font-sans, Inter, ui-sans-serif, system-ui, sans-serif);
      color: var(--color-text-primary, rgba(255,255,255,.95));
      font-size: 13px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; }
    button, select { color: inherit; }
    button:focus-visible,
    .marker-body:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 2px solid var(--color-accent, #90c4e5);
      outline-offset: 2px;
    }

    .blocking {
      --stage-surface: color-mix(in srgb, var(--color-accent, #90c4e5) 3%, #141414);
      --stage-surface-raised: color-mix(in srgb, var(--color-accent, #90c4e5) 6%, #181818);
      --stage-grid: rgba(255,255,255,.026);
      --stage-guide: color-mix(in srgb, var(--color-accent, #90c4e5) 30%, transparent);
      display: flex;
      width: 100%;
      max-width: 880px;
      flex-direction: column;
      gap: 14px;
      padding: 8px 4px 4px;
    }
    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .header {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 0 2px;
    }
    .title-row {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 10px;
    }
    .kicker {
      flex: none;
      color: var(--color-accent, #90c4e5);
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .title {
      min-width: 0;
      flex: 1;
      margin: 0;
      overflow: hidden;
      color: var(--color-text-primary, rgba(255,255,255,.95));
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -.02em;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .count {
      display: inline-flex;
      height: 24px;
      flex: none;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid var(--color-border-primary, rgba(255,255,255,.1));
      border-radius: var(--r-pill, 9999px);
      background: var(--color-background-secondary, rgba(255,255,255,.08));
      color: var(--color-text-secondary, rgba(255,255,255,.7));
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 9px;
      font-variant-numeric: tabular-nums;
      padding: 0 8px;
    }
    .count::before {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--color-accent, #90c4e5);
      box-shadow: 0 0 8px var(--color-accent-55, rgba(144,196,229,.55));
      content: "";
    }
    .scene {
      max-width: 720px;
      margin: 0;
      color: var(--color-text-secondary, rgba(255,255,255,.7));
      font-size: 12px;
      line-height: 1.5;
    }

    .toolbar {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      flex-wrap: wrap;
      padding: 9px;
      border: 1px solid var(--color-border-primary, rgba(255,255,255,.1));
      border-radius: var(--r-md, 12px);
      background: var(--color-background-primary, #1f1f1f);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.025);
    }
    .select-group {
      display: flex;
      min-width: 118px;
      flex-direction: column;
      gap: 4px;
    }
    .control-label,
    .coordinate-label {
      color: var(--color-text-tertiary, rgba(255,255,255,.55));
      font-size: 9px;
      font-weight: 500;
      letter-spacing: .02em;
    }
    .select {
      height: 32px;
      border: 1px solid var(--color-border-primary, rgba(255,255,255,.1));
      border-radius: var(--r-sm, 8px);
      background: var(--color-background-secondary, rgba(255,255,255,.08));
      color: var(--color-text-primary, rgba(255,255,255,.95));
      cursor: pointer;
      font-size: 11px;
      padding: 0 28px 0 10px;
      transition: border-color 120ms ease, background 120ms ease;
    }
    .select:hover {
      border-color: var(--color-border-info, rgba(144,196,229,.3));
      background: var(--interaction-hover, rgba(255,255,255,.05));
    }
    .mono-select {
      min-width: 82px;
      font-family: var(--font-mono, ui-monospace, monospace);
      font-variant-numeric: tabular-nums;
    }
    .tool-button {
      height: 32px;
      border: 1px solid var(--color-border-primary, rgba(255,255,255,.1));
      border-radius: var(--r-sm, 8px);
      background: transparent;
      color: var(--color-text-secondary, rgba(255,255,255,.7));
      cursor: pointer;
      font-size: 11px;
      padding: 0 11px;
      transition: border-color 120ms ease, background 120ms ease, color 120ms ease;
    }
    .tool-button.snap {
      margin-left: auto;
    }
    .tool-button:hover {
      border-color: var(--color-border-secondary, rgba(255,255,255,.16));
      background: var(--interaction-hover, rgba(255,255,255,.05));
      color: var(--color-text-primary, rgba(255,255,255,.95));
    }
    .tool-button.snap.on {
      border-color: var(--color-border-info, rgba(144,196,229,.3));
      background: var(--color-accent-12, rgba(144,196,229,.12));
      color: var(--color-accent-on-tint, #c4e3f5);
    }

    .workspace {
      display: grid;
      align-items: start;
      gap: 12px;
      grid-template-columns: minmax(0, 1fr) 238px;
    }
    .stage-shell {
      position: relative;
      min-width: 0;
      padding: 31px 28px 48px;
      border: 1px solid var(--color-border-primary, rgba(255,255,255,.1));
      border-radius: var(--r-lg, 16px);
      background:
        radial-gradient(circle at 50% 105%, var(--color-accent-06, rgba(144,196,229,.06)), transparent 42%),
        var(--color-background-primary, #1f1f1f);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.025);
      overflow: hidden;
    }
    .depth-axis {
      position: absolute;
      left: 28px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--color-text-tertiary, rgba(255,255,255,.55));
      font-size: 9px;
      font-weight: 500;
      letter-spacing: .02em;
    }
    .depth-axis::before {
      width: 14px;
      height: 1px;
      background: currentColor;
      content: "";
      opacity: .55;
    }
    .depth-axis.top { top: 10px; }
    .depth-axis.bottom { bottom: 12px; }

    .stage {
      position: relative;
      width: min(100%, 650px);
      margin: 0 auto;
      border: 1px solid color-mix(in srgb, var(--color-accent, #90c4e5) 20%, rgba(255,255,255,.08));
      border-radius: var(--r-md, 12px);
      background:
        linear-gradient(var(--stage-grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--stage-grid) 1px, transparent 1px),
        linear-gradient(180deg, var(--stage-surface) 0%, var(--stage-surface-raised) 100%);
      background-size: 10% 10%, 10% 10%, 100% 100%;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.015),
        inset 0 -56px 70px rgba(144,196,229,.025),
        0 18px 48px rgba(0,0,0,.22);
      isolation: isolate;
      overflow: hidden;
      transition: width 180ms ease, aspect-ratio 180ms ease;
    }
    .stage.portrait { width: min(58%, 310px); }
    .stage.squareish { width: min(78%, 460px); }
    .depth-band {
      position: absolute;
      z-index: -1;
      left: 0;
      width: 100%;
      pointer-events: none;
    }
    .far-band { top: 0; height: 33.333%; background: rgba(0,0,0,.075); }
    .mid-band { top: 33.333%; height: 33.333%; background: rgba(255,255,255,.008); }
    .near-band { bottom: 0; height: 33.333%; background: var(--color-accent-06, rgba(144,196,229,.06)); }
    .third {
      position: absolute;
      z-index: -1;
      background: rgba(255,255,255,.052);
      pointer-events: none;
    }
    .third-x { top: 0; width: 1px; height: 100%; }
    .third-x.one { left: 33.333%; }
    .third-x.two { left: 66.666%; }
    .third-y { left: 0; width: 100%; height: 1px; }
    .third-y.one { top: 33.333%; }
    .third-y.two { top: 66.666%; }
    .center-mark {
      position: absolute;
      z-index: -1;
      top: 50%;
      left: 50%;
      width: 18px;
      height: 18px;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
    }
    .center-mark::before,
    .center-mark::after {
      position: absolute;
      top: 50%;
      left: 50%;
      background: rgba(255,255,255,.09);
      content: "";
      transform: translate(-50%, -50%);
    }
    .center-mark::before { width: 28px; height: 1px; }
    .center-mark::after { width: 1px; height: 28px; }
    .crosshair {
      position: absolute;
      z-index: 1;
      pointer-events: none;
      opacity: .9;
    }
    .cross-x {
      left: 0;
      width: 100%;
      border-top: 1px dashed var(--stage-guide);
    }
    .cross-y {
      top: 0;
      height: 100%;
      border-left: 1px dashed var(--stage-guide);
    }

    .marker {
      position: absolute;
      z-index: var(--depth-z, 3);
      display: grid;
      width: var(--marker-size, 40px);
      height: var(--marker-size, 40px);
      place-items: center;
      transform: translate(-50%, -50%);
      transition:
        width 160ms cubic-bezier(.2,.8,.2,1),
        height 160ms cubic-bezier(.2,.8,.2,1);
      user-select: none;
    }
    .marker-body {
      position: relative;
      display: grid;
      width: 100%;
      height: 100%;
      place-items: center;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 50%;
      background:
        radial-gradient(circle at 32% 24%, rgba(255,255,255,.14), transparent 38%),
        linear-gradient(145deg, rgba(255,255,255,.09), rgba(255,255,255,.025)),
        rgba(24,24,24,.76);
      -webkit-backdrop-filter: blur(12px) saturate(125%);
      backdrop-filter: blur(12px) saturate(125%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.1),
        inset 0 -1px 0 rgba(0,0,0,.22),
        0 8px 20px rgba(0,0,0,.3);
      color: rgba(255,255,255,.86);
      cursor: grab;
      padding: 0;
      touch-action: none;
      transition:
        scale 160ms cubic-bezier(.2,.8,.2,1),
        border-color 160ms ease,
        background 160ms ease,
        box-shadow 160ms ease,
        color 160ms ease;
    }
    .marker-body::before {
      position: absolute;
      inset: 1px;
      border-radius: inherit;
      background: linear-gradient(155deg, rgba(255,255,255,.08), transparent 44%);
      content: "";
      pointer-events: none;
    }
    .marker:hover:not(.selected) .marker-body {
      border-color: rgba(255,255,255,.28);
      background:
        radial-gradient(circle at 32% 24%, rgba(255,255,255,.18), transparent 38%),
        linear-gradient(145deg, rgba(255,255,255,.12), rgba(255,255,255,.04)),
        rgba(28,28,28,.8);
      color: rgba(255,255,255,.96);
    }
    .marker-body:active { cursor: grabbing; scale: 1.02; }
    .marker.selected {
      z-index: 20;
    }
    .marker.selected .marker-body {
      border-color: color-mix(in srgb, var(--color-accent, #90c4e5) 88%, white);
      background:
        radial-gradient(circle at 32% 24%, rgba(255,255,255,.22), transparent 40%),
        linear-gradient(145deg, rgba(144,196,229,.18), rgba(144,196,229,.07)),
        rgba(22,28,32,.86);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.18),
        inset 0 -1px 0 rgba(0,0,0,.2),
        0 0 0 5px rgba(144,196,229,.1),
        0 12px 28px rgba(0,0,0,.4);
      color: rgba(255,255,255,.98);
      scale: 1.06;
    }
    .marker-portrait {
      position: absolute;
      z-index: 1;
      inset: 2px;
      display: grid;
      overflow: hidden;
      place-items: center;
      border-radius: inherit;
      pointer-events: none;
    }
    .avatar-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      user-select: none;
    }
    .avatar-fallback {
      display: grid;
      width: 100%;
      height: 100%;
      place-items: center;
    }
    .marker-portrait .avatar-fallback {
      position: relative;
      z-index: 1;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: -.02em;
      text-shadow: 0 1px 2px rgba(0,0,0,.5);
    }
    .marker-index {
      position: absolute;
      z-index: 1;
      top: 5px;
      left: 7px;
      color: rgba(255,255,255,.38);
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 6px;
      font-variant-numeric: tabular-nums;
      letter-spacing: .02em;
      line-height: 1;
      pointer-events: none;
    }
    .marker.selected .marker-index { color: rgba(196,227,245,.62); }
    .facing-ray {
      position: absolute;
      z-index: 2;
      top: 50%;
      left: 50%;
      width: 1px;
      height: calc(var(--marker-size, 40px) * .5 + 5px);
      background: linear-gradient(180deg, var(--color-accent, #90c4e5), transparent 92%);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -100%) rotate(var(--facing-angle, 180deg));
      transform-origin: 50% 100%;
      transition: opacity 140ms ease;
    }
    .marker.selected .facing-ray { opacity: .72; }
    .facing-handle {
      position: absolute;
      z-index: 4;
      top: 50%;
      left: 50%;
      width: 24px;
      height: 24px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: rgba(255,255,255,.72);
      cursor: grab;
      padding: 0;
      touch-action: none;
      transform:
        translate(-50%, -50%)
        rotate(var(--facing-angle, 180deg))
        translateY(calc(var(--marker-size, 40px) * -.5 - 4px));
      transform-origin: center;
      transition: color 140ms ease;
    }
    .facing-handle::before {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 9px;
      height: 8px;
      background: currentColor;
      clip-path: polygon(50% 0, 96% 82%, 4% 82%);
      content: "";
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.6));
      transform: translate(-50%, -50%);
    }
    .facing-handle:hover { color: rgba(255,255,255,.98); }
    .facing-handle:active { cursor: grabbing; }
    .marker.selected .facing-handle {
      color: color-mix(in srgb, var(--color-accent, #90c4e5) 82%, white);
    }
    .marker-caption {
      position: absolute;
      top: calc(100% + 7px);
      left: 50%;
      max-width: 92px;
      overflow: hidden;
      color: rgba(255,255,255,.7);
      font-size: 9px;
      font-weight: 500;
      line-height: 1.4;
      padding: 1px 4px;
      pointer-events: none;
      text-shadow: 0 2px 5px rgba(0,0,0,.95), 0 0 2px rgba(0,0,0,.8);
      text-overflow: ellipsis;
      transform: translateX(-50%);
      transition: color 160ms ease, opacity 160ms ease;
      white-space: nowrap;
    }
    .marker.selected .marker-caption {
      color: rgba(255,255,255,.96);
      font-weight: 600;
    }
    .camera-bank {
      position: absolute;
      right: 28px;
      bottom: 16px;
      left: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      color: var(--color-text-tertiary, rgba(255,255,255,.55));
    }
    .camera-bank::before,
    .camera-bank::after {
      height: 1px;
      flex: 1;
      background: linear-gradient(90deg, transparent, var(--color-border-primary, rgba(255,255,255,.1)));
      content: "";
    }
    .camera-bank::after {
      background: linear-gradient(90deg, var(--color-border-primary, rgba(255,255,255,.1)), transparent);
    }
    .camera-lens {
      position: relative;
      width: 18px;
      height: 8px;
      flex: none;
      border: 1px solid currentColor;
      border-radius: 3px;
    }
    .camera-lens::after {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 4px;
      height: 4px;
      border: 1px solid currentColor;
      border-radius: 50%;
      content: "";
      transform: translate(-50%, -50%);
    }
    .camera-label {
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 7px;
      font-weight: 600;
      letter-spacing: .1em;
      white-space: nowrap;
    }

    .inspector {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 8px;
    }
    .selected-card,
    .cast {
      border: 1px solid var(--color-border-primary, rgba(255,255,255,.1));
      border-radius: var(--r-md, 12px);
      background: var(--color-background-primary, #1f1f1f);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.02);
      padding: 12px;
    }
    .selected-head { display: flex; align-items: center; gap: 9px; }
    .selected-avatar {
      position: relative;
      display: inline-flex;
      width: 34px;
      height: 34px;
      flex: none;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(144,196,229,.42);
      border-radius: 50%;
      background:
        radial-gradient(circle at 32% 24%, rgba(255,255,255,.18), transparent 40%),
        rgba(144,196,229,.1);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.1);
      color: var(--color-accent-on-tint, #c4e3f5);
      font-size: 10px;
      font-weight: 600;
      overflow: hidden;
    }
    .selected-avatar .avatar-fallback { position: absolute; inset: 0; }
    .identity { display: flex; min-width: 0; flex: 1; flex-direction: column; }
    .identity-meta {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .eyebrow {
      color: var(--color-text-tertiary, rgba(255,255,255,.55));
      font-size: 9px;
      font-weight: 500;
      letter-spacing: .02em;
    }
    .selected-name {
      overflow: hidden;
      font-size: 13px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .selected-index {
      color: var(--color-text-tertiary, rgba(255,255,255,.55));
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 8px;
      font-variant-numeric: tabular-nums;
      opacity: .7;
    }
    .selected-role {
      display: -webkit-box;
      overflow: hidden;
      color: var(--color-text-secondary, rgba(255,255,255,.7));
      font-size: 10px;
      line-height: 1.4;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }
    .region {
      display: inline-flex;
      width: fit-content;
      margin: 9px 0 8px;
      border: 1px solid var(--color-border-info, rgba(144,196,229,.3));
      border-radius: var(--r-pill, 9999px);
      background: var(--color-accent-06, rgba(144,196,229,.06));
      color: var(--color-accent-on-tint, #c4e3f5);
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 10px;
      padding: 3px 8px;
    }
    .coordinates { display: grid; gap: 7px; grid-template-columns: 1fr 1fr; }
    .coordinate-field { display: flex; min-width: 0; flex-direction: column; gap: 3px; }
    .coordinate-field input,
    .facing-input-wrap input {
      width: 100%;
      height: 34px;
      border: 1px solid var(--color-border-primary, rgba(255,255,255,.1));
      border-radius: var(--r-sm, 8px);
      background: var(--color-background-secondary, rgba(255,255,255,.08));
      color: var(--color-text-primary, rgba(255,255,255,.95));
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      padding: 0 9px;
      transition: border-color 120ms ease, box-shadow 120ms ease;
    }
    .coordinate-field input:hover,
    .facing-input-wrap input:hover {
      border-color: var(--color-border-secondary, rgba(255,255,255,.16));
    }
    .coordinate-field input:focus,
    .facing-input-wrap input:focus {
      border-color: var(--color-border-info, rgba(144,196,229,.3));
      box-shadow: 0 0 0 2px var(--color-accent-06, rgba(144,196,229,.06));
    }
    .coordinate-field input[aria-invalid="true"],
    .facing-input-wrap input[aria-invalid="true"] {
      border-color: var(--color-text-error, #d36a6a);
    }
    .facing-field {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 5px;
      margin-top: 8px;
    }
    .facing-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .facing-name {
      overflow: hidden;
      color: var(--color-accent-on-tint, #c4e3f5);
      font-size: 9px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .facing-input-wrap {
      position: relative;
      display: grid;
      align-items: center;
      grid-template-columns: 34px minmax(0, 1fr);
    }
    .facing-input-wrap input {
      padding-right: 24px;
    }
    .facing-preview {
      position: relative;
      z-index: 1;
      display: grid;
      width: 24px;
      height: 24px;
      margin-left: 5px;
      place-items: center;
      border: 1px solid var(--color-border-primary, rgba(255,255,255,.1));
      border-radius: 50%;
      background: rgba(255,255,255,.025);
      pointer-events: none;
    }
    .facing-preview::after {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--color-text-tertiary, rgba(255,255,255,.55));
      content: "";
    }
    .facing-preview-pointer {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 8px;
      height: 7px;
      background: var(--color-accent-on-tint, #c4e3f5);
      clip-path: polygon(50% 0, 96% 82%, 4% 82%);
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.5));
      transform:
        translate(-50%, -50%)
        rotate(var(--facing-angle, 180deg))
        translateY(-10px);
    }
    .degree {
      position: absolute;
      right: 9px;
      color: var(--color-text-tertiary, rgba(255,255,255,.55));
      font-family: var(--font-mono, ui-monospace, monospace);
      pointer-events: none;
    }
    .coord-hint {
      margin: 7px 0 0;
      color: var(--color-text-tertiary, rgba(255,255,255,.55));
      font-size: 9px;
      line-height: 1.45;
    }
    .cast { max-height: 322px; overflow: auto; padding: 6px; }
    .cast-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 4px 5px 7px;
    }
    .cast-meta {
      color: var(--color-text-tertiary, rgba(255,255,255,.55));
      font-size: 9px;
    }
    .cast-row {
      display: grid;
      width: 100%;
      align-items: center;
      gap: 7px;
      border: 0;
      border: 1px solid transparent;
      border-radius: var(--r-sm, 8px);
      background: transparent;
      color: var(--color-text-secondary, rgba(255,255,255,.7));
      cursor: pointer;
      grid-template-columns: 30px minmax(0,1fr) auto;
      min-height: 43px;
      padding: 6px 7px 6px 5px;
      text-align: left;
      transition: border-color 120ms ease, background 120ms ease, color 120ms ease;
    }
    .cast-avatar {
      position: relative;
      display: grid;
      width: 28px;
      height: 28px;
      overflow: hidden;
      place-items: center;
      border: 1px solid var(--color-border-primary, rgba(255,255,255,.1));
      border-radius: 50%;
      background: var(--color-background-secondary, rgba(255,255,255,.08));
      color: var(--color-text-secondary, rgba(255,255,255,.7));
      font-size: 9px;
      font-weight: 600;
    }
    .cast-avatar .avatar-fallback { position: absolute; inset: 0; }
    .cast-row:hover { background: var(--interaction-hover, rgba(255,255,255,.05)); }
    .cast-row.selected {
      border-color: var(--color-border-info, rgba(144,196,229,.3));
      background: var(--color-accent-12, rgba(144,196,229,.12));
      color: var(--color-text-primary, rgba(255,255,255,.95));
    }
    .cast-index {
      position: absolute;
      z-index: 2;
      right: -1px;
      bottom: -1px;
      min-width: 13px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 7px;
      background: rgba(14,14,14,.86);
      color: var(--color-text-tertiary, rgba(255,255,255,.55));
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 6px;
      font-variant-numeric: tabular-nums;
      line-height: 11px;
      opacity: .68;
      text-align: center;
    }
    .cast-row.selected .cast-index {
      color: var(--color-accent-on-tint, #c4e3f5);
      opacity: .82;
    }
    .cast-identity {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 1px;
    }
    .cast-name {
      overflow: hidden;
      font-size: 11px;
      font-weight: 550;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .cast-role {
      overflow: hidden;
      color: var(--color-text-tertiary, rgba(255,255,255,.55));
      font-size: 9px;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .cast-row.selected .cast-role {
      color: var(--color-text-secondary, rgba(255,255,255,.7));
    }
    .cast-coordinate {
      align-self: start;
      color: var(--color-text-tertiary, rgba(255,255,255,.55));
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 9px;
      font-variant-numeric: tabular-nums;
      line-height: 1.4;
      padding-top: 1px;
    }

    .footer {
      display: grid;
      min-height: 36px;
      align-items: center;
      gap: 8px 14px;
      grid-template-columns: minmax(0, 1fr) auto;
      padding: 0 2px;
    }
    .actions {
      display: flex;
      grid-column: 2;
      grid-row: 1;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }
    .revise {
      height: 34px;
      border: 1px solid var(--color-border-primary, rgba(255,255,255,.1));
      border-radius: var(--r-sm, 8px);
      background: transparent;
      color: var(--color-text-secondary, rgba(255,255,255,.7));
      cursor: pointer;
      font-size: 11px;
      padding: 0 12px;
      transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
    }
    .revise:hover {
      border-color: var(--color-border-secondary, rgba(255,255,255,.16));
      background: var(--interaction-hover, rgba(255,255,255,.05));
      color: var(--color-text-primary, rgba(255,255,255,.95));
    }
    .submit {
      height: 34px;
      min-width: 126px;
      border: 1px solid var(--color-text-primary, rgba(255,255,255,.95));
      border-radius: var(--r-sm, 8px);
      background: var(--color-text-primary, rgba(255,255,255,.95));
      color: var(--color-accent-fg, #0f0f0f);
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      padding: 0 14px;
      transition: opacity 120ms ease, transform 120ms ease;
    }
    .submit:hover:not(:disabled) { opacity: .9; }
    .submit:active:not(:disabled) { transform: translateY(1px); }
    .submit:disabled { cursor: default; opacity: .55; }
    .status {
      min-height: 16px;
      grid-column: 1;
      grid-row: 1;
      margin: 0;
      color: var(--color-text-error, #d36a6a);
      font-size: 11px;
      text-align: left;
    }

    @media (max-width: 720px) {
      .workspace { grid-template-columns: 1fr; }
      .inspector { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
      .cast { max-height: 220px; }
    }
    @media (max-width: 520px) {
      .tool-button.snap { margin-left: 0; }
      .blocking { gap: 10px; }
      .workspace { gap: 9px; }
      .stage-shell { padding-right: 16px; padding-left: 16px; }
      .depth-axis { left: 16px; }
      .camera-bank { right: 16px; left: 16px; }
      .stage.portrait { width: min(68%, 270px); }
      .stage.squareish { width: min(88%, 390px); }
      .inspector { display: flex; }
      .cast { max-height: 220px; }
      .marker-caption { max-width: 72px; }
      .footer { grid-template-columns: 1fr; }
      .status { grid-column: 1; grid-row: 1; }
      .actions { grid-column: 1; grid-row: 2; }
      .actions > button { flex: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .stage,
      .marker,
      .marker-body,
      .facing-handle,
      .facing-ray,
      .select,
      .tool-button,
      .cast-row,
      .coordinate-field input,
      .revise,
      .submit { transition: none; }
    }
