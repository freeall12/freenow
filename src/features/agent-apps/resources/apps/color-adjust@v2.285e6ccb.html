<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Color Adjust</title>
  <style>
    /* 基础样式全部走 CSS 变量：值由沙箱 proxy 注入的设计令牌与宿主 hostContext 提供。 */
    html, body { margin: 0; padding: 0; background: transparent; }
    body {
      font-family: var(--font-sans, sans-serif);
      color: var(--color-text-primary, #eee);
      font-size: 13px;
      line-height: 1.5;
    }
    .panel {
      padding: 4px 2px;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      align-items: flex-start;
    }

    /* 预览台：canvas 显示实时调色结果，按住对比原图。 */
    .stage {
      width: 220px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .stage-frame {
      border: 1px solid var(--color-border-primary, rgba(255, 255, 255, 0.1));
      border-radius: var(--border-radius-lg, 16px);
      background: var(--color-background-secondary, rgba(255, 255, 255, 0.03));
      padding: 6px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      min-height: 120px;
    }
    .stage-frame canvas {
      max-width: 100%;
      height: auto;
      border-radius: var(--border-radius-sm, 8px);
      touch-action: none;
      cursor: pointer;
      display: block;
    }
    .stage-hint {
      font-size: 11px;
      color: var(--color-text-secondary, #aaa);
      text-align: center;
      margin: 0;
    }
    .stage-fallback {
      font-size: 12px;
      color: var(--color-text-secondary, #aaa);
      padding: 24px 8px;
      text-align: center;
    }

    .controls {
      /* 对齐画布工具栏：控件列不随聊天宽度无限拉伸，滑杆保持克制的长度。 */
      flex: 1;
      min-width: 240px;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      justify-content: center;
    }
    /* 工具 chips：自动建议 / 重置。 */
    .chips { display: flex; gap: 8px; margin-bottom: 4px; }
    .chip {
      font: inherit;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid var(--color-border-primary, rgba(255, 255, 255, 0.15));
      background: none;
      color: var(--color-text-secondary, #aaa);
      cursor: pointer;
      transition: color 0.12s ease, border-color 0.12s ease, background 0.12s ease;
    }
    .chip:hover { color: var(--color-text-primary, #eee); }
    .chip.on {
      background: var(--color-text-primary, #eee);
      border-color: var(--color-text-primary, #eee);
      color: #111;
    }

    /* tab 行：光效 / 色彩 / 效果。 */
    .tabs { display: flex; gap: 4px; margin-bottom: 4px; }
    .tab {
      font: inherit;
      font-size: 11px;
      font-weight: 500;
      padding: 3px 12px;
      border-radius: var(--border-radius-sm, 8px);
      border: 1px solid transparent;
      background: none;
      color: var(--color-text-secondary, #aaa);
      cursor: pointer;
      transition: color 0.12s ease, border-color 0.12s ease, background 0.12s ease;
    }
    .tab:hover { color: var(--color-text-primary, #eee); }
    .tab.on {
      background: var(--color-background-secondary, rgba(255, 255, 255, 0.06));
      border-color: var(--color-border-primary, rgba(255, 255, 255, 0.15));
      color: var(--color-text-primary, #eee);
    }
    /* 该组存在非零参数时点亮小圆点，切走后也能看见改动散布。 */
    .tab-dot {
      display: none;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: currentColor;
      margin-left: 5px;
      vertical-align: 2px;
    }
    .tab.changed .tab-dot { display: inline-block; }

    /* 以默认展开的色彩高级区为基准，切换到光效/效果时面板高度不跳。 */
    .sliders { min-height: 266px; display: flex; flex-direction: column; gap: 2px; }

    /* 滑杆行：标签(92px) | 短轨道(flex) | 数值(48px)，视觉复刻工具栏 ControlRow。 */
    .control-row {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 32px;
    }
    .control-label {
      width: 92px;
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.4);
      white-space: nowrap;
    }
    .track-wrap {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      height: 100%;
    }
    .track {
      width: 100%;
      height: 1.5px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      position: relative;
      overflow: hidden;
    }
    /* 填充段：从默认值位置（0 → 轨道中点）到当前值（工具栏的 origin-fill 逻辑）。 */
    .fill {
      position: absolute;
      top: 0;
      bottom: 0;
      background: #fff;
    }
    .thumb {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
      pointer-events: none;
    }
    .track-wrap input[type="range"] {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      margin: 0;
      padding: 0;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      z-index: 2;
    }
    .control-value {
      width: 48px;
      flex-shrink: 0;
      text-align: right;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.5);
      font-family: var(--font-mono, ui-monospace, monospace);
      font-variant-numeric: tabular-nums;
    }
    .control-value.active { color: rgba(255, 255, 255, 0.9); }

    .advanced-toggle {
      width: 100%;
      height: 28px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0;
      border: 0;
      background: none;
      color: var(--color-text-secondary, #aaa);
      font: inherit;
      font-size: 11px;
      cursor: pointer;
      text-align: left;
    }
    .advanced-toggle:hover { color: var(--color-text-primary, #eee); }
    .advanced-dot {
      display: none;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: currentColor;
    }
    .advanced-toggle.changed .advanced-dot { display: inline-block; }
    .advanced-chevron {
      margin-left: auto;
      font-size: 14px;
      line-height: 1;
      transform: rotate(0deg);
      transition: transform 0.12s ease;
    }
    .advanced-toggle.open .advanced-chevron { transform: rotate(180deg); }
    .advanced-sliders { display: flex; flex-direction: column; gap: 2px; }

    .actions { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
    .apply {
      font: inherit;
      font-weight: 600;
      color: #111;
      background: var(--color-text-primary, #eee);
      border: none;
      border-radius: var(--border-radius-sm, 8px);
      padding: 7px 14px;
      cursor: pointer;
    }
    .apply:disabled { opacity: 0.5; cursor: default; }
    .skip {
      font: inherit;
      font-size: 12px;
      color: var(--color-text-secondary, #aaa);
      background: none;
      border: none;
      cursor: pointer;
      padding: 7px 6px;
    }
    .skip:hover { color: var(--color-text-primary, #eee); }
    .action-hint {
      font-size: 11px;
      color: var(--color-text-secondary, #aaa);
      margin: 4px 0 0;
    }
    .status { font-size: 12px; margin: 4px 0 0; min-height: 1em; }
    .status.ok { color: var(--color-text-success, #7cd5a7); }
    .status.err { color: var(--color-text-danger, #d36a6a); }
    .status.warn { color: var(--color-text-warning, #fdce8b); }
  </style>
