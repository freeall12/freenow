<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Previs</title>
  <style>
    html, body { margin: 0; padding: 0; background: transparent; }
    /* Keep native scrolling visible without a light track in the dark panel. */
    * { scrollbar-color: var(--color-text-tertiary) transparent; }
    ::-webkit-scrollbar { width: 8px; height: 8px; background: transparent; }
    ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--color-text-tertiary);
      border: 2px solid transparent;
      border-radius: 8px;
      background-clip: padding-box;
    }
    body {
      font-family: var(--font-sans, sans-serif);
      color: var(--color-text-primary);
      font-size: 13px;
      line-height: 1.5;
    }
    button { font: inherit; }
    .animatic {
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      width: 100%;
      height: min(880px, calc(100vh - 16px));
      max-height: min(880px, 100vh);
      min-height: 320px;
      overflow: hidden;
      border: 1px solid var(--color-border-primary);
      border-radius: var(--r-lg);
      background:
        radial-gradient(circle at 5% 0%, var(--color-accent-12), transparent 32%),
        var(--color-background);
    }
    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .header {
      display: grid;
      flex: 0 0 auto;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px 16px;
      align-items: center;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--color-border-primary);
    }
    .title-block { min-width: 0; }
    .kicker {
      display: block;
      color: var(--color-text-info);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1 {
      overflow: hidden;
      margin: 2px 0 0;
      color: var(--color-text-primary);
      font-size: 16px;
      font-weight: 600;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .stats {
      display: flex;
      grid-column: 1;
      gap: 10px;
      color: var(--color-text-tertiary);
      font-size: 11px;
      white-space: nowrap;
    }
    .stats span + span::before {
      content: "·";
      margin-right: 10px;
      color: var(--color-border-secondary);
    }
    .content {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      padding: 12px 16px;
    }
    .player-stack {
      width: 100%;
      max-width: 960px;
      margin-inline: auto;
    }
    .stage {
      position: relative;
      overflow: hidden;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: var(--r-md);
      background: #0b0b0b;
      box-shadow: inset 0 0 0 1px var(--color-border-primary);
    }
    .frame-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transition: opacity 40ms linear;
    }
    .previous-frame { z-index: 1; }
    .current-frame { z-index: 2; }
    .source-sheet-frame { background: #0b0b0b; }
    .hud {
      position: absolute;
      z-index: 4;
      max-width: 45%;
      padding: 3px 6px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 4px;
      background: rgba(0,0,0,.58);
      color: rgba(255,255,255,.88);
      font-family: var(--font-mono);
      font-size: 9px;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
      overflow: hidden;
      backdrop-filter: blur(5px);
      pointer-events: none;
    }
    .hud-top-left { top: 10px; left: 10px; }
    .hud-top-right { top: 10px; right: 10px; text-align: right; }
    .hud-bottom-left { bottom: 10px; left: 10px; }
    .shot-badge {
      position: absolute;
      z-index: 3;
      top: 10px;
      left: 10px;
      padding: 3px 8px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: var(--r-pill);
      background: rgba(0,0,0,.64);
      color: rgba(255,255,255,.92);
      font-family: var(--font-mono);
      font-size: 10px;
      backdrop-filter: blur(8px);
    }
    .image-error, .empty {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 180px;
      padding: 24px;
      color: var(--color-text-tertiary);
      text-align: center;
    }
    .shot-progress-track {
      height: 2px;
      overflow: hidden;
      margin-top: 8px;
      border-radius: var(--r-pill);
      background: var(--color-background-secondary);
    }
    .shot-progress {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: var(--color-accent);
    }
    .edited-pill, .edited-stat { color: var(--color-text-info); }
    .controls {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 0 10px;
    }
    .icon-button, .play-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--color-border-secondary);
      border-radius: 50%;
      background: var(--color-background-secondary);
      color: var(--color-text-primary);
      cursor: pointer;
    }
    .icon-button { width: 28px; height: 28px; }
    .play-button {
      width: 34px;
      height: 34px;
      border-color: transparent;
      background: var(--color-accent);
      color: var(--color-accent-fg);
      font-size: 12px;
    }
    button:disabled {
      cursor: default;
      opacity: .38;
    }
    .time {
      margin-left: 3px;
      color: var(--color-text-primary);
      font-family: var(--font-mono);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }
    .sheet-label {
      overflow: hidden;
      margin-left: auto;
      color: var(--color-text-tertiary);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .timeline-shell {
      display: grid;
      grid-template-columns: 56px minmax(0, 1fr);
      margin-top: 4px;
      border: 1px solid var(--color-border-primary);
      border-radius: var(--r-md);
      background: color-mix(in srgb, var(--color-background-secondary) 55%, transparent);
    }
    .timeline-scroll { grid-column: 2; grid-row: 1; min-width: 0; overflow-x: auto; padding-bottom: 3px; }
    .timeline-labels { grid-column: 1; grid-row: 1; padding-top: 2px; padding-bottom: 3px; border-right: 1px solid var(--color-border-primary); }
    .timeline-warning { grid-column: 1 / -1; }
    .timeline-track { position: relative; min-width: 100%; padding-top: 2px; }
    .timeline-lane, .timeline-heading {
      position: relative;
      border-bottom: 1px solid var(--color-border-primary);
    }
    .timeline-lane:last-child, .timeline-heading:last-child { border-bottom: 0; }
    .lane-label {
      box-sizing: border-box;
      display: inline-flex;
      align-items: center;
      width: 100%;
      height: 100%;
      padding: 0 12px;
      background: var(--color-background-primary);
      color: var(--color-text-tertiary);
      font-size: 9px;
      pointer-events: none;
    }
    .ruler-lane, .ruler-heading { height: 23px; }
    .ruler-tick {
      position: absolute;
      bottom: 1px;
      border-left: 1px solid var(--color-border-secondary);
      padding-left: 3px;
      color: var(--color-text-tertiary);
      font-family: var(--font-mono);
      font-size: 8px;
      line-height: 13px;
    }
    .picture-lane { height: 42px; }
    .timeline-shot {
      position: absolute;
      top: 5px;
      overflow: hidden;
      height: 32px;
      min-width: 18px;
      border: 1px solid var(--color-border-secondary);
      border-radius: 5px;
      padding: 0 10px 10px 5px;
      background: var(--color-background-secondary);
      color: var(--color-text-tertiary);
      font-family: var(--font-mono);
      font-size: 9px;
      text-align: left;
      white-space: nowrap;
      cursor: pointer;
    }
    .timeline-shot.played { background: var(--color-accent-12); }
    .timeline-shot.active { border-color: var(--color-accent); color: var(--color-text-primary); }
    .timeline-shot.edited::before {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--color-accent);
      content: "";
    }
    .timeline-shot.edited { padding-left: 10px; }
    .timeline-shot.invalid { border-color: var(--color-text-error); }
    .timeline-shot.variant-pending { border-color: var(--color-text-warning); }
    .timeline-shot.variant-failed { border-color: var(--color-text-error); }
    .timeline-shot.dragging { opacity: .45; }
    .timeline-shot.drop-before {
      border-color: var(--color-accent);
      box-shadow: inset 3px 0 0 var(--color-accent);
    }
    .timeline-shot.drop-after {
      border-color: var(--color-accent);
      box-shadow: inset -3px 0 0 var(--color-accent);
    }
    .timeline-shot-duration {
      position: absolute;
      right: 6px;
      bottom: 1px;
      color: var(--color-text-tertiary);
      font-size: 8px;
      opacity: 0;
      transition: opacity 120ms ease;
    }
    .sequence-shot:hover .timeline-shot-duration,
    .sequence-shot:focus-visible .timeline-shot-duration,
    .sequence-shot.resizing .timeline-shot-duration { opacity: 1; }
    .duration-handle {
      position: absolute;
      z-index: 2;
      top: 0;
      right: 0;
      width: 7px;
      height: 100%;
      border-left: 1px solid var(--color-border-secondary);
      background: color-mix(in srgb, var(--color-accent) 15%, transparent);
      cursor: ew-resize;
      touch-action: none;
    }
    .dialogue-lane, .dialogue-heading { height: 34px; }
    .dialogue-bar {
      position: absolute;
      top: 5px;
      overflow: hidden;
      height: 24px;
      min-width: 12px;
      border: 1px solid color-mix(in srgb, var(--color-text-info) 45%, transparent);
      border-radius: 4px;
      padding: 2px 6px;
      background: color-mix(in srgb, var(--color-text-info) 10%, var(--color-background));
      color: var(--color-text-secondary);
      font-size: 9px;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
    }
    .dialogue-bar.conflict {
      border-color: var(--color-text-error);
      background: color-mix(in srgb, var(--color-text-error) 12%, var(--color-background));
      color: var(--color-text-error);
    }
    .timeline-warning {
      padding: 6px 9px;
      border-top: 1px solid color-mix(in srgb, var(--color-text-error) 30%, transparent);
      color: var(--color-text-error);
      font-size: 10px;
    }
    .inspector {
      margin-top: 10px;
      padding: 10px;
      border: 1px solid var(--color-border-primary);
      border-radius: var(--r-md);
      background: var(--color-background-primary);
    }
    .inspector-heading { display: flex; justify-content: space-between; gap: 12px; }
    .inspector-heading strong { font-size: 11px; }
    .inspector-heading span { color: var(--color-text-tertiary); font-family: var(--font-mono); font-size: 10px; }
    .inspector-fields {
      display: grid;
      grid-template-columns: repeat(4, minmax(100px, 1fr));
      gap: 8px;
      margin-top: 9px;
    }
    .inspector-field { display: flex; min-width: 0; flex-direction: column; gap: 4px; }
    .inspector-label { color: var(--color-text-tertiary); font-size: 9px; }
    .inspector input, .inspector select, .shot-text-editor {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid var(--color-border-secondary);
      border-radius: var(--r-sm);
      padding: 6px 7px;
      background: var(--color-background-secondary);
      color: var(--color-text-primary);
      font: inherit;
      font-size: 11px;
    }
    .shot-text-editor {
      display: block;
      width: 100%;
      min-height: 42px;
      box-sizing: border-box;
      margin-top: 5px;
      resize: vertical;
      line-height: 1.45;
    }
    .dialogue-editor { min-height: 42px; }
    .dialogue-inspector {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 10px;
      align-items: center;
      margin-top: 9px;
      padding-top: 9px;
      border-top: 1px solid var(--color-border-primary);
    }
    .dialogue-copy { min-width: 0; }
    .dialogue-copy p { overflow: hidden; margin: 2px 0 0; color: var(--color-text-secondary); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .dialogue-timing { color: var(--color-text-tertiary); font-family: var(--font-mono); font-size: 10px; }
    .dialogue-timing.conflict { color: var(--color-text-error); }
    .align-button {
      border: 1px solid var(--color-border-secondary);
      border-radius: var(--r-pill);
      padding: 5px 9px;
      background: transparent;
      color: var(--color-text-secondary);
      font-size: 10px;
      cursor: pointer;
    }
    .size-editor {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--color-border-primary);
    }
    .size-editor-heading {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }
    .stale-warning { color: var(--color-text-warning); font-size: 9px; }
    .size-pills { display: flex; flex-wrap: nowrap; gap: 4px; margin-top: 6px; overflow-x: auto; }
    .size-pill {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      min-width: 38px;
      border: 1px solid var(--color-border-secondary);
      border-radius: var(--r-pill);
      padding: 4px 8px;
      background: transparent;
      color: var(--color-text-secondary);
      font-family: var(--font-mono);
      font-size: 9px;
      cursor: pointer;
    }
    .size-label-primary { font-family: var(--font-sans); font-size: 9px; line-height: 1.15; }
    .size-label-code { color: var(--color-text-tertiary); font-family: var(--font-mono); font-size: 7px; line-height: 1.15; }
    .size-pill.active { border-color: var(--color-accent); color: var(--color-text-primary); }
    .variant-generate {
      margin-top: 9px;
      border: 1px solid transparent;
      border-radius: var(--r-pill);
      padding: 6px 11px;
      background: var(--color-accent);
      color: var(--color-accent-fg);
      font-size: 10px;
      cursor: pointer;
    }
    .variant-price { margin-left: 8px; color: var(--color-text-tertiary); font-size: 9px; }
    .variant-status { margin-top: 9px; font-size: 10px; }
    .variant-status.pending { color: var(--color-text-warning); }
    .variant-status.failed { color: var(--color-text-error); }
    .variant-status-query-error { margin-top: 4px; color: var(--color-text-warning); font-size: 9px; }
    .preview-variant-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      margin-top: 9px;
    }
    .preview-variant-grid {
      position: absolute;
      z-index: 8;
      inset: 0;
      box-sizing: border-box;
      margin: 0;
      padding: 10px;
      background: color-mix(in srgb, #080808 92%, transparent);
    }
    .preview-variant-grid .variant-choice { min-height: 0; }
    .variant-choice {
      position: relative;
      overflow: hidden;
      min-height: 74px;
      border: 1px solid var(--color-border-secondary);
      border-radius: var(--r-sm);
      padding: 0;
      background: #0b0b0b;
      color: white;
      cursor: pointer;
    }
    .variant-choice.active { border-color: var(--color-accent); box-shadow: 0 0 0 1px var(--color-accent); }
    .variant-thumbnail { position: absolute; inset: 0; width: 100%; height: 100%; }
    .variant-label {
      position: absolute;
      z-index: 2;
      right: 4px;
      bottom: 4px;
      border-radius: var(--r-pill);
      padding: 1px 5px;
      background: rgba(0,0,0,.68);
      color: white;
      font-size: 8px;
    }
    .variant-label .size-label-primary,
    .variant-label .size-label-code { display: block; color: inherit; }
    .inspector-destructive {
      display: flex;
      justify-content: flex-end;
      margin-top: 9px;
      padding-top: 9px;
      border-top: 1px solid var(--color-border-primary);
    }
    .delete-shot-button {
      border: 1px solid color-mix(in srgb, var(--color-text-error) 45%, transparent);
      border-radius: var(--r-pill);
      padding: 5px 9px;
      background: transparent;
      color: var(--color-text-error);
      font-size: 10px;
      cursor: pointer;
    }
    .footer {
      display: flex;
      flex: 0 0 auto;
      gap: 8px;
      align-items: center;
      min-height: 36px;
      padding: 10px 16px;
      border-top: 1px solid var(--color-border-primary);
      background: var(--color-background-primary);
    }
    .spacer { flex: 1; }
    .primary-button, .secondary-button {
      border-radius: var(--r-pill);
      padding: 7px 14px;
      cursor: pointer;
      font-size: 12px;
    }
    .primary-button {
      border: 1px solid transparent;
      background: var(--color-accent);
      color: var(--color-accent-fg);
      font-weight: 600;
    }
    .secondary-button {
      border: 1px solid var(--color-border-secondary);
      background: transparent;
      color: var(--color-text-secondary);
    }
    .send-error { color: var(--color-text-error); font-size: 11px; }
    .state-warning { color: var(--color-text-warning); font-size: 10px; }
    .footer-status { color: var(--color-text-secondary); font-size: 11px; }
    .footer-status.submitted { display: inline-flex; align-items: center; gap: 6px; }
    .footer-status.ready::before { content: "✓ "; color: var(--color-text-success); }
    .player-workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(250px, 310px);
      gap: 12px;
      align-items: stretch;
    }
    .player-preview { min-width: 0; max-width: none; margin: 0; }
    .player-preview .stage {
      width: auto;
      max-width: 100%;
      height: min(46vh, 500px);
      margin-inline: auto;
    }
    .player-workspace > .inspector {
      min-height: 0;
      max-height: min(46vh, 500px);
      margin-top: 0;
      overflow-x: hidden;
      overflow-y: auto;
      scrollbar-gutter: stable;
    }
    .text-state-workspace .player-preview .stage { height: min(34vh, 360px); }
    .text-state-workspace > .inspector { max-height: min(34vh, 360px); }
    .inspector-section { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--color-border-primary); }
    .option-pills { display: flex; flex-wrap: nowrap; gap: 4px; margin: 4px 0 6px; overflow-x: auto; }
    .option-pill {
      border: 1px solid var(--color-border-secondary);
      border-radius: var(--r-pill);
      padding: 4px 7px;
      background: transparent;
      color: var(--color-text-secondary);
      font-size: 9px;
      cursor: pointer;
    }
    .option-pill.active { border-color: var(--color-accent); background: var(--color-accent-12); color: var(--color-text-primary); }
    .duration-readout { display: flex; gap: 8px; align-items: center; }
    .duration-input { width: 68px !important; padding: 4px 6px !important; font-family: var(--font-mono) !important; }
    .dialogue-inspector { grid-template-columns: minmax(0, 1fr) auto; }
    .inspector-footer { display: flex; justify-content: space-between; gap: 8px; align-items: center; margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--color-border-primary); }
    .inspector-destructive { margin-top: 0; padding-top: 0; border-top: 0; }
    .description-section { margin-top: 7px; }
    .description-section .shot-text-editor { resize: none; }
    .inspector-readonly { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--color-text-tertiary); font-family: var(--font-mono); font-size: 8px; line-height: 1.5; }
    .source-preview-toggle {
      border: 1px solid var(--color-border-secondary);
      border-radius: var(--r-pill);
      padding: 3px 7px;
      background: transparent;
      color: var(--color-text-secondary);
      font-family: var(--font-mono);
      font-size: 8px;
      cursor: pointer;
    }
    .source-preview-toggle:hover, .source-preview-toggle.active { border-color: var(--color-accent); color: var(--color-text-primary); }
    .source-preview-toggle:disabled { opacity: .42; cursor: default; }
    .shot-empty {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      justify-content: center;
      padding: 28px;
      color: var(--color-text-tertiary);
      text-align: center;
    }
    .shot-empty strong { color: var(--color-text-primary); font-family: var(--font-mono); font-size: 18px; }
    .shot-empty p { max-width: 520px; margin: 0; color: var(--color-text-secondary); font-size: 13px; }
    .shot-empty span { font-size: 10px; }
    .beat-lane, .beat-heading { height: 32px; }
    .beat-segment {
      position: absolute;
      top: 5px;
      overflow: hidden;
      height: 22px;
      min-width: 18px;
      box-sizing: border-box;
      border-left: 2px solid var(--color-text-info);
      border-radius: 3px;
      padding: 3px 6px;
      background: color-mix(in srgb, var(--color-text-info) 10%, var(--color-background));
      color: var(--color-text-secondary);
      font-size: 9px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sequence-lane, .sequence-heading { height: 48px; }
    .sequence-shot { top: 5px; height: 38px; padding: 4px 12px 11px 6px; }
    .sequence-code, .sequence-description { display: block; overflow: hidden; text-overflow: ellipsis; }
    .sequence-code { color: var(--color-text-primary); font-size: 9px; }
    .sequence-description { margin-top: 1px; color: var(--color-text-tertiary); font-family: var(--font-sans); font-size: 8px; }
    .transition-gap {
      position: absolute;
      z-index: 7;
      top: 13px;
      width: 18px;

    .header { padding: 12px 16px 10px; background: var(--color-background); }

    .size-label-code, .duration-input, .footer-status {

    .inspector-heading { align-items: baseline; padding-bottom: 7px; border-bottom: 1px solid var(--color-border-primary); }

    .inspector-section { margin-top: 12px; padding-top: 12px; border-color: var(--color-border-primary); }
