<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ad Review</title>
  <style>
    /* 基础样式全部走 CSS 变量：静态兜底由 shared/design-tokens.css 构建期内联，
       官方标准变量由宿主 hostContext.styles.variables 运行时覆盖。 */
    html, body { margin: 0; padding: 0; background: transparent; }
    body {
      font-family: var(--font-sans, sans-serif);
      color: var(--color-text-primary, #eee);
      font-size: 13px;
      line-height: 1.5;
    }

    /* 全宽面板：不设 max-width，交给卡片宽度。 */
    .arv { padding: 4px 2px; display: flex; flex-direction: column; gap: 10px; }
    .arv .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

    /* 批次头：stage 标题 + product · label。 */
    .arv .hd { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .arv .kick { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; font-weight: 600; color: var(--color-text-info, #90c4e5); }
    .arv .ttl { font-size: 15px; font-weight: 500; color: var(--color-text-primary, #eee); }
    .arv .bnote { font-size: 12px; color: var(--color-text-secondary, #aaa); }
    /* 反自欺提醒行（模板内置文案）。 */
    .arv .reminder {
      font-size: 12px;
      color: var(--color-text-secondary, #aaa);
      border-left: 2px solid var(--color-border-info, rgba(144, 196, 229, 0.3));
      padding-left: 8px;
    }

    /* 素材网格：全宽自适应，1–12 张 9:16 素材卡。 */
    .arv .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
      gap: 10px;
    }
    .arv .card {
      background: var(--color-background-primary, #1f1f1f);
      border: 1px solid var(--color-border-primary, rgba(255, 255, 255, 0.1));
      border-radius: var(--r-md, 12px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 预览位：竖版素材 9:16，图/视频统一 cover；lightbox 里看全图。 */
    .arv .media { position: relative; aspect-ratio: 9 / 16; background: var(--color-background-secondary, rgba(255, 255, 255, 0.08)); }
    .arv .media img, .arv .media video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .arv .media > img { cursor: zoom-in; }
    .arv .poster-wrap { position: relative; width: 100%; height: 100%; }
    .arv .media-hint {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      padding: 14px 8px 6px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.85);
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.75));
      pointer-events: none;
    }
    /* 预览彻底不可用：combo + node_title 指认卡，评审不中断。 */
    .arv .media-fallback {
      width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 6px; padding: 12px; box-sizing: border-box; text-align: center;
    }
    .arv .fallback-combo { font-family: var(--font-mono, monospace); font-size: 13px; font-weight: 600; color: var(--color-text-primary, #eee); }
    .arv .fallback-note { font-size: 11px; color: var(--color-text-secondary, #aaa); }

    /* 卡片正文：combo 徽标 + hook、angle × persona、meta、标记、备注。 */
    .arv .card-body { display: flex; flex-direction: column; gap: 6px; padding: 8px; }
    .arv .card-head { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
    .arv .combo {
      flex-shrink: 0;
      font-family: var(--font-mono, monospace);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .04em;
      color: var(--color-accent-on-tint, #c3dff0);
      background: var(--color-accent-tint, rgba(144, 196, 229, 0.18));
      border-radius: var(--r-pill, 999px);
      padding: 1px 7px;
    }
    .arv .hook {
      font-size: 12px;
      color: var(--color-text-primary, #eee);
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .arv .sub { font-size: 11px; color: var(--color-text-secondary, #aaa); }
    .arv .meta { font-size: 10px; font-family: var(--font-mono, monospace); color: var(--color-text-tertiary, #999); }

    /* 标记按钮：可撤销互斥 pill；胜出用强调色、淘汰/回炉选中走警示色。 */
    .arv .marks { display: flex; gap: 6px; flex-wrap: wrap; }
    .arv .mark {
      font: inherit;
      font-size: 11px;
      padding: 3px 12px;
      border-radius: var(--r-pill, 999px);
      border: 1px solid var(--color-border-secondary, rgba(255, 255, 255, 0.1));
      background: none;
      color: var(--color-text-secondary, #aaa);
      cursor: pointer;
      transition: color .12s ease, border-color .12s ease, background .12s ease;
    }
    .arv .mark:hover { color: var(--color-text-primary, #eee); }
    .arv .mark.on { color: var(--color-text-primary, #eee); border-color: transparent; background: var(--color-accent-tint-strong, rgba(144, 196, 229, 0.28)); }
    .arv .mark.m-win.on { color: var(--color-accent-fg, #0f0f0f); background: var(--color-accent, #90c4e5); }
    .arv .mark.m-cull.on { color: var(--color-text-error, #d36a6a); border-color: var(--color-text-error, #d36a6a); background: none; }

    .arv .note-input {
      width: 100%;
      box-sizing: border-box;
      font: inherit;
      font-size: 12px;
      color: var(--color-text-primary, #eee);
      background: var(--color-background-secondary, rgba(255, 255, 255, 0.05));
      border: 1px solid var(--color-border-secondary, rgba(255, 255, 255, 0.1));
      border-radius: var(--r-sm, 8px);
      padding: 5px 8px;
      outline: none;
    }
    .arv .note-input:focus { border-color: rgba(255, 255, 255, 0.3); }

    /* 底部：逃逸（左）+ 状态/门槛提示 + 确认（右）。 */
    .arv .ft { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 2px; }
    .arv .ft .sp { flex: 1; }
    .arv .ft .note { font-size: 11px; color: var(--color-text-secondary, #aaa); }
    .arv .ft .status { font-size: 11px; color: var(--color-text-error, #d36a6a); }
    .arv .btn {
      font: inherit;
      font-size: 13px;
      border-radius: var(--r-pill, 999px);
      padding: 5px 14px;
      cursor: pointer;
      border: 1px solid var(--color-border-secondary, rgba(255, 255, 255, 0.1));
      background: var(--color-background-secondary, rgba(255, 255, 255, 0.08));
      color: var(--color-text-primary, #eee);
    }
    .arv .btn.escape { background: none; color: var(--color-text-secondary, #aaa); }
    .arv .btn.escape:hover { color: var(--color-text-primary, #eee); }
    .arv .btn.confirm { font-weight: 600; color: var(--color-accent-fg, #111); background: var(--color-text-primary, #eee); border-color: transparent; }
    .arv .btn.confirm:disabled { opacity: .45; cursor: default; }

    /* lightbox 放大（本地操作）：点击或 Esc 关闭。 */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: rgba(0, 0, 0, 0.82);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: zoom-out;
    }
    .lightbox img { max-width: 92%; max-height: 86%; object-fit: contain; border-radius: var(--r-sm, 8px); }
    .lightbox-hint { font-size: 11px; color: rgba(255, 255, 255, 0.6); }
