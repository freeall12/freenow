<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Kit</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: transparent; }
    body {
      color: var(--color-text-primary, rgba(255,255,255,.95));
      font: 13px/1.4 var(--font-sans, Inter, ui-sans-serif, system-ui, sans-serif);
      -webkit-font-smoothing: antialiased;
    }
    button { color: inherit; font: inherit; }
    button:focus-visible { outline: 2px solid var(--color-accent, #8fb6d9); outline-offset: 2px; }
    .panel { display: flex; width: 100%; max-width: 760px; flex-direction: column; gap: 10px; padding: 8px 4px 4px; }
    .panel.invalid { min-height: 84px; justify-content: center; color: var(--color-text-secondary); }
    .header { display: flex; height: 52px; min-width: 0; align-items: center; gap: 10px; }
    .thumbnail { width: 52px; height: 52px; flex: 0 0 52px; object-fit: cover; border: 1px solid var(--color-border-primary); border-radius: 6px; background: var(--color-background-secondary); }
    .product-image-fallback { display: grid; place-items: center; background: var(--color-background-secondary); color: var(--color-text-tertiary); font-size: 16px; font-weight: 700; }
    .identity { min-width: 0; flex: 1; }
    .title-line { display: flex; min-width: 0; align-items: baseline; gap: 10px; }
    .title { margin: 0; overflow: hidden; font-size: 17px; font-weight: 600; letter-spacing: -.01em; text-overflow: ellipsis; white-space: nowrap; }
    .kit-label, .section-label { color: var(--color-text-tertiary); font-size: 9px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }
    .chips { display: flex; gap: 5px; margin-top: 7px; }
    .chip { border: 1px solid var(--color-border-primary); border-radius: 999px; color: var(--color-text-secondary); font-size: 10px; padding: 2px 7px; }
    .ghost, .primary, .secondary, .option, .ban-option, .amber-button, .hypothesis-toggle {
      min-height: 31px; border: 1px solid var(--color-border-primary); border-radius: 6px; background: transparent; cursor: pointer; padding: 5px 10px;
    }
    .ghost { color: var(--color-text-secondary); font-size: 11.5px; }
    .ghost:hover, .secondary:hover, .option:hover { background: var(--interaction-hover); }
    .primary { border-color: var(--color-accent); background: var(--color-accent); color: var(--color-accent-fg, #111); font-weight: 650; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    .palette-board { display: flex; height: 100px; gap: 6px; }
    .color-card { min-width: 0; flex: 1; overflow: hidden; border: 1px solid var(--color-border-primary); border-radius: 4px; }
    .color-block { height: 72px; }
    .color-info { display: flex; height: 26px; min-width: 0; align-items: center; justify-content: space-between; gap: 4px; background: var(--color-background-secondary); padding: 4px 7px; }
    .color-name { overflow: hidden; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .color-use { overflow: hidden; color: var(--color-text-tertiary); font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
    .tone-look { display: grid; min-height: 78px; gap: 20px; grid-template-columns: minmax(0,.85fr) minmax(0,1.15fr); padding: 3px 0; }
    .tone-summary { min-width: 0; }
    .tone-line { margin-top: 8px; font-size: 12px; }
    .tone-line span { color: var(--color-text-secondary); font-size: 10.5px; }
    .look-summary { min-width: 0; border-left: 2px solid var(--color-accent); padding-left: 12px; }
    .look-sentence { margin: 7px 0 0; color: var(--color-text-secondary); font-size: 11px; font-style: italic; line-height: 1.45; }
    .copy-hypotheses { display: flex; min-height: 30px; align-items: center; gap: 10px; }
    .copy-line { flex: 0 0 auto; color: var(--color-text-secondary); font-size: 11px; }
    .hypothesis-toggle { min-width: 0; flex: 1; overflow: hidden; border-style: dashed; border-color: color-mix(in srgb, var(--color-text-warning) 60%, transparent); background: color-mix(in srgb, var(--color-text-warning) 9%, transparent); color: var(--color-text-warning); font-size: 11px; text-align: left; text-overflow: ellipsis; white-space: nowrap; }
    .hypothesis-list { display: grid; gap: 0; border: 1px dashed color-mix(in srgb, var(--color-text-warning) 55%, transparent); border-radius: 6px; background: color-mix(in srgb, var(--color-text-warning) 6%, transparent); padding: 4px 10px 8px; }
    .hypothesis-row { display: flex; min-width: 0; align-items: center; justify-content: space-between; gap: 10px; border-bottom: 1px solid color-mix(in srgb, var(--color-border-primary) 60%, transparent); padding: 7px 0; font-size: 12px; }
    .amber-button { flex: 0 0 auto; border-color: color-mix(in srgb, var(--color-text-warning) 55%, transparent); color: var(--color-text-warning); font-size: 11px; }
    .hypothesis-note { margin: 7px 0 0; color: var(--color-text-tertiary); font-size: 10px; }
    .footer { display: flex; min-height: 40px; align-items: center; justify-content: flex-end; gap: 12px; border-top: 1px solid var(--color-border-primary); padding-top: 7px; }
    .status { flex: 1; color: var(--color-text-tertiary); font-size: 10px; text-align: right; }
    .editor { display: flex; flex-direction: column; gap: 9px; border-top: 1px solid var(--color-border-primary); padding-top: 9px; }
    .edit-palette { display: grid; min-height: 34px; align-items: center; gap: 8px; grid-template-columns: 72px minmax(0,1fr) 110px; }
    .edit-palette.locked { opacity: .62; }
    .edit-role { color: var(--color-text-secondary); font-size: 11px; }
    .edit-colors, .option-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .color-choice { width: 30px; height: 30px; border: 1px solid rgba(255,255,255,.25); border-radius: 5px; cursor: pointer; padding: 0; }
    .color-choice.selected { border: 2px solid var(--color-text-primary); }
    .edit-source { overflow: hidden; color: var(--color-text-tertiary); font-size: 9px; text-align: right; text-overflow: ellipsis; white-space: nowrap; }
    .edit-section { border-top: 1px solid var(--color-border-primary); padding-top: 9px; }
    .edit-section .section-label { display: block; margin-bottom: 7px; }
    .option { min-height: 29px; color: var(--color-text-secondary); font-size: 10.5px; }
    .option.selected { border-color: var(--color-accent); background: var(--color-accent); color: var(--color-accent-fg, #111); }
    .translation { margin: 6px 0 0; color: var(--color-text-tertiary); font-size: 10px; }
    .ban-option { min-height: 28px; color: var(--color-text-secondary); font-size: 10px; }
    .ban-option.on { border-style: solid; }
    .ban-option.off { border-style: dashed; text-decoration: line-through; opacity: .55; }
    .split { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
    .locked-field { color: var(--color-text-tertiary); font-size: 10px; }
    .look-preview { border-left: 2px solid var(--color-accent); padding-left: 12px; }
    .edit-actions { display: flex; justify-content: flex-end; gap: 7px; border-top: 1px solid var(--color-border-primary); padding-top: 9px; }
    .secondary { color: var(--color-text-secondary); }
    .recall { display: grid; min-height: 84px; align-items: center; gap: 10px; grid-template-columns: 40px minmax(110px,.7fr) minmax(130px,1fr) auto; border: 1px solid var(--color-border-primary); border-radius: 7px; padding: 9px 12px; }
    .recall-thumbnail { width: 40px; height: 40px; object-fit: cover; border: 1px solid var(--color-border-primary); border-radius: 5px; background: var(--color-background-secondary); }
    .recall-identity { display: flex; min-width: 0; flex-direction: column; gap: 3px; }
    .recall-identity strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .recall-identity span, .recall-summary { color: var(--color-text-tertiary); font-size: 9px; }
    .recall-summary { display: flex; min-width: 0; align-items: center; gap: 8px; }
    .recall-colors { display: flex; gap: 3px; }
    .recall-color { width: 20px; height: 20px; border: 1px solid rgba(255,255,255,.18); border-radius: 3px; }
    .recall-actions { display: flex; align-items: center; gap: 6px; }
    @media (max-width: 560px) {
      .color-use { display: none; }
      .tone-look { gap: 10px; grid-template-columns: 1fr; }
      .copy-hypotheses { align-items: stretch; flex-direction: column; }
      .edit-palette { grid-template-columns: 62px minmax(0,1fr); }
      .edit-source { grid-column: 2; text-align: left; }
      .recall { grid-template-columns: 40px 1fr; }
      .recall-summary, .recall-actions { grid-column: 1 / -1; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
