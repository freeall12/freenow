<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Performance Score</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #15161c;
      --ink-raised: #1d1e25;
      --ink-soft: #25262e;
      --paper: #f2eee5;
      --paper-muted: #b7b2aa;
      --paper-faint: #807d79;
      --rule: rgba(242, 238, 229, .13);
      --rule-strong: rgba(242, 238, 229, .24);
      --cobalt: #6e8ed6;
      --coral: #e17462;
      --ochre: #d2a55b;
      --sage: #82b889;
    }

    html, body { margin: 0; padding: 0; background: transparent; }
    body {
      color: var(--paper);
      font-family: "Avenir Next", "SF Pro Display", "PingFang SC", "Noto Sans CJK SC", sans-serif;
      font-size: 13px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; }
    button { color: inherit; }
    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    [tabindex]:focus-visible {
      outline: 2px solid #9bb5f1;
      outline-offset: 3px;
    }
    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .rhythm {
      position: relative;
      width: 100%;
      max-width: 980px;
      box-sizing: border-box;
      overflow: hidden;
      border: 1px solid rgba(242, 238, 229, .12);
      border-radius: 17px;
      background:
        linear-gradient(120deg, rgba(110, 142, 214, .05), transparent 35%),
        var(--ink);
      box-shadow: 0 16px 46px rgba(6, 7, 10, .22);
    }
    .rhythm::before {
      position: absolute;
      inset: 0 0 auto;
      height: 2px;
      background: linear-gradient(90deg, var(--cobalt), var(--ochre) 54%, var(--coral));
      content: "";
      opacity: .9;
    }
    .rhythm.invalid { min-height: 120px; padding: 18px; }

    .header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(170px, 230px);
      gap: 22px;
      align-items: start;
      padding: 19px 20px 15px;
      border-bottom: 1px solid var(--rule);
    }
    .title-block { min-width: 0; }
    .kicker,
    .eyebrow,
    .duration-label,
    .mode-label,
    .beats-title,
    .field-label,
    .metric-label {
      color: var(--paper-faint);
      font-family: "SFMono-Regular", "Roboto Mono", ui-monospace, monospace;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    .kicker { color: #9fb3e0; }
    .title {
      margin: 3px 0 4px;
      overflow: hidden;
      color: var(--paper);
      font-size: clamp(19px, 2.7vw, 27px);
      font-weight: 650;
      letter-spacing: -.035em;
      line-height: 1.08;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .scene {
      max-width: 690px;
      margin: 0;
      color: var(--paper-muted);
      font-size: 12px;
    }
    .duration-lock {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 2px 10px;
      align-items: baseline;
      padding: 10px 11px;
      border: 1px solid var(--rule);
      border-radius: 10px;
      background: rgba(242, 238, 229, .035);
    }
    .duration-value {
      color: var(--paper);
      font-family: "SFMono-Regular", "Roboto Mono", ui-monospace, monospace;
      font-size: 15px;
      font-variant-numeric: tabular-nums;
    }
    .duration-note {
      grid-column: 1 / -1;
      color: var(--paper-faint);
      font-size: 9px;
      line-height: 1.35;
    }

    .mode-bar {
      display: flex;
      min-height: 42px;
      align-items: center;
      gap: 10px;
      padding: 7px 20px;
      border-bottom: 1px solid var(--rule);
      background: rgba(242, 238, 229, .018);
    }
    .mode-label { margin-right: 2px; }
    .mode-options {
      display: inline-flex;
      gap: 3px;
      padding: 3px;
      border: 1px solid var(--rule);
      border-radius: 9px;
      background: rgba(0, 0, 0, .16);
    }
    .mode-option,
    .reset-button,
    .beat-tool,
    .revise-button,
    .confirm-button,
    .delete-button,
    .intensity-option {
      border: 0;
      cursor: pointer;
    }
    .mode-option {
      min-width: 58px;
      padding: 5px 9px;
      border-radius: 6px;
      background: transparent;
      color: var(--paper-muted);
      font-size: 11px;
    }
    .mode-option.selected {
      background: var(--paper);
      color: #202127;
      box-shadow: 0 1px 8px rgba(0, 0, 0, .22);
    }
    .reset-button {
      margin-left: auto;
      padding: 6px 9px;
      background: transparent;
      color: var(--paper-faint);
      font-size: 10px;
    }
    .reset-button:hover { color: var(--paper); }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1.72fr) minmax(250px, .72fr);
      min-height: 540px;
    }
    .score {
      min-width: 0;
      padding: 17px 18px 18px 20px;
      border-right: 1px solid var(--rule);
    }
    .graph-shell {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr);
      min-height: 286px;
    }
    .drive-axis {
      position: relative;
      border-right: 1px solid var(--rule);
    }
    .axis-label {
      position: absolute;
      right: 8px;
      color: var(--paper-faint);
      font-family: "SFMono-Regular", "Roboto Mono", ui-monospace, monospace;
      font-size: 8px;
      letter-spacing: .07em;
      text-transform: uppercase;
      transform: translateY(-50%);
    }
    .axis-label.high { top: 14%; color: #d99a8d; }
    .axis-label.mid { top: 50%; }
    .axis-label.low { top: 86%; color: #8fa3d2; }
    .graph {
      position: relative;
      min-width: 0;
      min-height: 286px;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(242, 238, 229, .025) 1px, transparent 1px) 0 0 / 10% 100%,
        linear-gradient(180deg, rgba(225, 116, 98, .025), transparent 47%, rgba(110, 142, 214, .03));
    }
    .graph-svg {
      display: block;
      width: 100%;
      height: 286px;
      overflow: visible;
      cursor: crosshair;
    }
    .grid-line {
      stroke: rgba(242, 238, 229, .12);
      stroke-dasharray: 5 7;
      vector-effect: non-scaling-stroke;
    }
    .grid-line.mid { stroke: rgba(242, 238, 229, .2); }
    .curve-fill { fill: url(#performance-breath); pointer-events: none; }
    .curve-line {
      fill: none;
      stroke: url(#performance-curve);
      stroke-linecap: round;
      stroke-width: 3;
      vector-effect: non-scaling-stroke;
      filter: drop-shadow(0 2px 6px rgba(4, 5, 8, .48));
      pointer-events: none;
    }
    .curve-point {
      cursor: grab;
      touch-action: none;
    }
    .curve-point:active { cursor: grabbing; }
    .point-hit { fill: transparent; }
    .point-ring {
      fill: var(--ink);
      stroke: rgba(242, 238, 229, .7);
      stroke-width: 1.5;
      vector-effect: non-scaling-stroke;
      transition: r .16s ease, stroke .16s ease, fill .16s ease;
    }
    .point-core { fill: var(--paper); transition: fill .16s ease; }
    .curve-point.selected .point-ring {
      r: 13px;
      fill: #252731;
      stroke: #f2c378;
      stroke-width: 2;
    }
    .curve-point.selected .point-core { fill: #f2c378; }
    .playhead-line {
      stroke: rgba(242, 238, 229, .7);
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
      pointer-events: none;
    }
    .playhead-dot {
      fill: var(--paper);
      stroke: var(--ink);
      stroke-width: 3;
      vector-effect: non-scaling-stroke;
      pointer-events: none;
    }
    .add-point-hint {
      position: absolute;
      right: 8px;
      bottom: 5px;
      color: rgba(183, 178, 170, .55);
      font-size: 9px;
      pointer-events: none;
    }

    .scrubber {
      display: grid;
      grid-template-columns: 110px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      margin: 5px 0 14px 44px;
    }
    .scrubber-label {
      display: flex;
      flex-direction: column;
      color: var(--paper-faint);
      font-size: 9px;
    }
    .scrubber-time {
      color: var(--paper);
      font-family: "SFMono-Regular", "Roboto Mono", ui-monospace, monospace;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .playhead-range,
    .drive-range {
      width: 100%;
      height: 16px;
      margin: 0;
      accent-color: var(--ochre);
      cursor: ew-resize;
    }

    .beats-section {
      padding-top: 12px;
      border-top: 1px solid var(--rule);
    }
    .beats-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .beats-title { color: var(--paper-muted); }
    .beats-meta { color: var(--paper-faint); font-size: 9px; }
    .beat-palette { display: flex; flex-wrap: wrap; gap: 5px; }
    .beat-tool {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 8px;
      border: 1px solid color-mix(in srgb, var(--beat) 35%, transparent);
      border-radius: 999px;
      background: color-mix(in srgb, var(--beat) 9%, transparent);
      color: color-mix(in srgb, var(--beat) 75%, var(--paper));
      font-size: 9px;
    }
    .beat-tool:hover {
      background: color-mix(in srgb, var(--beat) 17%, transparent);
      border-color: color-mix(in srgb, var(--beat) 55%, transparent);
    }
    .beat-lane {
      position: relative;
      height: 48px;
      margin-top: 10px;
      border: 1px solid var(--rule);
      border-radius: 9px;
      background:
        linear-gradient(90deg, rgba(242, 238, 229, .04) 1px, transparent 1px) 0 0 / 10% 100%,
        rgba(0, 0, 0, .15);
    }
    .lane-line {
      position: absolute;
      top: 50%;
      right: 7px;
      left: 7px;
      height: 1px;
      background: rgba(242, 238, 229, .17);
    }
    .beat-marker {
      position: absolute;
      top: 50%;
      display: inline-flex;
      width: 27px;
      height: 27px;
      align-items: center;
      justify-content: center;
      border: 1px solid color-mix(in srgb, var(--beat) 75%, #fff);
      border-radius: 50%;
      background: color-mix(in srgb, var(--beat) 18%, var(--ink));
      box-shadow: 0 4px 12px rgba(0, 0, 0, .28);
      color: color-mix(in srgb, var(--beat) 75%, #fff);
      font-family: "SFMono-Regular", "Roboto Mono", ui-monospace, monospace;
      font-size: 11px;
      transform: translate(-50%, -50%);
      cursor: ew-resize;
      touch-action: none;
      transition: transform .15s ease, background .15s ease;
    }
    .beat-marker.selected {
      background: color-mix(in srgb, var(--beat) 34%, var(--ink));
      transform: translate(-50%, -50%) scale(1.18);
    }
    .beat-selection-strip {
      display: flex;
      min-width: 0;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 8px;
      padding: 8px 9px;
      border: 1px solid color-mix(in srgb, var(--beat) 34%, var(--rule));
      border-radius: 9px;
      background: color-mix(in srgb, var(--beat) 7%, rgba(0, 0, 0, .2));
    }
    .beat-selection-identity {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 8px;
    }
    .beat-selection-glyph {
      display: inline-flex;
      width: 24px;
      height: 24px;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      border: 1px solid color-mix(in srgb, var(--beat) 65%, #fff);
      border-radius: 50%;
      color: color-mix(in srgb, var(--beat) 78%, #fff);
      font-family: "SFMono-Regular", "Roboto Mono", ui-monospace, monospace;
      font-size: 10px;
    }
    .beat-selection-details {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 1px;
    }
    .beat-selection-name {
      color: var(--paper);
      font-size: 10px;
      font-weight: 600;
    }
    .beat-selection-note {
      overflow: hidden;
      color: var(--paper-faint);
      font-size: 9px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .inspector {
      display: flex;
      min-width: 0;
      flex-direction: column;
      background: rgba(0, 0, 0, .09);
    }
    .director-readout,
    .selection-editor { padding: 16px; }
    .director-readout { border-bottom: 1px solid var(--rule); }
    .readout-head,
    .selection-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }
    .interval {
      color: var(--paper-faint);
      font-family: "SFMono-Regular", "Roboto Mono", ui-monospace, monospace;
      font-size: 9px;
      font-variant-numeric: tabular-nums;
    }
    .drive-row {
      display: flex;
      align-items: baseline;
      gap: 9px;
      margin: 10px 0 12px;
    }
    .drive-value {
      color: var(--paper);
      font-family: "SFMono-Regular", "Roboto Mono", ui-monospace, monospace;
      font-size: 38px;
      font-weight: 500;
      letter-spacing: -.08em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .drive-label { color: #e5b36d; font-size: 11px; }
    .metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }
    .metric {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 3px 6px;
      padding: 8px;
      border: 1px solid var(--rule);
      border-radius: 8px;
      background: rgba(242, 238, 229, .025);
    }
    .metric:last-child { grid-column: 1 / -1; }
    .metric-label {
      grid-column: 1 / -1;
      overflow: hidden;
      font-size: 8px;
      letter-spacing: .06em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .metric-value {
      color: var(--paper);
      font-family: "SFMono-Regular", "Roboto Mono", ui-monospace, monospace;
      font-size: 17px;
      font-variant-numeric: tabular-nums;
    }
    .metric-unit {
      align-self: end;
      color: var(--paper-faint);
      font-size: 8px;
      white-space: nowrap;
    }
    .director-cue {
      margin: 10px 0 0;
      padding-left: 9px;
      border-left: 2px solid var(--ochre);
      color: var(--paper-muted);
      font-size: 10px;
      line-height: 1.45;
    }

    .selection-type { color: var(--paper); font-size: 12px; font-weight: 600; }
    .editor-content {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 13px;
    }
    .field { display: flex; min-width: 0; flex-direction: column; gap: 5px; }
    .number-input,
    .select-input,
    .text-input {
      width: 100%;
      height: 32px;
      box-sizing: border-box;
      border: 1px solid var(--rule-strong);
      border-radius: 7px;
      background: var(--ink-soft);
      color: var(--paper);
    }
    .number-input,
    .text-input { padding: 0 9px; }
    .number-input {
      font-family: "SFMono-Regular", "Roboto Mono", ui-monospace, monospace;
      font-variant-numeric: tabular-nums;
    }
    .number-input:disabled { opacity: .45; cursor: not-allowed; }
    .select-input { padding: 0 7px; }
    .text-input::placeholder { color: var(--paper-faint); }
    .drive-field { padding: 8px 9px; border: 1px solid var(--rule); border-radius: 8px; }
    .inline-value {
      color: var(--paper);
      font-family: "SFMono-Regular", "Roboto Mono", ui-monospace, monospace;
      font-size: 11px;
    }
    .editor-hint { margin: -2px 0 0; color: var(--paper-faint); font-size: 9px; }
    .intensity-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
    }
    .intensity-option {
      padding: 6px 5px;
      border: 1px solid var(--rule);
      border-radius: 6px;
      background: transparent;
      color: var(--paper-muted);
      font-size: 9px;
    }
    .intensity-option.selected {
      border-color: rgba(210, 165, 91, .65);
      background: rgba(210, 165, 91, .12);
      color: #f0c77f;
    }
    .delete-button {
      align-self: flex-start;
      padding: 5px 0;
      background: transparent;
      color: #d78a7e;
      font-size: 10px;
    }
    .delete-beat-button {
      flex: 0 0 auto;
      align-self: center;
      padding: 6px 9px;
      border: 1px solid rgba(225, 116, 98, .36);
      border-radius: 7px;
      background: rgba(225, 116, 98, .08);
      color: #ef9b8d;
      font-weight: 600;
    }
    .delete-beat-button:hover {
      border-color: rgba(225, 116, 98, .62);
      background: rgba(225, 116, 98, .15);
    }
    .delete-button:disabled { color: var(--paper-faint); cursor: not-allowed; opacity: .45; }

    .footer {
      display: flex;
      min-height: 58px;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 9px 15px 9px 20px;
      border-top: 1px solid var(--rule);
      background: rgba(242, 238, 229, .02);
    }
    .status { min-height: 16px; margin: 0; color: #e29a8f; font-size: 10px; }
    .actions { display: flex; gap: 7px; margin-left: auto; }
    .revise-button,
    .confirm-button {
      min-height: 34px;
      padding: 0 13px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
    }
    .revise-button {
      border: 1px solid var(--rule-strong);
      background: transparent;
      color: var(--paper-muted);
    }
    .confirm-button {
      background: var(--paper);
      color: #1f2026;
      box-shadow: 0 5px 16px rgba(0, 0, 0, .23);
    }
    .confirm-button:disabled { cursor: wait; opacity: .55; }

    @media (max-width: 760px) {
      .header { grid-template-columns: 1fr; gap: 11px; }
      .duration-lock { grid-template-columns: auto 1fr; }
      .duration-value { justify-self: end; }
      .mode-bar { flex-wrap: wrap; padding: 8px 14px; }
      .mode-label { width: 100%; }
      .reset-button { margin-left: 0; }
      .workspace { min-height: 0; grid-template-columns: 1fr; }
      .score { padding: 15px 12px; border-right: 0; border-bottom: 1px solid var(--rule); }
      .graph-shell { grid-template-columns: 38px minmax(0, 1fr); min-height: 244px; }
      .graph, .graph-svg { min-height: 244px; height: 244px; }
      .scrubber { margin-left: 38px; grid-template-columns: 90px minmax(0, 1fr); }
      .inspector { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .director-readout { border-right: 1px solid var(--rule); border-bottom: 0; }
    }

    @media (max-width: 540px) {
      .header { padding: 16px 14px 13px; }
      .title { white-space: normal; }
      .mode-options { width: 100%; }
      .mode-option { min-width: 0; flex: 1; }
      .reset-button { width: 100%; text-align: left; }
      .graph-shell { min-height: 218px; }
      .graph, .graph-svg { min-height: 218px; height: 218px; }
      .scrubber { grid-template-columns: 1fr; margin-left: 38px; }
      .beat-tool { flex: 1 1 calc(33% - 5px); justify-content: center; }
      .inspector { display: flex; }
      .selection-editor {
        order: -1;
        border-bottom: 1px solid var(--rule);
      }
      .director-readout { border-right: 0; border-bottom: 0; }
      .footer { align-items: stretch; flex-direction: column; }
      .actions { width: 100%; }
      .revise-button, .confirm-button { flex: 1; }
    }

    @media (max-width: 420px) {
      .rhythm { border-radius: 12px; }
      .header { padding: 14px 12px 12px; }
      .title { font-size: 20px; }
      .mode-bar { gap: 7px; padding: 7px 12px; }
      .score { padding: 13px 10px 14px; }
      .graph-shell { grid-template-columns: 34px minmax(0, 1fr); min-height: 200px; }
      .graph, .graph-svg { min-height: 200px; height: 200px; }
      .scrubber { margin-left: 34px; }
      .director-readout,
      .selection-editor { padding: 13px 12px; }
      .beat-selection-strip { padding: 7px 8px; }
      .delete-beat-button { min-height: 30px; }
      .footer { padding: 9px 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
      }
