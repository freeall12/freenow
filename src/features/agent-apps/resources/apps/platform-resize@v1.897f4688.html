<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resize</title>
  <style>
    /* 基础样式全部走 CSS 变量：值由沙箱 proxy 注入的设计令牌与宿主 hostContext 提供。
       中间强度的交互档位（hover / 遮罩 / 选中描边）来自 panel-theme.css，与
       library-picker 共用同一套，保证两个面板在同一宿主里观感一致。 */

    html, body { margin: 0; padding: 0; background: transparent; }
    body {
      font-family: var(--font-sans, sans-serif);
      color: var(--color-text-primary, #eee);
      font-size: 13px;
      line-height: 1.5;
    }
    .panel { padding: 4px 2px; display: flex; flex-direction: column; gap: 10px; }

    /* 顶栏：标题 + 一句灰色附注。 */
    .header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .title { font-size: 13px; font-weight: 600; margin: 0; }
    /*
     * 免费只是一句附注，不是卖点横幅。做成灰色小字跟在标题后面——用户扫一眼
     * 知道「点了不扣钱」就够了，用绿色高亮反而像在推销。
     */
    .badge-free {
      font-size: 11px;
      color: var(--color-text-tertiary, rgba(255, 255, 255, 0.55));
    }

    /* 预览舞台：底图 + 取景框。切换预设只改这里的四条遮罩与描边框。 */
    .stage { display: flex; flex-direction: column; gap: 6px; }
    /*
     * 限高是这里的关键：frame 的宽高比跟随原图，竖图（如 9:16 壁纸）按 100% 宽
     * 撑开会有好几屏高，预设按钮直接被顶出可视区——用户看到的就是"一个很大的框，
     * 没有任何选项"。改成先限高、宽度由比例反推，横竖图都收在一屏内。
     * 不能用 max-height + object-fit 让图片自己缩：遮罩与取景框是按 frame 的
     * 百分比定位的，frame 一旦大于图片实际显示区域，框就会错位。
     */
    .stage-frame {
      position: relative;
      /* 触摸端必须关掉默认手势，否则纵向拖动会被聊天窗的滚动抢走。 */
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      max-height: 260px;
      max-width: 100%;
      width: auto;
      /*
       * .stage 是 column flex，默认 align-items: stretch 会把 frame 拉满宽，
       * aspect-ratio 随之失效（宽度被定死，高度反算后又被 max-height 截断，
       * 比例就丢了）。align-self: flex-start 关掉拉伸，让宽度由「限高 + 比例」
       * 反推出来，同时实现左对齐。
       * 原先用 margin: 0 auto 也能关掉拉伸（flex 里 auto margin 会吸收剩余空间），
       * 但那是居中的副作用，不是显式意图——换成 align-self 才说得清。
       */
      align-self: flex-start;
      overflow: hidden;
      border-radius: 8px;
      background: var(--panel-surface-asset);
    }
    .stage-img { display: block; width: 100%; height: 100%; object-fit: cover; }
    /* 固定压暗值：取景框外必须在深浅两种宿主下都明确变暗，不能跟随主题反转。 */
    .mask { position: absolute; background: var(--panel-scrim); pointer-events: none; }
    .crop-box {
      position: absolute;
      pointer-events: none;
      box-sizing: border-box;
      border: 2px solid var(--panel-fg-inverse);
      border-radius: 2px;
      box-shadow: 0 0 0 1px var(--panel-scrim-soft);
    }
    .stage-caption {
      margin: 0;
      font-size: 12px;
      color: var(--color-text-tertiary, rgba(255, 255, 255, 0.55));
      display: flex;
      gap: 8px;
      align-items: baseline;
      flex-wrap: wrap;
    }
    /* 拖动提示比规格名再弱一档：它是一次性的用法说明，不是状态。 */
    .drag-hint { color: var(--panel-fg-muted); }

    /*
     * 预设按钮组：胶囊形，选中填实。
     *
     * 未选中不铺底也不描边，只有弱字色；选中铺一层浅灰并把字色提到最强。
     * 不用纯黑填实：一次通常会选中四五个，五块实心黑会把整个面板的重量压到
     * 底部这一排，反而盖过上面的预览图。浅灰 + 字色差已经能一眼数出选了几个。
     */
    .presets { display: flex; flex-direction: column; gap: 6px; }
    .presets-hint {
      margin: 0;
      font-size: 12px;
      color: var(--color-text-tertiary, rgba(255, 255, 255, 0.55));
    }
    /* 不能用负 margin 抵消 padding：胶囊有底色，负 margin 会把第一个的底色
       推出容器左边缘，看起来就是被裁掉一块。 */
    .preset-list { display: flex; flex-wrap: wrap; gap: 4px 6px; }
    .preset {
      /* button 不继承 color，UA 会给 buttontext。 */
      color: var(--color-text-tertiary, rgba(255, 255, 255, 0.55));
      font: inherit;
      font-size: 12px;
      /* 未选中不画描边也不铺底：一排六个胶囊，只要每个都带边框，整块就压过了
         上方的预览图。留白 + 弱字色已经够读，选中时才把重量给出去。 */
      background: none;
      border: none;
      border-radius: var(--panel-pill-radius);
      padding: 3px 10px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.12s ease, color 0.12s ease;
    }
    /*
     * 刻意不做 hover 态：任何比未选中更重的 hover 都会长得像「已选中」，
     * 鼠标扫过一排时看起来就像选中项在跟着跑。cursor: pointer 已经说明可点，
     * 而这个面板多数时候跑在聊天窗里，hover 本来也不是主要交互。
     */
    .preset:disabled { opacity: 0.5; cursor: default; }
    /*
     * 选中：灰底承担信号，字色只比未选中提一档、字重停在 500。
     * 用最强字色加粗压在浅灰上，对比度会顶到接近正文标题，一排选中项读起来
     * 比上面的预览图还抢眼；而这里只需要「能分出选没选」，不需要强调。
     */
    .preset.on {
      background: var(--panel-surface-hover);
      color: var(--color-text-secondary, rgba(255, 255, 255, 0.75));
      font-weight: 500;
    }
    /*
     * 刻意不给「正在预览的那一项」单独的视觉。填实已经表示「会被添加」，再加
     * 第三种状态只会让人分不清哪个是哪个；舞台下方那行说明本来就写着当前预览的
     * 是哪个规格，够用了。
     * （--panel-border-focus 在浅色宿主里解析成白色 30%，白底上不可见，
     * 它是给填实表面上的焦点环用的，不能拿来当独立描边。）
     */

    /* 操作栏。分割线刻意不加——与 library-picker 保持一致。 */
    .action-bar { display: flex; align-items: center; padding-top: 2px; }
    .apply-btn {
      color: inherit;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      background: var(--panel-fg-strong);
      color: var(--panel-fg-inverse);
      border: none;
      border-radius: var(--panel-pill-radius);
      padding: 5px 14px;
      cursor: pointer;
    }
    .apply-btn:disabled { opacity: 0.45; cursor: default; }

    .empty, .status { font-size: 12px; margin: 0; }
    .empty { color: var(--color-text-tertiary, rgba(255, 255, 255, 0.55)); }
    .status.ok { color: var(--color-text-success, #7cd5a7); }
    .status.err { color: var(--color-text-error, #d36a6a); }
    .status.info { color: var(--color-text-tertiary, rgba(255, 255, 255, 0.55)); }
