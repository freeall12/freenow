<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cutlist Review</title>
  <style>
    /* 基础样式全部走 CSS 变量：值由沙箱 proxy 注入的设计令牌与宿主 hostContext 提供。 */
    html, body { margin: 0; padding: 0; background: transparent; }
    body {
      font-family: var(--font-sans, sans-serif);
      color: var(--color-text-primary, #eee);
      font-size: 13px;
      line-height: 1.5;
    }
    .review {
      padding: 4px 2px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 560px;
    }
    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* 头部：标题 + 画幅徽章 + notes 只读摘要 + 总时长对比条。 */
    .hd { display: flex; flex-direction: column; gap: 4px; }
    .title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .kick {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--color-text-secondary, #aaa);
      text-transform: uppercase;
    }
    .ttl { font-size: 14px; font-weight: 600; }
    .badge {
      font-size: 10px;
      font-weight: 600;
      padding: 1px 7px;
      border-radius: 999px;
      border: 1px solid var(--color-border-primary, rgba(255, 255, 255, 0.15));
      color: var(--color-text-secondary, #aaa);
      white-space: nowrap;
    }
    .notes { font-size: 12px; color: var(--color-text-secondary, #aaa); }
    .totals {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
      padding: 6px 10px;
      border-radius: var(--border-radius-sm, 8px);
      background: var(--color-background-secondary, rgba(255, 255, 255, 0.04));
    }
    .total {
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .total.over { color: var(--color-text-danger, #d36a6a); }
    .gate { font-size: 11px; }
    .gate.err { color: var(--color-text-danger, #d36a6a); }
    .gate.soft { color: var(--color-text-secondary, #aaa); }

    /* 片段卡列表：顺序即最终播放顺序，不可重排。 */
    .cards { display: flex; flex-direction: column; gap: 8px; }
    .card {
      border: 1px solid var(--color-border-primary, rgba(255, 255, 255, 0.1));
      border-radius: var(--border-radius-lg, 16px);
      background: var(--color-background-secondary, rgba(255, 255, 255, 0.03));
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card.off { opacity: 0.55; }
    .card-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .idx {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      color: var(--color-text-secondary, #aaa);
    }
    .label { font-size: 13px; font-weight: 500; flex: 1; min-width: 120px; }
    .badge.flag.aggressive_trim,
    .badge.flag.ratio_mismatch { color: var(--color-text-warning, #fdce8b); border-color: currentColor; }
    .badge.flag.drop_suggested { color: var(--color-text-danger, #d36a6a); border-color: currentColor; }
    .badge.short { display: none; color: var(--color-text-warning, #fdce8b); border-color: currentColor; }
    .badge.short.on { display: inline-block; }
    .keep-toggle {
      font: inherit;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 12px;
      border-radius: 999px;
      border: 1px solid var(--color-border-primary, rgba(255, 255, 255, 0.2));
      background: none;
      color: var(--color-text-secondary, #aaa);
      cursor: pointer;
    }
    .keep-toggle.on {
      background: var(--color-text-primary, #eee);
      border-color: var(--color-text-primary, #eee);
      color: #111;
    }

    /* 预览台：原生 controls 供播放与 seek 检查 trim 点；加载失败整体消失。 */
    .stage {
      border-radius: var(--border-radius-sm, 8px);
      overflow: hidden;
      background: rgba(0, 0, 0, 0.35);
      display: flex;
      justify-content: center;
    }
    .stage video { display: block; max-width: 100%; max-height: 220px; }
    .no-preview {
      font-size: 11px;
      color: var(--color-text-secondary, #aaa);
      padding: 8px 10px;
      border-radius: var(--border-radius-sm, 8px);
      background: rgba(255, 255, 255, 0.04);
    }
    .meta {
      font-size: 11px;
      color: var(--color-text-secondary, #aaa);
      font-variant-numeric: tabular-nums;
    }

    /* trim 微调：入点/出点 0.1s 步进；数值可点，seek 预览到该 trim 点。 */
    .trims { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .trim-group { display: flex; align-items: center; gap: 4px; }
    .trim-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--color-text-secondary, #aaa);
      margin-right: 2px;
    }
    .step {
      font: inherit;
      width: 22px;
      height: 22px;
      line-height: 1;
      border-radius: 6px;
      border: 1px solid var(--color-border-primary, rgba(255, 255, 255, 0.15));
      background: none;
      color: var(--color-text-primary, #eee);
      cursor: pointer;
    }
    .step:disabled { opacity: 0.35; cursor: default; }
    .trim-value {
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      font-family: var(--font-mono, ui-monospace, monospace);
      font-variant-numeric: tabular-nums;
      min-width: 46px;
      text-align: center;
      padding: 2px 4px;
      border: none;
      border-radius: 6px;
      background: none;
      color: var(--color-text-primary, #eee);
      cursor: pointer;
    }
    .trim-value:hover { background: rgba(255, 255, 255, 0.08); }
    .note { font-size: 11px; color: var(--color-text-secondary, #aaa); }
    .note.flag-note { color: var(--color-text-warning, #fdce8b); }

    .chip {
      font: inherit;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid var(--color-border-primary, rgba(255, 255, 255, 0.15));
      background: none;
      color: var(--color-text-secondary, #aaa);
      cursor: pointer;
    }
    .chip:hover { color: var(--color-text-primary, #eee); }
    .chip.reset.hidden { display: none; }

    /* 底部：恢复建议值 / 再改改 / 确认提交。 */
    .ft-wrap { display: flex; flex-direction: column; gap: 4px; }
    .ft { display: flex; align-items: center; gap: 10px; }
    .sp { flex: 1; }
    .revise {
      font: inherit;
      font-size: 12px;
      color: var(--color-text-secondary, #aaa);
      background: none;
      border: none;
      cursor: pointer;
      padding: 7px 6px;
    }
    .revise:hover { color: var(--color-text-primary, #eee); }
    .submit {
      font: inherit;
      font-weight: 600;
      color: #111;
      background: var(--color-text-primary, #eee);
      border: none;
      border-radius: var(--border-radius-sm, 8px);
      padding: 7px 14px;
      cursor: pointer;
    }
    .submit:disabled { opacity: 0.5; cursor: default; }
    .status {
      font-size: 12px;
      margin: 0;
      min-height: 1em;
      color: var(--color-text-danger, #d36a6a);
    }
  </style>
