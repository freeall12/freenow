<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Story Room</title>
  <style>
    /* 视觉平移自 nonlinear-screenwriting 插件旧模板（board-widget.html）；
       设计令牌由 shared/design-tokens.css 构建期内联提供静态兜底，
       宿主 hostContext.styles.variables 运行时覆盖官方标准变量。
       旧 fragment 依赖宿主页面的 button/input 基础样式，此处补全为自足样式。 */
    html, body { margin: 0; padding: 0; background: transparent; }
    body {
      font-family: var(--font-sans, sans-serif);
      color: var(--color-text-primary, #eee);
      font-size: 13px;
      line-height: 1.5;
    }

    .nls{padding:4px 2px;display:block;width:100%}
    .nls .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
    .nls .hd{display:flex;align-items:baseline;gap:8px;margin-bottom:.5rem;flex-wrap:wrap}
    .nls .kick{font-size:12px;text-transform:uppercase;letter-spacing:.1em;font-weight:600;color:var(--color-text-info)}
    .nls .ttl{font-size:15px;font-weight:500;color:var(--color-text-primary)}
    .nls .cnt{font-size:12px;color:var(--color-text-secondary)}
    .nls .chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 .5rem;align-items:center}
    .nls .chip{font-size:12px;padding:3px 10px;border-radius:var(--r-pill);background:var(--color-background-secondary);border:1px solid var(--color-border-secondary);color:var(--color-text-primary);cursor:pointer;transition:background 120ms}
    .nls .chip.on{background:var(--color-accent-tint-strong);border-color:transparent}
    .nls .chip.ghost{border-style:dashed}
    .nls .strip{background:var(--color-background-primary);border-radius:var(--r-md);padding:.6rem .75rem;margin-bottom:.75rem}
    .nls .striphd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
    .nls .striptt{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--color-text-secondary);flex:1}
    .nls .sgrid{display:grid;gap:2px;align-items:center}
    .nls .slbl{font-size:12px;color:var(--color-text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:4px}
    .nls .scol{height:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:2px}
    .nls .scol:hover{background:var(--color-background-secondary)}
    .nls .sband{width:100%;height:9px;border-radius:2px;background:var(--color-accent)}
    .nls .sdot{width:5px;height:5px;border-radius:50%;background:var(--color-text-primary);opacity:.85}
    .nls .soff{width:3px;height:3px;border-radius:50%;background:var(--color-border-secondary)}
    .nls .shead{font-size:12px;color:var(--color-text-secondary);text-align:center;overflow:hidden}
    .nls .sdiv{grid-column:1/-1;height:1px;background:var(--color-border-tertiary);margin:3px 0}
    .nls .act{background:var(--color-background-primary);border-radius:var(--r-md);padding:.5rem .75rem;margin-bottom:.75rem}
    .nls .acthd{display:flex;align-items:center;gap:8px;padding:4px 0}
    .nls .actlbl{font-size:14px;font-weight:500;flex:1;cursor:pointer}
    .nls .ibtn{font-size:12px;border-radius:var(--r-pill);padding:2px 10px;border:1px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-primary);cursor:pointer}
    .nls .card{position:relative;display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:var(--r-sm);background:var(--color-background-secondary);margin:6px 0;user-select:none}
    .nls .card.drag{opacity:.4}
    .nls .card.dim{opacity:.35}
    .nls .card.armed{outline:1px solid var(--color-text-error)}
    .nls .card.flash{outline:2px solid var(--color-accent)}
    .nls .grip{color:var(--color-text-secondary);font-size:13px;cursor:grab;touch-action:none;padding:2px 2px 0 0;flex:none}
    .nls .dot{width:8px;height:8px;border-radius:50%;background:var(--color-accent);margin-top:6px;flex:none}
    .nls .cbody{flex:1;min-width:0}
    .nls .ck{font-size:13px;font-weight:500;color:var(--color-text-primary);user-select:text}
    .nls .ct{font-weight:400;color:var(--color-text-secondary)}
    .nls .csy{font-size:13px;color:var(--color-text-secondary);line-height:1.5;user-select:text}
    .nls .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;align-items:center}
    .nls .tag{font-size:12px;color:var(--color-text-secondary)}
    .nls .tag.new{color:var(--color-text-info)}
    .nls .rel{font-size:12px;padding:1px 8px;border-radius:var(--r-pill);background:var(--color-background-primary);color:var(--color-text-secondary);border:none;cursor:pointer;transition:background 120ms}
    .nls .rel.warn{color:var(--color-text-warning)}
    .nls .x{font-size:12px;color:var(--color-text-secondary);cursor:pointer;padding:2px 8px;border-radius:var(--r-pill);flex:none}
    .nls .jump{display:flex;align-items:center;gap:8px;margin:2px 0 2px 26px}
    .nls .jump span{font-size:12px;color:var(--color-text-secondary)}
    .nls .jump.back span{color:var(--color-text-primary);font-weight:500}
    .nls .jump i{flex:1;height:1px;background:var(--color-border-tertiary)}
    .nls .dl{height:2px;background:var(--color-accent);border-radius:0;margin:2px 0;pointer-events:none}
    .nls .ft{display:flex;gap:8px;align-items:center;margin-top:1rem;flex-wrap:wrap}
    .nls .go{font-size:13px;border-radius:var(--r-pill);padding:5px 14px;background:var(--color-accent-tint);border:1px solid transparent;color:var(--color-text-primary);cursor:pointer}
    .nls .hint{font-size:12px;color:var(--color-text-secondary);width:100%}
    .nls .addrow input{width:100%;box-sizing:border-box;font-size:13px;font-family:inherit;margin:6px 0;padding:6px 10px;border-radius:var(--r-sm);border:1px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-primary)}
    .nls .pl1{filter:hue-rotate(40deg)}
    .nls .pl2{filter:hue-rotate(90deg)}
    .nls .pl3{filter:hue-rotate(140deg)}
    .nls .pl4{filter:hue-rotate(180deg)}
    .nls .pl5{filter:hue-rotate(230deg)}
    .nls .pl6{filter:hue-rotate(300deg)}
    .nls .plg{background:var(--color-text-secondary);filter:none}
  </style>
