<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Motion Library</title>
<style>/*
 * TapNow widget 产品设计令牌（构建期按需引入，vite 单文件构建会内联进模板产物）。
 *
 * 与 apps/app/public/usercontent-proxy/widget-proxy.html 的 DESIGN_TOKEN_STYLE 同源同值；两侧修改需同步。
 * 官方标准变量（--color-text-primary 等 McpUiStyleVariableKey 枚举内的）由宿主经
 * hostContext.styles.variables 运行时下发并覆盖，本文件同时提供它们的静态兜底，
 * 保证模板在任何宿主下都有完整视觉。
 * Widget 只能消费这些令牌：禁止在 widget 内重定义官方令牌名或引入私有强调色。
 */
:root {
  --color-background: #161616;
  --color-background-primary: color-mix(in srgb, var(--color-accent) 6%, #1f1f1f);
  --color-background-secondary: rgba(255, 255, 255, 0.08);
  --color-background-info: rgba(255, 255, 255, 0.12);
  --color-text-primary: rgba(255, 255, 255, 0.95);
  --color-text-secondary: rgba(255, 255, 255, 0.7);
  --color-text-tertiary: rgba(255, 255, 255, 0.55);
  --color-text-success: #7cd5a7;
  --color-text-warning: #fdce8b;
  --color-text-error: #d36a6a;
  --color-border-primary: rgba(255, 255, 255, 0.1);
  --color-border-secondary: rgba(255, 255, 255, 0.1);
  --color-border-tertiary: color-mix(in srgb, var(--color-accent) 10%, transparent);
  --color-accent: #90c4e5;
  --color-accent-fg: #0f0f0f;
  --color-text-info: var(--color-accent);
  --color-border-info: color-mix(in srgb, var(--color-accent) 30%, transparent);
  --color-accent-surface: color-mix(
    in srgb,
    var(--color-accent) 8%,
    var(--color-background-primary)
  );
  --color-accent-tint: color-mix(in srgb, var(--color-accent) 18%, #0a0a0a);
  --color-accent-tint-strong: color-mix(in srgb, var(--color-accent) 28%, #0a0a0a);
  --color-accent-on-tint: color-mix(in srgb, var(--color-accent) 60%, #ffffff);
  --color-accent-06: color-mix(in srgb, var(--color-accent) 6%, transparent);
  --color-accent-12: color-mix(in srgb, var(--color-accent) 12%, transparent);
  --color-accent-55: color-mix(in srgb, var(--color-accent) 55%, transparent);
  --interaction-hover: rgba(255, 255, 255, 0.05);
  --interaction-pressed: rgba(255, 255, 255, 0.1);
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-pill: 9999px;
  --border-radius-sm: 8px;
  --border-radius-md: 12px;
  --border-radius-lg: 16px;
  --font-sans: "Inter", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}

html,
body {
  margin: 0;
  overflow: hidden;
}

body {
  font-family: var(--font-sans);
  font-size: 13px;
  color: var(--color-text-primary);
  background: var(--color-background);
  line-height: 1.65;
  letter-spacing: 0.01em;
  -webkit-font-smoothing: antialiased;
}
/* Shared production picker: the host owns the page background and theme. */

@media(min-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:350px){header{padding:8px}main{padding:0 8px}.grid{gap:7px}.pick,.caption{padding:6px 6px 2px}.pick strong,.caption strong{font-size:10px}}

<script>/* Motion templates. Curves use anime.js 3.2.2 (MIT). Source glyphs: Montserrat, SIL OFL. */
(function(){'use strict';
const W=1200,H=675,TAU=Math.PI*2,C=x=>Math.max(0,Math.min(1,x)),L=(a,b,t)=>a+(b-a)*t;

function segments(str){return window.Intl?.Segmenter?[...new Intl.Segmenter('zh',{granularity:'grapheme'}).segment(str)].map(x=>x.segment):Array.from(str)}
function font(c,size){c.font=`900 ${size}px 'Arial Black','PingFang SC',sans-serif`;c.textAlign='center';c.textBaseline='alphabetic'}

 font(c,180);let widths=chars.map(ch=>window.MotionGlyphs?.glyphs[ch]?.advance/unit*180||c.measureText(ch).width);let factor=Math.min(1,1010/(widths.reduce((a,b)=>a+b,0)+10*(chars.length-1)));let size=180*factor,total=widths.reduce((a,b)=>a+b,0)*factor+10*(chars.length-1)*factor,x=(W-total)/2;

function bounds(ls,pad=2){const x=Math.floor(Math.min(...ls.map(z=>z.x+z.ink.left))-pad),y=Math.floor(Math.min(...ls.map(z=>z.y+z.ink.top))-pad),right=Math.ceil(Math.max(...ls.map(z=>z.x+z.ink.right))+pad),bottom=Math.ceil(Math.max(...ls.map(z=>z.y+z.ink.bottom))+pad);return {x,y,right,bottom,w:Math.max(1,right-x),h:Math.max(1,bottom-y)};}
function glyph(c,z,color,stroke=false){c.fillStyle=color;c.strokeStyle=color;let data=window.MotionGlyphs?.glyphs[z.ch];if(data){if(!pathCache.has(z.ch))pathCache.set(z.ch,new Path2D(data.d));c.save();c.scale(z.size/1000,-z.size/1000);c.translate(-data.advance/2,0);if(stroke){c.lineWidth=1.5*1000/z.size;c.stroke(pathCache.get(z.ch))}else c.fill(pathCache.get(z.ch),'evenodd');c.restore()}else{font(c,z.size);stroke?c.strokeText(z.ch,0,0):c.fillText(z.ch,0,0)}}

function text(c,str,x,y,size,color,align='center'){font(c,size);c.textAlign=align;c.fillStyle=color;c.fillText(str,x,y)}

function buf(c,ls,color){const key=ls.map(x=>x.ch).join('')+color; if(bufferCache.has(key))return bufferCache.get(key);const b=document.createElement('canvas');b.width=W;b.height=H;all(b.getContext('2d'),ls,color);bufferCache.set(key,b);if(bufferCache.size>40)bufferCache.delete(bufferCache.keys().next().value);return b}

const recipes=[
 ['T01','行遮罩追赶','遮罩揭示','字面先移动，遮罩随后追上；入场余速在基线处消散。','逐字遮罩、异步位移、阅读停留',function(c,t,l,p){l.forEach(z=>{let a=E(t,.12+z.i*.105,1.1),b=E(t,.2+z.i*.105,.9);let g=bounds([z],4);clip(c,g.x,g.y,g.w,g.h,()=>transformed(c,z,p[1],0,175*(1-a)));if(t<3)line(c,z.x-z.w/2,g.bottom+12,z.x-z.w/2+z.w*b,g.bottom+12,p[2],3*(1-S(t,2.4,.6)));});}],

 ['T03','对开夹板','遮罩揭示','两块面板从中心分开；窄缝里的长标题随之恢复正常字宽。','中心裂缝、宽度响应、双层边缘',function(c,t,l,p){let q=E(t,.22,1.8),r=E(t,.4,1.5),g=bounds(l,8);clip(c,600-550*q,g.y,1100*q,g.h,()=>{c.save();c.translate(600,0);c.scale(.6+.4*r,1);c.translate(-600,0);all(c,l,p[1]);c.restore()});let a=1-S(t,2.1,.5);c.globalAlpha=a;box(c,586-545*q,210,9,208,p[2]);box(c,605+545*q,210,9,208,p[2]);c.globalAlpha=1;}],
 ['T04','百叶条带','遮罩揭示','七条字面从相反方向滑入，不同速度的条带最终拼成同一轮廓。','同源字面切片、交错位移、接缝归零',function(c,t,l,p){const b=buf(c,l,p[1]),g=bounds(l);for(let j=0;j<7;j++){let q=E(t,.15+j*.11,1.7),y=g.y+Math.floor(j*g.h/7),h=Math.floor((j+1)*g.h/7)-Math.floor(j*g.h/7);clip(c,0,y,W,h,()=>c.drawImage(b,(j%2?1:-1)*680*(1-q),0));if(t<2.5){c.globalAlpha=(1-q)*.65;line(c,100,y+h-1,1100,y+h-1,p[2]);c.globalAlpha=1;}}}],
 ['T05','圆形聚焦','遮罩揭示','一个局部圆孔揭示字符；圆孔扩大为完整视野，焦点仍落在词中央。','径向剪裁、偏心轨迹、尺度接力',function(c,t,l,p){let q=E(t,.1,2.15);c.save();c.beginPath();c.arc(380+220*q,322,4+620*q,0,TAU);c.clip();c.save();c.translate(600,320);c.scale(1.25-.25*q,1.25-.25*q);c.translate(-600,-320);all(c,l,p[1]);c.restore();c.restore();c.globalAlpha=(1-S(t,1.8,.6))*.8;c.lineWidth=2;circle(c,380+220*q,322,12+620*q,p[2],true);c.globalAlpha=1;}],

,"template.T13.description":"细长字面先探入，压短时带出下一字；字宽和字高分别回到终态。","template.T14.name":"弧面展平","template.T14.description":"完整标题先铺在弯曲的带面上，曲率逐渐消失，准确字形回到平面。","template.T15.name":"弹绳牵引","template.T15.description":"一根牵引线拉开字距，松手后字符依次回到基线，牵引线收回。","template.T16.name":"轮廓走线","template.T16.description":"字形外轮廓先被描出，实体填充从底部升起，轮廓随后退场。","template.T17.name":"上下咬合","template.T17.description":"每个字分成上下两半，沿反向斜线移动；接合时消除色差与偏移。","template.T18.name":"竖条折页","template.T18.description":"每个字面等宽分成三条，条带绕各自边缘折开再拼合；这是几何切片，不是笔画拆解。","template.T19.name":"圆环引出","template.T19.description":"独立圆环先定位，字符随后横向展开；圆环淡出，不模拟真实字腔的形成。","template.T20.name":"字面拼片","template.T20.description":"文字切成有限的网格片段，由近到远旋转装配，终态回归完整字形。","template.T21.name":"网点成像","template.T21.description":"稀疏印刷点聚合为字面，斜向实色前沿穿过网点，最后恢复纯色标题。","template.T22.name":"扫描装配","template.T22.description":"扫描线先定位字面，局部横带交错成像，扫描经过后只保留完整文字。","template.T23.name":"雕刻填充","template.T23.description":"细线轮廓建立后，窄平行线沿字面展开，再被实色压印覆盖。","template.T24.name":"液面显影","template.T24.description":"可控的波面由下向上穿过字形，局部浪尖先露出笔画，最后平稳落版。","template.T25.name":"印刷套准","template.T25.description":"两层印刷字面先有偏移，定位标记牵引它们合拢，最终恢复单一清晰轮廓。","template.T26.name":"镜头穿字","template.T26.description":"视野从一个巨大的局部字面拉开，多行标题经过镜头后收成一行。","template.T27.name":"版心聚合","template.T27.description":"字符从各自栏位进入，共用对齐线逐步收拢；网格在阅读前退去。","template.T28.name":"环排归队","template.T28.description":"文字先环绕中心形成一个旋转版面，再把圆周位置展开为水平阅读顺序。","template.T29.name":"字距呼应","template.T29.description":"一个重音字先到位，其他字从两侧排入；字距先压紧，再留出稳定阅读空间。","template.T30.name":"标题段落","template.T30.description":"小标题先定位，主标题穿过遮罩进入；副标题在主动作末端出现，末尾统一退出。","template.G01.name":"联动机芯","template.G01.description":"钢球逐站触发推杆，三个齿轮反向咬合后锁定。","template.G02.name":"纸间远行","template.G02.description":"三层山景在镜头推进中错位，撕开的纸窗露出远方。","template.G03.name":"光圈穿场","template.G03.description":"十二片光圈打开画面，第二道环形窗口接力进入下一层。","template.G04.name":"层叠构件","template.G04.description":"九枚等距模块从不同高度归位，打开一层再重新装配。","template.G05.name":"极坐标合奏","template.G05.description":"十二个弧段沿各自轨道追赶，压缩成一枚有层次的圆形构图。","template.G06.name":"形状接力","template.G06.description":"圆、方、三角与星形连续变形；缩成图形组后形成最终构图。","template.G07.name":"剪辑桌面","template.G07.description":"四个窗口逐个建立，局部画面接力切换，最终拼为一张编辑桌面。","template.G08.name":"物体注释","template.G08.description":"一台相机进入画面，注释分别锚定镜头、握柄和快门。","template.G09.name":"分拣流水线","template.G09.description":"不同形状沿传送带进入检测区，再由翻板送入各自的容器。","template.G10.name":"地形缎带","template.G10.description":"平行细线卷起成一块有山脊的织面，最后摊开保留纹理。","template.G11.name":"出版重排","template.G11.description":"杂志跨页从单栏切换为三栏，图块、正文和大标题互相让位。","template.G12.name":"海报解构","template.G12.description":"一个同心图形裂为三十六块，沿网格散开，再拼回一张完整海报。","template.G13.name":"跨越球面","template.G13.description":"地球旋转，大圆航线从 A 延伸至 B，飞行标记沿弧线抵达。","template.G14.name":"对话的节奏","template.G14.description":"输入提示先出现，双方短消息与一张预览卡依次进入，最后保留整段对话。","template.G15.name":"界面展开","template.G15.description":"骨架先建立，图表与面板从不同深度进入，镜头最终转正呈现完整界面。","template.G16.name":"数据换一种读法","template.G16.description":"六列数据逐个长出，柱体收束成节点，折线把相同数据连起来。"},"ja_JP":{"title":"Motion Library","openCreative":"別のライブラリを開く：クリエイティブ · 46 ↗","search":"Search animations","categoriesAria":"Animation categories","typesAria":"Animation types","all":"All animations","type":"Type animations","graphics":"Graphics and scenes","categoryLabel":"Categories","filterAria":"Filter categories","listAria":"Animation list","hint":"Hover to preview, click to select","empty":"No matching animations. Try another search.","selectionAria":"Current selection","initial":"Choose an animation to begin.","copyLabel":"Text","copyAria":"Animation text","accentLabel":"Accent color","requestPlaceholder":"Additional changes (optional)","requestAria":"Additional changes","exportNote":"現在は画面録画で動画を保存してください。動画書き出しは近日対応予定です。","previewUnavailable":"Preview unavailable","play":"Play","pause":"Pause","items":"items","seconds":"seconds","selected":"Selected","select":"Select","statusAccepted":"選択しました。内容をチャットで送信してください。","statusReceived":"Agent received your selection and is creating the HTML.","statusUnconfirmed":"Receipt not confirmed. Please retry.","statusRetry":"Previous submis <script>/* Motion Library delivery interface. Selection never opens a separate preview. */
(() => {
  const element = (id) => document.getElementById(id);
  const items = window.MotionCatalog || [];
  const byId = new Map(items.map((item) => [item.id, item]));
  const scenes = new Map(
    [...(window.MotionType || []), ...(window.MotionGraphics || [])].map((item) => [item.id, item]),
  );
  const reduced = matchMedia("(prefers-reduced-motion: reduce)");
  let mode = "all",
    category = "all",
    query = "",
    selected = null,
    raf = 0,
    handler = null,
    busy = false,
    externalBusy = false,
    pending = null,
    onStateChange = null,
    locale = "en_US",
    statusKey = "";
  function t(key) {
    return window.MotionLocales?.[locale]?.[key] ?? window.MotionLocales?.en_US?.[key] ?? key;
  }
  function templateName(item) {
    return t(`template.${item.id}.name`);
  }
  function templateDescription(item) {
    return t(`template.${item.id}.description`);
  }
  function categoryName(name) {
    return name === "all" ? t("all") : t(`category.${name}`);
  }
  function applyLocale() {
    document.documentElement.lang = locale.replace("_", "-");
    document.querySelectorAll("[data-i18n]").forEach((node) => {
      node.textContent = t(node.dataset.i18n);
    });
    document.querySelectorAll("[data-i18n-aria]").forEach((node) => {
      node.setAttribute("aria-label", t(node.dataset.i18nAria));
    });
    document.querySelectorAll("[data-i18n-placeholder]").forEach((node) => {
      node.setAttribute("placeholder", t(node.dataset.i18nPlaceholder));
    });
    element("status").textContent = statusKey ? t(statusKey) : "";
    if (selected)
      element("selected-meta").textContent =
        `${selected.id} · ${selected.duration} ${t("seconds")}`;
    filters();
    renderList();
  }
  const drafts = new Map(),
    cards = new Map();
  const featured = ["G13", "G14", "G15", "G16"];
  const ordered = [
    ...featured.map((id) => byId.get(id)),
    ...items.filter((item) => !featured.includes(item.id)),
  ];
  function draft(item) {
    if (!drafts.has(item.id))
      drafts.set(item.id, {
        text: "MOTION",
        accent: item.accent,
        request: "",
      });
    return drafts.get(item.id);
  }
  function poster(item) {
    return item.id === "G14"
      ? 5.5
      : item.id === "G13"
        ? 3.2
        : item.id === "G16"
          ? 4.6
          : item.id === "G15"
            ? 3.5
            : 2.8;
  }
  function draw(item, time) {
    const card = cards.get(item.id);
    if (!card) return;
    const canvas = card.querySelector("canvas"),
      c = canvas.getContext("2d"),
      scene = scenes.get(item.id),
      data = draft(item),
      frame = Math.floor(time * 60),
      signature = `${frame}:${data.text}:${data.accent}`;
    try {
      if (!scene) throw new Error(`Motion scene unavailable: ${item.id}`);
      if (canvas.dataset.frame === signature) return;
      c.setTransform(canvas.width / 1200, 0, 0, canvas.height / 675, 0, 0);
      c.globalAlpha = 1;
      c.globalCompositeOperation = "source-over";
      c.fillStyle = scene.bg;
      c.fillRect(0, 0, 1200, 675);
      scene.draw(c, time, { text: data.text || "MOTION", accent: data.accent, detail: false });
      canvas.dataset.frame = signature;
      delete card.dataset.error;
    } catch (error) {
      card.dataset.error = "true";
      card.querySelector(".card-bottom>span").textContent = t("previewUnavailable");
      // biome-ignore lint/suspicious/noConsole: Canvas failures need diagnostic context.
      console.error(item.id, error);
    }
  }
  const visible=new Set(),paused=new Set();let lastFrame=0,cursor=0;
  function stop(){if(raf)cancelAnimationFrame(raf);raf=0;lastFrame=0;}
  function tick(ms){raf=0;if(document.hidden)return;if(ms-lastFrame>=50){lastFrame=ms;const ids=[...visible].filter(id=>!paused.has(id)),start=performance.now();for(let n=0;n<ids.length;n++){const item=byId.get(ids[cursor++%ids.length]);if(item)draw(item,(ms/1000)%item.duration);if(performance.now()-start>12)break}}if(visible.size&&!reduced.matches)raf=requestAnimationFrame(tick);}
  function play(item){paused.delete(item.id);if(!raf&&!document.hidden)raf=requestAnimationFrame(tick);}
  const observer=new IntersectionObserver(entries=>{for(const entry of entries){const item=byId.get(entry.target.dataset.id);if(entry.isIntersecting&&item){visible.add(item.id);draw(item,poster(item))}else visible.delete(entry.target.dataset.id)}if(!raf&&!document.hidden)raf=requestAnimationFrame(tick)},{threshold:0});
  function base() {
    return ordered.filter(
      (item) => mode === "all" || (mode === "type" ? item.id[0] === "T" : item.id[0] === "G"),
    );
  }
  function filters() {
    const categories = ["all", ...new Set(base().map((item) => item.category))];
    element("categories").replaceChildren(
      ...categories.map((name) => {
        const button = document.createElement("button");
        button.textContent = categoryName(name);
        button.dataset.category = name;
        button.setAttribute("aria-pressed", String(name === category));
        return button;
      }),
    );
  }
  function renderList() {
    stop();
    observer.disconnect();
    cards.clear();
    visible.clear();
    paused.clear();
    const list = base().filter(
      (item) =>
        (category === "all" || category === item.category) &&
        (!query ||
          `${item.id} ${templateName(item)} ${item.name} ${item.category} ${templateDescription(item)} ${item.description || ""}`
            .toLowerCase()
            .includes(query)),
    );
    const group = t(mode);
    element("list-title").textContent =
      `${category === "all" ? group : categoryName(category)} · ${list.length} ${t("items")}`;
    element("empty").hidden = list.length > 0;
    const fragment = document.createDocumentFragment();
    for (const item of list) {
      const card = document.createElement("article");
      card.className = "card";
      card.dataset.id = item.id;
      card.innerHTML =
        '<button class="select-card"><canvas width="480" height="270" aria-hidden="true"></canvas><span class="caption"><strong></strong><small></small></span><span class="card-description"></span></button><div class="card-bottom"><span></span><button class="preview" type="button"></button></div><button class="use" type="button"></button><span class="selected-label" hidden></span>';
      card.querySelector("strong").textContent = templateName(item);
      card.querySelector("small").textContent = item.id;
      card.querySelector(".card-description").textContent = templateDescription(item);
      card.querySelector(".card-bottom>span").textContent =
        `${categoryName(item.category)} · ${item.duration}s`;
      card.querySelector(".selected-label").textContent = t("selected");
      const pick = card.querySelector(".select-card");
      pick.setAttribute("aria-label", `${t("select")} ${item.id} ${templateName(item)}`);
      pick.addEventListener("click", () => choose(item));
      const use=card.querySelector('.use');use.textContent=t('useTemplate');use.setAttribute('aria-label',t('useTemplate')+' '+templateName(item));use.onclick=()=>{if(busy||externalBusy)return;choose(item);element('submit').onclick()};
      const preview=card.querySelector('.preview');preview.textContent=t('pause');preview.setAttribute('aria-label',t('pause')+' '+templateName(item));preview.onclick=()=>{if(paused.has(item.id))play(item);else paused.add(item.id);preview.textContent=t(paused.has(item.id)?'play':'pause');preview.setAttribute('aria-label',preview.textContent+' '+templateName(item));};
      cards.set(item.id, card);
      fragment.append(card);
      observer.observe(card);
    }
    element("grid").replaceChildren(fragment);
    markSelection();
    setBusy(busy);
  }
  function markSelection() {
    for (const [id, card] of cards) {
      const isSelected = selected?.id === id;
      card.classList.toggle("selected", isSelected);
      card.querySelector(".select-card").setAttribute("aria-pressed", String(isSelected));
      card.querySelector(".selected-label").hidden = !isSelected;
    }
  }
  function changed() {
    if (onStateChange) onStateChange(window.MotionPicker.getState());
  }
  function setStatus(key) {
    statusKey = key;
    element("status").textContent = key ? t(key) : "";
  }
  function invalidate() {
    pending = null;
    setStatus("");
    setBusy(busy);
    changed();
  }
  function choose(item) {
    if (busy) return;
    if (selected?.id !== item.id) invalidate();
    selected = item;
    const data = draft(item);
    element("initial").hidden = true;
    element("compose").hidden = false;
    element("selected-name").textContent = templateName(item);
    element("selected-meta").textContent = `${item.id} · ${item.duration} ${t("seconds")}`;
    element("text-label").hidden = item.id[0] !== "T";
    element("text").value = data.text;
    element("accent").value = data.accent;
    element("request").value = data.request;
    markSelection();
    setBusy(busy);
    changed();
    if (!reduced.matches) play(item);
    else stop();
  }
  function selection() {
    if (!selected) return null;
    const data = draft(selected),
      parameters = { accent: data.accent };
    if (selected.id[0] === "T") parameters.text = data.text.trim() || "MOTION";
    return {
      schema_version: 1,
      skill: "tapnow-motion",
      library_version: "2.0.0",
      catalog_sha256: window.MotionCatalogSha256,
      template_id: selected.id,
      template_name: templateName(selected),
      parameters,
      output: { width: 1200, height: 675, fps: 60, duration: selected.duration },
      user_request: data.request.trim(),
    };
  }
  function setBusy(value) {
    busy = value;
    for(const [id,card]of cards){const b=card.querySelector('.use');b.disabled=value||externalBusy||(pending?.accepted&&selected?.id===id);b.textContent=t(pending?.accepted&&selected?.id===id?'selected':'useTemplate');}
    element("submit").disabled = value || externalBusy || pending?.accepted === true;
    for (const id of ["text", "accent", "request"]) element(id).disabled = value;
  }
  function intentId() {
    return typeof crypto.randomUUID === "function"
      ? crypto.randomUUID()
      : `motion-${Date.now()}-${Math.random().toString(36).slice(2)}`;
  }
  element("submit").onclick = async () => {
    if (!selected || busy || externalBusy || pending?.accepted || !handler) return;
    const spec = selection();
    setBusy(true);
    try {
      pending ??= { id: intentId(), accepted: false };
      changed();
      const result = await handler({ selection: spec, handoffId: pending.id });
      if (!result || result.accepted !== true) throw new Error("Receipt not confirmed");
      pending.accepted = true;
      changed();
      setStatus("statusReceived");
    } catch {
      setStatus("statusUnconfirmed");
    } finally {
      setBusy(false);
    }
  };
  document.querySelectorAll("[data-mode]").forEach((button) => {
    button.onclick = () => {
      mode = button.dataset.mode;
      category = "all";
      document.querySelectorAll("[data-mode]").forEach((other) => {
        other.setAttribute("aria-pressed", String(other === button));
      });
      filters();
      renderList();
      changed();
    };
  });
  element("categories").onclick = (event) => {
    const button = event.target.closest("[data-category]");
    if (button) {
      category = button.dataset.category;
      filters();
      renderList();
      changed();
      element("categories")
        .querySelector(`[data-category="${CSS.escape(category)}"]`)
        ?.focus();
    }
  };
  element("search").oninput = () => {
    query = element("search").value.trim().toLowerCase();
    renderList();
    changed();
  };
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) stop(); else if(!raf) raf=requestAnimationFrame(tick);
  });
  window.addEventListener("pagehide", stop);
  window.MotionPicker = {
    getSelection: selection,
    getState() {
      return {
        selectedId: selected?.id ?? null,
        mode,
        category,
        query,
        drafts: Object.fromEntries(drafts),
        pending,
      };
    },
    restoreState(state) {
      if (!state || typeof state !== "object") return;
      mode = ["all", "type", "graphics"].includes(state.mode) ? state.mode : "all";
      category = typeof state.category === "string" ? state.category : "all";
      query = typeof state.query === "string" ? state.query : "";
      element("search").value = query;
      document.querySelectorAll("[data-mode]").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.mode === mode));
      });
      if (state.drafts && typeof state.drafts === "object")
        for (const [id, value] of Object.entries(state.drafts)) {
          const item = byId.get(id);
          if (item && value && typeof value === "object") {
            drafts.set(id, {
              text: typeof value.text === "string" ? value.text.slice(0, 14) : "MOTION",
              accent: /^#[0-9a-fA-F]{6}$/.test(value.accent) ? value.accent : item.accent,
              request: typeof value.request === "string" ? value.request.slice(0, 1000) : "",
            });
          }
        }
      filters();
      if (
        ![...document.querySelectorAll("[data-category]")].some(
          (button) => button.dataset.category === category,
        )
      )
        category = "all";
      filters();
      renderList();
      if (typeof state.selectedId === "string" && byId.has(state.selectedId))
        choose(byId.get(state.selectedId));
      pending =
        state.pending &&
        typeof state.pending.id === "string" &&
        typeof state.pending.accepted === "boolean"
          ? state.pending
          : null;
      if (pending?.accepted) setStatus("statusAccepted");
      else if (pending) setStatus("statusRetry");
      setBusy(busy);
    },
    setStateHandler(callback) {
      onStateChange = callback;
    },
    setExternalBusy(value) {
      externalBusy = !!value;
      setBusy(busy);
      if (value) setStatus("statusBusy");
      else if (statusKey === "statusBusy")
        setStatus(pending?.accepted ? "statusAccepted" : pending ? "statusRetry" : "");
    },
    setSubmitHandler(callback) {
      if (callback !== null && typeof callback !== "function")
        throw new TypeError("Expected function or null");
      handler = callback;
    },
    setTheme(value) {
      if (value === "dark" || value === "light") document.documentElement.dataset.theme = value;
      else delete document.documentElement.dataset.theme;
    },
    setLocale(value) {
      const normalized = String(value || "").replaceAll("-", "_");
      locale = window.MotionLocales[normalized]
        ? normalized
        : /^zh/i.test(normalized)
          ? "zh_CN"
          : /^ja/i.test(normalized)
            ? "ja_JP"
            : /^ko/i.test(normalized)
              ? "ko_KR"
              : /^fr/i.test(normalized)
                ? "fr_FR"
                : "en_US";
      document.title = t("title");
      applyLocale();
    },
  };
  if (scenes.size !== items.length || items.some((item) => !scenes.has(item.id))) {
    element("error").hidden = false;
    element("error").textContent = t("previewUnavailable");
  }
  applyLocale();
})();
</script>
