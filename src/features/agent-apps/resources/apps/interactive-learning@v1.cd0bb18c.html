<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Learning</title>
  <style>
    /* 视觉平移自 interactive-learning 插件旧模板（syllabus-widget/board-widget）；
       设计令牌由 shared/design-tokens.css 构建期内联提供静态兜底，
       宿主 hostContext.styles.variables 运行时覆盖官方标准变量。 */
    html, body { margin: 0; padding: 0; background: transparent; }
    body {
      font-family: var(--font-sans, sans-serif);
      color: var(--color-text-primary, #eee);
      font-size: 13px;
      line-height: 1.5;
    }

    /* ── 学习目录（syllabus） ── */
    .ils{padding:4px 2px;display:block;width:100%}
    .ils .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
    .ils .hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
    .ils .kick{font-size:12px;text-transform:uppercase;letter-spacing:.1em;font-weight:600;color:var(--color-text-info)}
    .ils .ttl{font-size:15px;font-weight:500;color:var(--color-text-primary)}
    .ils .sub{font-size:12px;color:var(--color-text-secondary);margin:2px 0 .6rem}
    .ils .meter{display:flex;align-items:center;gap:10px;margin-bottom:1rem}
    .ils .bar{flex:1;height:6px;border-radius:var(--r-pill);background:var(--color-background-secondary);overflow:hidden}
    .ils .fill{height:100%;width:0;border-radius:var(--r-pill);background:var(--color-accent);transition:width 700ms ease}
    .ils .pct{font-size:12px;color:var(--color-text-secondary);white-space:nowrap}
    .ils .ch{background:var(--color-background-primary);border-radius:var(--r-md);padding:.6rem .75rem;margin-bottom:.75rem}
    .ils .ch.lk{opacity:.55}
    .ils .chhd{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
    .ils .chlbl{font-size:14px;font-weight:500;color:var(--color-text-primary);flex:1}
    .ils .chnote{font-size:12px;color:var(--color-text-secondary)}
    .ils .lv{display:flex;gap:10px;align-items:center;padding:9px 8px;border-radius:var(--r-sm);flex-wrap:wrap}
    .ils .lv.cur{outline:1px solid var(--color-accent)}
    .ils .lv.lk{opacity:.6}
    .ils .lv.deny{outline:1px solid var(--color-text-error)}
    .ils .st{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex:none;background:var(--color-background-secondary);color:var(--color-text-secondary)}
    .ils .lv.done .st{background:var(--color-accent-tint-strong);color:var(--color-text-primary)}
    .ils .lv.cur .st{background:var(--color-accent);color:var(--color-background-primary)}
    .ils .mid{flex:1;min-width:0}
    .ils .lttl{font-size:14px;font-weight:500;color:var(--color-text-primary)}
    .ils .why{display:inline-block;font-size:11px;padding:2px 8px;border-radius:var(--r-pill);background:var(--color-background-secondary);color:var(--color-text-secondary);white-space:nowrap;margin-top:3px}
    .ils .dots{display:flex;gap:3px;flex:none}
    .ils .dot{width:6px;height:6px;border-radius:50%;background:var(--color-border-secondary)}
    .ils .dot.on{background:var(--color-accent)}
    .ils .go{font-size:12px;border-radius:var(--r-pill);padding:4px 12px;cursor:pointer;flex:none;border:1px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-primary)}
    .ils .go.soft{opacity:.7}

    /* ── 学习板（board） ── */
    .ilb{padding:4px 2px;display:block;width:100%}
    .ilb .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
    .ilb .hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
    .ilb .kick{font-size:12px;text-transform:uppercase;letter-spacing:.1em;font-weight:600;color:var(--color-text-info)}
    .ilb .ttl{font-size:15px;font-weight:500;color:var(--color-text-primary)}
    .ilb .why{font-size:11px;padding:2px 8px;border-radius:var(--r-pill);background:var(--color-background-secondary);color:var(--color-text-secondary)}
    .ilb .nav{display:flex;gap:6px;margin:.6rem 0 .75rem;flex-wrap:wrap}
    .ilb .qd{font-size:12px;padding:4px 12px;border-radius:var(--r-pill);border:1px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-secondary);cursor:pointer;transition:background 120ms}
    .ilb .qd.on{background:var(--color-accent-tint-strong);color:var(--color-text-primary);border-color:transparent}
    .ilb .qd.dn{color:var(--color-text-primary)}
    .ilb .panel{background:var(--color-background-primary);border-radius:var(--r-md);padding:.75rem .9rem}
    .ilb .stem{font-size:14px;color:var(--color-text-primary);margin:0 0 .5rem}
    .ilb .note{font-size:12px;color:var(--color-text-secondary)}
    .ilb .mono{font-size:13px;background:var(--color-background-secondary);border-radius:var(--r-sm);padding:8px 10px;color:var(--color-text-primary);line-height:1.6;user-select:text}
    .ilb .previews{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;margin:.5rem 0}
    .ilb .fig{flex:1;min-width:180px}
    .ilb .fig img{width:100%;display:block;border-radius:var(--r-sm)}
    .ilb .cap{font-size:12px;color:var(--color-text-secondary);margin-top:4px}
    .ilb .opt{display:block;width:100%;text-align:left;font-size:13px;margin:5px 0;padding:7px 10px;border-radius:var(--r-sm);border:1px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-primary);cursor:pointer}
    .ilb .opt.good{border-color:var(--color-accent);background:var(--color-accent-tint-strong)}
    .ilb .opt.bad{border-color:var(--color-text-error)}
    .ilb .cloze{font-size:14px;line-height:2.1;color:var(--color-text-primary);user-select:text}
    .ilb .blank{display:inline-block;min-width:88px;text-align:center;border-bottom:2px solid var(--color-border-secondary);cursor:pointer;padding:0 6px;color:var(--color-text-primary);font-weight:500}
    .ilb .blank.ok{border-color:var(--color-accent)}
    .ilb .blank.bad{border-color:var(--color-text-error)}
    .ilb .bank{display:flex;gap:6px;flex-wrap:wrap;margin:.6rem 0}
    .ilb .chip{font-size:12px;padding:4px 12px;border-radius:var(--r-pill);border:1px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-primary);cursor:pointer}
    .ilb .chip.used{opacity:.35;pointer-events:none}
    .ilb textarea{width:100%;box-sizing:border-box;font-size:13px;font-family:inherit;border-radius:var(--r-sm);border:1px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-primary);padding:8px 10px;min-height:72px;resize:vertical}
    .ilb .fb{font-size:13px;margin:.5rem 0 0;color:var(--color-text-secondary)}
    .ilb .fb.err{color:var(--color-text-error)}
    .ilb .hint{font-size:13px;border-radius:var(--r-sm);background:var(--color-background-secondary);padding:8px 10px;margin-top:8px;color:var(--color-text-primary)}
    .ilb .hint b{font-weight:600;color:var(--color-text-info);margin-right:6px}
    .ilb .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:.6rem}
    .ilb .btn{font-size:13px;border-radius:var(--r-pill);padding:5px 14px;cursor:pointer;border:1px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-primary)}
    .ilb .ft{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:.75rem}
    .ilb .ft .sp{flex:1}
    .ilb .ghost{opacity:.5;pointer-events:none}
  </style>
