<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Production</title>
  <style>
    /*
     * 结构与尺寸写在这里；颜色相关的兜底在 panel-theme.css（必须在 design-tokens.css
     * 之后引入才能生效，见该文件顶部说明）。
     *
     * 本面板不画背景，表面与描边一律从 currentColor 派生——宿主是什么底色，面板就是
     * 什么底色，不需要知道也不需要猜。
     */
    body {
      font-family: var(--font-sans, sans-serif);
      color: var(--color-text-primary, #eee);
      font-size: 13px;
      line-height: 1.5;
    }
    .panel { padding: 4px 2px; display: flex; flex-direction: column; gap: 10px; }

    /* 计数紧跟标题，不甩到最右——两者是一句话，隔开读着费劲。 */
    .head { display: flex; align-items: baseline; gap: 8px; }
    .headline { font-size: 13px; font-weight: 600; margin: 0; }
    /*
     * 生成中时标题本身流光。标题在宿主背景上，渐变用 var(--color-text-primary)
     * 跟随宿主主题；写 currentColor 会取到本规则的 color: transparent，整条渐变
     * 变透明、文字消失。
     */
    .headline.working {
      color: transparent;
      /*
       * 与最初那版完全相同的渐变、尺寸、方向与速度——只把循环的落点对齐。
       *
       * 百分比 background-position 映射到像素是 p × (容器宽 − 图宽)。图宽 = 240%
       * 容器宽，所以挪过一个平铺周期需要的百分比行程是 2.4 / (2.4 − 1) = 171.4286%。
       * 原来走 190% → −90%（280%）= 1.633 个周期，非整数，每轮结尾必然跳一下；
       * 行程改成正好一个周期后接缝消失。时长同比缩到 4.6s，扫过的速度与原来一致。
       */
      background: linear-gradient(
        90deg,
        color-mix(in srgb, var(--color-text-primary) 38%, transparent) 0%,
        var(--color-text-primary) 42%,
        color-mix(in srgb, var(--color-text-primary) 38%, transparent) 72%
      );
      background-size: 240% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      animation: text-shimmer 4.6s linear infinite;
    }
    .counts { font-size: 12px; color: var(--color-text-tertiary); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
    }
    /*
     * 单件任务（一张图 / 一条视频）给一块大画面。
     * 成套用小格子是为了并排比对；只有一件时那件就是主角。
     */
    .grid.single {
      grid-template-columns: 1fr;
      max-width: 420px;
    }
    .grid.single .item { aspect-ratio: 4 / 3; border-radius: var(--border-radius-md, 12px); }
    .grid.single .item .name { padding: 14px 10px 8px; font-size: 12px; }

    .item {
      position: relative;
      aspect-ratio: 1;
      border: 1px solid var(--panel-line);
      border-radius: var(--border-radius-sm, 8px);
      background: var(--panel-surface);
      overflow: hidden;
    }
    .item img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .item video { width: 100%; height: 100%; object-fit: cover; display: block; }

    /*
     * 生成中：morphing gradient + 点阵纹理。
     *
     * 三个品牌色团各自沿不同路径漂移、缩放，叠加处自然混色——比一整片渐变平移
     * 更像"在流动"，且每一轮的形态都不重样。色团大小按 logo 上三色的占比给：
     * 偏橙的红最大、偏紫的蓝次之、偏黄的绿最小。blur 让边界糊掉，看到的是色彩
     * 在涌动，而不是三个圆在跑。
     *
     * 底色不透明，深浅宿主长得一样。
     */
    .aurora {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      background: color-mix(in srgb, var(--brand-2) 78%, #fff);
    }
    .blob {
      position: absolute;
      aspect-ratio: 1;
      border-radius: 50%;
      filter: blur(26px);
      will-change: transform;
    }
    /* 偏紫的蓝：占比第二，体量仅次于红。 */
    .blob-1 {
      width: 124%;
      left: -26%;
      top: -30%;
      background: radial-gradient(circle, var(--brand-1) 0%, transparent 68%);
      animation: drift-1 8s linear infinite;
    }
    /* 偏橙的红：logo 上铺得最广，给最大的体量，多数时候由它定基调。 */
    .blob-2 {
      width: 135%;
      right: -32%;
      top: -24%;
      background: radial-gradient(circle, var(--brand-2) 0%, transparent 66%);
      animation: drift-2 10.5s linear infinite;
    }
    /* 偏黄的绿：占比最小，只做点睛，别让它压过前两个。 */
    .blob-3 {
      width: 78%;
      left: 8%;
      bottom: -28%;
      background: radial-gradient(circle, var(--brand-3) 0%, transparent 70%);
      animation: drift-3 6.5s linear infinite;
    }
    /*
     * 三条路径都是闭合的椭圆轨道，按 45 度均匀取 8 个点，配 linear 匀速。
     *
     * 原来是「原点 → A → B → 原点」的三点折线配 ease-in-out，位置虽然首尾相同，
     * 但循环点上速度归零、方向近乎原路折返——每圈固定顿一下再拐回来，看起来就像
     * 没接上。逐段 ease-in-out 还让每个关键帧都成为一次停顿，一圈停三次。
     *
     * 椭圆闭环没有特殊起点：任意一点的进出方向都是同样的 45 度转折，循环点不再
     * 与众不同。八段弦等长，所以 linear 就是匀速，不需要缓动去凑。
     * scale 也跟着同一个角度走（1 + k·cosθ），因此天然与位移同周期、同样闭合。
     *
     * 三条轨道的中心、半径、缩放相位和周期（8 / 10.5 / 6.5s）都不同，合成后仍然
     * 看不出重复节奏。
     */
    @keyframes drift-1 {
      0%    { transform: translate(38%, 22%) scale(1.18); }
      12.5% { transform: translate(32%, 40%) scale(1.14); }
      25%   { transform: translate(16%, 48%) scale(1.05); }
      37.5% { transform: translate(0%, 40%) scale(0.96); }
      50%   { transform: translate(-6%, 22%) scale(0.92); }
      62.5% { transform: translate(0%, 4%) scale(0.96); }
      75%   { transform: translate(16%, -4%) scale(1.05); }
      87.5% { transform: translate(32%, 4%) scale(1.14); }
      100%  { transform: translate(38%, 22%) scale(1.18); }
    }
    @keyframes drift-2 {
      0%    { transform: translate(-4%, 26%) scale(1.16); }
      12.5% { transform: translate(-10%, 42%) scale(1.12); }
      25%   { transform: translate(-24%, 48%) scale(1.02); }
      37.5% { transform: translate(-38%, 42%) scale(0.92); }
      50%   { transform: translate(-44%, 26%) scale(0.88); }
      62.5% { transform: translate(-38%, 10%) scale(0.92); }
      75%   { transform: translate(-24%, 4%) scale(1.02); }
      87.5% { transform: translate(-10%, 10%) scale(1.12); }
      100%  { transform: translate(-4%, 26%) scale(1.16); }
    }
    @keyframes drift-3 {
      0%    { transform: translate(30%, -26%) scale(1.25); }
      12.5% { transform: translate(23%, -13%) scale(1.21); }
      25%   { transform: translate(6%, -8%) scale(1.10); }
      37.5% { transform: translate(-11%, -13%) scale(0.99); }
      50%   { transform: translate(-18%, -26%) scale(0.95); }
      62.5% { transform: translate(-11%, -39%) scale(0.99); }
      75%   { transform: translate(6%, -44%) scale(1.10); }
      87.5% { transform: translate(23%, -39%) scale(1.21); }
      100%  { transform: translate(30%, -26%) scale(1.25); }
    }

    .item .state {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-text-tertiary);
      text-align: center;
      padding: 0 8px;
    }
    /*
     * 点阵浮在色团之上做纹理，并被光带扫亮。
     *
     * dots 是常驻的暗态基准；dot-waves 里两条不同角度、不同周期的白色光带，经与点阵
     * 同参数的 mask 只在点上透出——于是看到的是点由暗变亮再变暗地依次点亮，而不是
     * 一条光带从画面上滑过。做法与参数沿用 canvas 的 WidgetLoadingPlaceholder。
     *
     * 卡片中间不放文字，放媒体类型图标：状态已由左上角标题表达，两处都写就重复了；
     * 但"这一格将来是图还是视频"是标题说不了的信息，值得占中间这个位置。
     */
    /*
     * 对角淡出，参考 ChatGPT 生图等待态的做法：整片点阵不是一张均匀的网，
     * 左上与右下渐隐，中间实。淡出遮罩放在这层包裹元素上而不是点阵本身——
     * .dot-waves 的 mask 已经被点阵图形占用，再叠一层要用 mask-composite，
     * 多一层包裹更稳，也不依赖合成模式的浏览器支持。
     */
    .dot-field {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(
        to top left,
        transparent 0%,
        #000 30%,
        #000 70%,
        transparent 100%
      );
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-size: 100% 100%;
      mask-image: linear-gradient(
        to top left,
        transparent 0%,
        #000 30%,
        #000 70%,
        transparent 100%
      );
      mask-repeat: no-repeat;
      mask-size: 100% 100%;
    }
    .dots,
    .dot-waves {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    /*
     * 亮暗对比靠「点变大」而不只是「点变亮」——halftone 的本质是尺寸调制。
     * 暗态点小且淡（半径 1.0px / alpha 0.16），光带那层的 mask 用更大的点
     * （半径 2.2px），两层同栅格同相位，于是扫到的地方点又大又白、扫不到的
     * 地方只剩一粒淡点。纯改 alpha 在这个尺寸下几乎看不出来，试过了。
     */
    .dots {
      background-image: radial-gradient(rgba(255, 255, 255, 0.16) 1px, transparent 1.1px);
      background-size: 17px 17px;
      background-position: center;
    }
    .dot-waves {
      -webkit-mask-image: radial-gradient(#000 2.2px, transparent 2.3px);
      -webkit-mask-size: 17px 17px;
      -webkit-mask-position: center;
      mask-image: radial-gradient(#000 2.2px, transparent 2.3px);
      mask-size: 17px 17px;
      mask-position: center;
    }
    .dot-wave {
      position: absolute;
      inset: -25%;
      filter: blur(9px);
      background-repeat: repeat;
      will-change: background-position;
    }
    .dot-wave-1 {
      background-image: repeating-linear-gradient(
        110deg,
        transparent 0px,
        transparent 120px,
        rgba(255, 255, 255, 1) 155px,
        rgba(255, 255, 255, 0.92) 175px,
        transparent 210px,
        transparent 320px
      );
      /* 水平周期 = 320px / sin(110deg)；取整会在平铺边界留下固定接缝。 */
      background-size: calc(320px / sin(110deg)) 100%;
      animation: dot-wave-1 6s linear infinite;
    }
    .dot-wave-2 {
      background-image: repeating-linear-gradient(
        70deg,
        transparent 0px,
        transparent 170px,
        rgba(255, 255, 255, 0.95) 210px,
        rgba(255, 255, 255, 0.8) 235px,
        transparent 275px,
        transparent 420px
      );
      background-size: calc(420px / sin(70deg)) 100%;
      animation: dot-wave-2 9s linear infinite;
    }
    /*
     * 媒体类型图标。两处用到：等待期告诉用户这一格产出的是图还是视频；产物已完成
     * 但被宿主 CSP 拦掉时，替掉原先的 IMAGE / VIDEO 文字徽标。
     *
     * 图形与画布节点占位一致（packages/icons 的 IconNodeImage / IconNodeVideo），
     * 用户在画布上见过同一个符号。尺寸跟着格子走：成套时格子只有 120px 上下，
     * 固定 48px 会占满一格。
     *
     * 默认色从 currentColor 派生——那是空格子的场景，底下是由 currentColor 派生的
     * 宿主表面，与画布上"深底 + 淡灰描边"同一套逻辑，深浅宿主都成立。
     */
    .item .glyph {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      width: clamp(22px, 26%, 52px);
      height: auto;
      color: color-mix(in srgb, currentColor 26%, transparent);
      fill: currentColor;
      pointer-events: none;
    }
    /*
     * 等待中的格子底下是流动的浅色色团，不是宿主表面，所以这里改用白色压出来的
     * 水印——比点阵重一档、能读出形状，又不至于抢过色彩流动。
     */
    .item.pending .glyph { color: rgba(255, 255, 255, 0.62); }

    @keyframes dot-wave-1 { from { background-position-x: 0; } to { background-position-x: calc(320px / sin(110deg)); } }
    @keyframes dot-wave-2 { from { background-position-x: 0; } to { background-position-x: calc(420px / sin(70deg)); } }
    @keyframes text-shimmer {
      from { background-position: 171.4286% 0; }
      to { background-position: 0% 0; }
    }

    /* 尊重系统的减少动态偏好：停掉漂移与流光，保留静态色团与实心文字。 */
    @media (prefers-reduced-motion: reduce) {
      .blob { animation: none; }
      .dot-waves { display: none; }
      .headline.working { animation: none; background: none; color: var(--color-text-primary); }
    }

    .item.failed { border-color: color-mix(in srgb, var(--color-text-error, #d36a6a) 45%, transparent); }
    .item.failed .state { color: var(--color-text-error, #d36a6a); }

    .item .name {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 2;
      padding: 10px 6px 4px;
      font-size: 11px;
      color: var(--color-text-primary);
      background: linear-gradient(transparent, var(--panel-scrim));
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      pointer-events: none;
    }
    /*
     * AI 生成标识：跟在标题后面，弱一档字色。
     *
     * 不做成独立角标——右上角挂一枚 badge 会和「正在生成」的状态角标抢同一块位置，
     * 而这两件事含义完全不同（一个是产物属性，一个是任务状态）。跟在标题后面既不
     * 增加视觉层级，也天然随标题一起被 ellipsis 截断，不会在窄卡片上顶出来。
     *
     * 用固定的白色半透明而不是 --color-text-tertiary：这行字压在缩略图与暗色遮罩上，
     * 主题色在浅色宿主里会解析成深色，落到深色遮罩上就看不见了。
     */
    .item .name .ai-badge {
      color: rgba(255, 255, 255, 0.72);
    }
    /*
     * 白字配暗渐变托底。底部这层渐变的方向必须与文字明暗相反——白字配亮渐变会
     * 直接糊掉，灰字配暗渐变会显脏，两种错法都试过。
     */
    .item.pending .name {
      color: rgba(255, 255, 255, 0.96);
      background: linear-gradient(transparent, rgba(48, 40, 66, 0.34));
    }
    /*
     * 有产物之后标题浮在成品图上。整条压边的渐变在浅色图上会糊成一片灰，文字反而
     * 更难读；改成只包住文字本身的胶囊，宽度跟着文字走，过长才截断。
     *
     * 底色与模糊对齐 ChatGPT 生图卡片上那颗按钮（bg-black/15 + backdrop-blur-md）。
     * 但那是给中间调照片用的：白字压在 15% 黑上，遇到很亮的图对比度只有约 1.57:1，
     * 远低于可读下限，而 backdrop-filter 只糊不压暗、救不了。所以补一层很淡的文字
     * 投影兜底——通透感不变，亮图上也还读得出。
     */
    .item.done .name {
      left: 8px;
      right: auto;
      bottom: 8px;
      /*
       * 上限收在 76%：长标题撑满整格的话，胶囊就退化成一条横杠，跟改之前的压边
       * 渐变没区别了。留出右侧空白，一眼能看出「这是个标签，且被截断了」。
       * min() 兜住极窄格子——那种情况下 76% 反而比 calc 大。
       */
      max-width: min(76%, calc(100% - 16px));
      width: fit-content;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      color: #fff;
      background: rgba(0, 0, 0, 0.15);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
    }
    /* 单件大图给的位置更宽裕，胶囊同比放大一点。 */
    .grid.single .item.done .name {
      left: 10px;
      bottom: 10px;
      /* 单件大图更宽，同样的比例会显得太长，收得更紧一些。 */
      max-width: min(58%, calc(100% - 20px));
      padding: 4px 10px;
      font-size: 12px;
    }

    .item .play {
      position: absolute;
      top: 6px;
      right: 6px;
      z-index: 2;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--panel-surface-strong);
      color: var(--color-text-primary);
      font-size: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .foot { display: flex; align-items: center; gap: 8px; }
    /* 描边与文字都压深一档：原来太淡，在浅色宿主上几乎读不出是个可点的东西。 */
    .open-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--color-text-primary);
      text-decoration: none;
      border: 1px solid color-mix(in srgb, currentColor 28%, transparent);
      border-radius: var(--border-radius-sm, 8px);
      padding: 5px 12px 5px 10px;
    }
    .open-link:hover {
      border-color: color-mix(in srgb, currentColor 45%, transparent);
      background: var(--panel-surface);
    }
    /* 宿主支持 ui/open-link 时这里没有 href，指针形状与焦点圈都要自己补上。 */
    .open-link[role="button"] { cursor: pointer; }
    .open-link:focus-visible {
      outline: 2px solid color-mix(in srgb, currentColor 55%, transparent);
      outline-offset: 2px;
    }
    /* 图标描边跟随文字色：outline 型，深浅宿主都成立。 */
    .open-link svg { flex-shrink: 0; stroke: currentColor; fill: none; }
    .open-link .brand { width: 15px; height: 15px; }
    /*
     * 右上箭头：明示这会离开当前宿主、在浏览器里打开，而不是在面板内展开。
     * 比文字更省位置，也是这个语义的通用符号。压淡一档不与品牌标记抢注意力，
     * hover 时提亮并朝右上挪一点，给一个"要出去了"的反馈。
     */
    .open-link .arrow {
      width: 12px;
      height: 12px;
      opacity: 0.5;
      transition: transform 140ms ease, opacity 140ms ease;
    }
    .open-link:hover .arrow {
      opacity: 0.9;
      transform: translate(1px, -1px);
    }

    .note { font-size: 12px; margin: 0; color: var(--color-text-tertiary); }
    .note.err { color: var(--color-text-error, #d36a6a); }
    /* 兜底显示的工程地址要能整条读出来并选中复制，不能被裁掉。 */
