<!doctype html>
<!-- 电商一键组图 Widget 壳：样式 + #root；逻辑由 main.ts 挂载。 -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-commerce Photo Set</title>
  <style>
    html, body { margin: 0; padding: 0; background: #1f1f1f !important; }
    body {
      font-family: var(--font-sans, Inter, "PingFang SC", sans-serif);
      color: var(--color-text-primary, #eee);
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }
    button, select, input, textarea { font: inherit; }

    .panel {
      position: relative;
      width: 100%;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #1f1f1f;
      overflow: visible;
    }

    .header {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      padding: 4px 8px 8px;
    }
    .header-title {
      color: rgba(255, 255, 255, 0.6);
      font-size: 12px;
      font-weight: 400;
      line-height: 16px;
      letter-spacing: 0.12px;
    }
    .header-heading {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .header-subtitle {
      color: var(--color-text-primary, rgba(255, 255, 255, 0.95));
      font-size: 13px;
      font-weight: 500;
      line-height: 18px;
      letter-spacing: 0.12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-status {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      max-width: 55%;
      color: rgba(255, 255, 255, 0.9);
      font-size: 12px;
      font-weight: 400;
      line-height: 16px;
      letter-spacing: 0.12px;
    }
    .header-status-dot {
      width: 6px;
      height: 6px;
      flex: none;
      border-radius: 50%;
      background: currentColor;
    }
    .header-status-text {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .header-status.warning { color: var(--color-text-warning, #fdce8b); }
    .header-status.success { color: #7cd5a7; }
    .header-status.error { color: #a55050; }

    .prompt-frame {
      border-radius: 16px;
      background: #2f2f2f;
      padding: 4px;
    }
    .prompt-list-wrap {
      min-width: 0;
    }
    .prompt-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .prompt-item {
      border-radius: 12px;
      padding: 8px;
      cursor: pointer;
      transition: background 120ms;
    }
    .prompt-item:hover { background: rgba(255, 255, 255, 0.1); }
    .prompt-item.expanded,
    .prompt-item.expanded:hover {
      cursor: default;
      background: rgba(255, 255, 255, 0.06);
      outline: 1px solid rgba(255, 255, 255, 0.3);
      outline-offset: -1px;
    }
    .prompt-item:focus-visible {
      outline: 1px solid rgba(255, 255, 255, 0.22);
      outline-offset: -1px;
    }
    .prompt-item-row {
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }
    .prompt-index {
      flex: none;
      color: rgba(255, 255, 255, 0.9);
      font-size: 14px;
      line-height: 20px;
      font-variant-numeric: tabular-nums;
    }
    .prompt-body { min-width: 0; flex: 1; }
    .prompt-theme {
      color: rgba(255, 255, 255, 0.9);
      font-size: 14px;
      line-height: 20px;
      letter-spacing: 0.12px;
      font-weight: 500;
    }
    .prompt-theme.empty { color: rgba(255, 255, 255, 0.32); font-weight: 400; }
    .prompt-preview-lines {
      margin-top: 4px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .prompt-preview {
      color: rgba(255, 255, 255, 0.68);
      font-size: 14px;
      line-height: 20px;
      letter-spacing: 0.12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .prompt-preview-label {
      color: rgba(255, 255, 255, 0.45);
      margin-right: 4px;
    }
    .prompt-preview.empty { color: rgba(255, 255, 255, 0.32); }
    .prompt-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: none;
      align-self: flex-start;
      margin-top: 2px;
    }
    .expand-icon {
      width: 16px;
      height: 16px;
      color: rgba(255, 255, 255, 0.6);
      transition: transform 120ms, color 120ms;
      flex: none;
    }
    .prompt-item:hover .expand-icon { color: rgba(255, 255, 255, 0.8); }
    .prompt-item.expanded .expand-icon { display: none; }

    .edit-fields {
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }
    .edit-fields-content {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .edit-theme-field {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .edit-theme-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .edit-theme-row input {
      min-width: 0;
      flex: 1;
    }
    .edit-fields .prompt-index {
      line-height: 22px;
    }
    .edit-field {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .field-label {
      margin: 0;
      color: rgba(255, 255, 255, 0.45);
      font-size: 12px;
      font-weight: 500;
      line-height: 16px;
      letter-spacing: 0.12px;
    }
    .char-count {
      flex: none;
      color: rgba(255, 255, 255, 0.38);
      font-size: 11px;
      line-height: 16px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.12px;
    }
    .char-count.near-limit { color: var(--color-text-warning, #fdce8b); }
    .char-count.at-limit { color: var(--color-text-error, #d36a6a); }
    .edit-field .char-count {
      align-self: flex-end;
    }
    .edit-field textarea {
      width: 100%;
      min-width: 0;
      min-height: 20px;
      height: auto;
      overflow: hidden;
      field-sizing: content;
    }
    .edit-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 0;
    }
    .prompt-action {
      border: 0;
      border-radius: 8px;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.09);
      color: #f5f5f5;
      font-size: 12px;
      font-weight: 400;
      line-height: 12px;
      cursor: pointer;
      transition: background 120ms;
    }
    .prompt-action:hover { background: rgba(255, 255, 255, 0.14); }
    .prompt-action:disabled { opacity: 0.4; cursor: not-allowed; }

    input, textarea {
      width: 100%;
      border: 0;
      border-radius: 0;
      color: rgba(255, 255, 255, 0.9);
      background: transparent;
      outline: none;
      box-shadow: none;
      padding: 0;
    }
    input {
      height: 22px;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.12px;
      line-height: 20px;
    }
    textarea {
      resize: none;
      font-size: 14px;
      line-height: 20px;
      letter-spacing: 0.12px;
    }
    input:focus, textarea:focus, select:focus { outline: none; }
    input:disabled, textarea:disabled, select:disabled { opacity: 0.5; cursor: not-allowed; }
    .invalid {
      outline: 1px solid color-mix(in srgb, var(--color-text-error, #d36a6a) 70%, transparent);
      outline-offset: 2px;
      border-radius: 4px;
    }
    .row-note {
      display: block;
      margin-top: 4px;
      color: rgba(255, 255, 255, 0.38);
      font-size: 11px;
      line-height: 16px;
    }
    .row-note.error { color: var(--color-text-error, #d36a6a); }
    .row-note.success { color: var(--color-text-success, #7cd5a7); }

    .bottom-bar {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .actions-spacer { flex: 1; min-width: 0; }
    .chip-static,
    .chip-trigger {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 0;
      border-radius: 8px;
      padding: 6px 8px;
      color: rgba(255, 255, 255, 0.88);
      background: transparent;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      line-height: 20px;
    }
    .chip {
      position: relative;
      display: inline-flex;
    }
    .chip-trigger {
      cursor: pointer;
      transition: background-color 120ms;
    }
    .chip-trigger:hover:not(:disabled) { background: rgba(255, 255, 255, 0.05); }
    .chip-trigger:disabled { opacity: 0.5; cursor: not-allowed; }
    .chip-trigger:focus { outline: none; }
    .chip-trigger-static { cursor: default; }
    .chip-icon {
      width: 14px;
      height: 14px;
      flex: none;
      color: rgba(255, 255, 255, 0.56);
    }
    .chip-model-icon {
      width: 16px;
      height: 16px;
      flex: none;
      border-radius: 2px;
      object-fit: contain;
    }
    .chip-value {
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .chip-chevron {
      width: 12px;
      height: 12px;
      flex: none;
      color: rgba(255, 255, 255, 0.4);
    }
    .chip-menu {
      position: fixed;
      z-index: 50;
      min-width: 120px;
      max-height: min(240px, calc(100vh - 16px));
      overflow-x: hidden;
      overflow-y: auto;
      padding: 4px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgb(38, 38, 38);
      color: rgb(204, 204, 204);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
    }
    .chip-menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 6px 8px;
      background: transparent;
      color: rgba(255, 255, 255, 0.88);
      font-family: inherit;
      font-size: 12px;
      font-weight: 400;
      line-height: 20px;
      text-align: left;
      cursor: pointer;
    }
    .chip-menu-item:hover { background: rgb(64, 64, 64); }
    .chip-menu-item.is-selected { font-weight: 600; }
    .chip-menu-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .chip-menu-check {
      width: 14px;
      height: 14px;
      flex: none;
      color: rgba(255, 255, 255, 0.88);
    }
    .chip-divider {
      width: 1px;
      height: 16px;
      background: rgba(255, 255, 255, 0.1);
      flex: none;
    }

    .generate {
      flex: none;
      display: inline-flex;
      align-items: center;
      padding: 8px 12px;
      border: 0;
      border-radius: 8px;
      color: #0f0f0f;
      background: #f5f5f5;
      font-size: 12px;
      font-weight: 400;
      line-height: 12px;
      cursor: pointer;
      transition: opacity 120ms;
    }
    .generate:hover:not(:disabled) { opacity: 0.85; }
    .generate:disabled { opacity: 0.4; cursor: not-allowed; }
    .generate[hidden] { display: none; }
    .generate-price {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex: none;
      color: rgba(255, 255, 255, 0.6);
      font-size: 12px;
      font-weight: 400;
      line-height: 16px;
      letter-spacing: 0.12px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      pointer-events: none;
    }
    .generate-price[title] { pointer-events: auto; cursor: default; }
    .tapies-icon {
      flex: none;
      stroke: currentColor;
      stroke-width: 1.2;
    }
    .generate-price.is-loading .generate-price-value {
      color: transparent;
      border-radius: 4px;
      background: linear-gradient(90deg, rgba(255,255,255,.12), rgba(255,255,255,.4), rgba(255,255,255,.12));
      background-size: 200% 100%;
      animation: price-shimmer 1.2s linear infinite;
    }
    .generate-price.is-unavailable { color: rgba(255, 255, 255, 0.4); }
    .confirmation-layer {
      position: absolute;
      inset: 0;
      z-index: 40;
      display: flex;
      align-items: flex-end;
      padding: 12px;
      border-radius: 16px;
      background: rgba(15, 15, 15, 0.78);
    }
    .confirmation-dialog {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      background: #2f2f2f;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
    }
    .confirmation-title {
      margin: 0;
      color: rgba(255, 255, 255, 0.95);
      font-size: 14px;
      font-weight: 600;
      line-height: 20px;
    }
    .confirmation-counts {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      color: rgba(255, 255, 255, 0.72);
      font-size: 12px;
      line-height: 16px;
    }
    .confirmation-counts span + span::before {
      content: "·";
      margin-right: 6px;
      color: rgba(255, 255, 255, 0.32);
    }
    .confirmation-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .confirmation-label {
      color: rgba(255, 255, 255, 0.45);
      font-size: 11px;
      font-weight: 500;
      line-height: 16px;
      letter-spacing: 0.12px;
    }
    .confirmation-params {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .confirmation-param {
      display: inline-flex;
      align-items: center;
      min-width: 0;
      padding: 4px 7px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.07);
      color: rgba(255, 255, 255, 0.86);
      font-size: 12px;
      font-weight: 500;
      line-height: 16px;
    }
    .confirmation-billing {
      color: rgba(255, 255, 255, 0.86);
      font-size: 12px;
      line-height: 17px;
    }
    .confirmation-warning {
      margin: 0;
      color: var(--color-text-warning, #fdce8b);
      font-size: 12px;
      line-height: 17px;
    }
    .confirmation-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .confirmation-cancel,
    .confirmation-submit {
      min-height: 30px;
    }
    .confirmation-cancel:focus-visible,
    .confirmation-submit:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.65);
      outline-offset: 2px;
    }
    @keyframes price-shimmer {
      from { background-position: 200% 0; }
      to { background-position: -200% 0; }
    }
  </style>
