<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Layer Composer</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: transparent; }
    body {
      font-family: var(--font-sans, Inter, ui-sans-serif, system-ui, sans-serif);
      color: var(--color-text-primary, #f2f2f4);
      font-size: 13px;
      line-height: 1.45;
    }
    button, input, select { font: inherit; }
    button { color: inherit; }
    .layer-composer {
      width: 100%;
      padding: 8px 4px 4px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .fatal-error {
      padding: 28px 20px;
      border: 1px solid var(--color-border-primary, rgba(255,255,255,.13));
      border-radius: 14px;
      color: var(--color-text-secondary, #aaa);
      background: var(--color-background-secondary, rgba(255,255,255,.035));
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .panel-header h2 {
      margin: 0;
      font-size: 16px;
      line-height: 1.25;
      letter-spacing: -.01em;
    }
    .panel-header p {
      margin: 3px 0 0;
      color: var(--color-text-secondary, #999);
      font-size: 11px;
    }
    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 260px;
      gap: 14px;
      align-items: stretch;
    }
    .board-pane, .sidebar {
      min-width: 0;
      border: 1px solid var(--color-border-primary, rgba(255,255,255,.11));
      border-radius: 14px;
      background: var(--color-background-secondary, rgba(255,255,255,.025));
      overflow: hidden;
    }
    .board-pane { display: flex; flex-direction: column; }
    .board-toolbar {
      display: grid;
      grid-template-columns: minmax(150px, 1fr) 82px 82px minmax(130px, .8fr);
      gap: 8px;
      padding: 10px;
      border-bottom: 1px solid var(--color-border-primary, rgba(255,255,255,.09));
    }
    .field {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      color: var(--color-text-secondary, #aaa);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .02em;
    }
    .field > input, .field > select, .background-control select {
      width: 100%;
      height: 30px;
      min-width: 0;
      padding: 0 8px;
      border: 1px solid var(--color-border-primary, rgba(255,255,255,.12));
      border-radius: 8px;
      outline: none;
      background: var(--color-background-primary, rgba(0,0,0,.12));
      color: var(--color-text-primary, #eee);
      font-size: 11px;
    }
    .field > input:focus, .field > select:focus, .background-control select:focus {
      border-color: #7c6df2;
      box-shadow: 0 0 0 2px rgba(124,109,242,.15);
    }
    .background-control { display: flex; gap: 6px; align-items: center; }
    .background-control select { flex: 1; }
    .background-control input[type="color"] {
      width: 30px;
      height: 30px;
      padding: 2px;
      border: 1px solid var(--color-border-primary, rgba(255,255,255,.12));
      border-radius: 8px;
      background: transparent;
    }
    .board-frame {
      min-height: 330px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 30% 20%, rgba(124,109,242,.08), transparent 38%),
        var(--color-background-primary, rgba(0,0,0,.08));
    }
    .artboard {
      display: block;
      max-width: 100%;
      box-shadow: 0 14px 40px rgba(0,0,0,.28), 0 0 0 1px rgba(0,0,0,.15);
      touch-action: none;
      cursor: default;
      outline: none;
    }
    .artboard:focus-visible { box-shadow: 0 0 0 2px #7c6df2, 0 14px 40px rgba(0,0,0,.28); }
    .sidebar {
      display: flex;
      flex-direction: column;
      max-height: 620px;
    }
    .side-section {
      min-height: 0;
      padding: 11px;
      border-bottom: 1px solid var(--color-border-primary, rgba(255,255,255,.09));
    }
    .side-section:last-child { border-bottom: 0; }
    .side-section h3 {
      margin: 0 0 9px;
      font-size: 11px;
      color: var(--color-text-secondary, #aaa);
      text-transform: uppercase;
      letter-spacing: .07em;
    }
    .layer-list {
      max-height: 285px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .layer-row {
      min-width: 0;
      height: 44px;
      display: grid;
      grid-template-columns: 24px 34px minmax(0, 1fr) auto;
      gap: 7px;
      align-items: center;
      padding: 4px 5px;
      border: 1px solid transparent;
      border-radius: 9px;
      cursor: pointer;
    }
    .layer-row:hover { background: rgba(255,255,255,.045); }
    .layer-row.selected {
      border-color: rgba(124,109,242,.55);
      background: rgba(124,109,242,.12);
    }
    .layer-row img {
      width: 34px;
      height: 34px;
      border-radius: 6px;
      object-fit: cover;
      background: rgba(255,255,255,.05);
    }
    .layer-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11px;
    }
    .layer-order-controls { display: flex; gap: 1px; }
    .icon-button {
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--color-text-secondary, #999);
      cursor: pointer;
      font-size: 11px;
    }
    .icon-button:hover { background: rgba(255,255,255,.07); color: inherit; }
    .visibility { font-size: 9px; }
    .inspector { flex: 1; }
    .property-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 9px;
    }
    .range-control { display: flex; align-items: center; gap: 8px; height: 30px; }
    .range-control input { flex: 1; accent-color: #7c6df2; }
    .range-control output {
      width: 38px;
      text-align: right;
      color: var(--color-text-primary, #eee);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }
    .empty-hint {
      margin: 0;
      color: var(--color-text-secondary, #999);
      font-size: 11px;
    }
    .panel-footer {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px 14px;
      align-items: center;
    }
    .panel-footer > p:first-child {
      margin: 0;
      color: var(--color-text-secondary, #999);
      font-size: 10px;
    }
    .footer-actions { display: flex; gap: 8px; justify-content: flex-end; }
    button.primary, button.secondary, button.ghost {
      height: 34px;
      padding: 0 14px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 650;
    }
    button.primary {
      border: 1px solid #7465ec;
      background: #7465ec;
      color: white;
      min-width: 120px;
    }
    button.primary:hover:not(:disabled) { background: #8375f5; }
    button.primary:disabled { opacity: .45; cursor: not-allowed; }
    button.secondary, button.ghost {
      border: 1px solid var(--color-border-primary, rgba(255,255,255,.13));
      background: transparent;
      color: var(--color-text-secondary, #aaa);
    }
    button.secondary:hover, button.ghost:hover { color: inherit; background: rgba(255,255,255,.04); }
    button.ghost { height: 30px; padding: 0 10px; }
    .status {
      grid-column: 1 / -1;
      min-height: 16px;
      margin: 0;
      font-size: 11px;
    }
    .status.ok { color: #4fc38a; }
    .status.err { color: #ff7e7e; }
    .status.warn { color: #d8ad62; }
    @media (max-width: 680px) {
      .workspace { grid-template-columns: 1fr; }
      .sidebar { max-height: none; }
      .layer-list { max-height: 220px; }
      .board-toolbar { grid-template-columns: 1fr 1fr; }
      .board-frame { min-height: 280px; }
    }
    @media (max-width: 420px) {
      .board-toolbar { grid-template-columns: 1fr; }
      .panel-footer { grid-template-columns: 1fr; }
      .footer-actions { justify-content: stretch; }
      .footer-actions button { flex: 1; }
    }
