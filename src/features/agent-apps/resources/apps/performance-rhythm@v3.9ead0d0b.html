<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Performance Score</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: transparent; }
    body {
      color: var(--color-text-primary, rgba(255, 255, 255, .95));
      font-family: var(--font-sans, Inter, ui-sans-serif, system-ui, sans-serif);
      font-size: 13px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; }
    button { color: inherit; }
    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    [tabindex]:focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 2px;
    }
    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .rhythm {
      --score-surface: color-mix(in srgb, var(--color-accent, #90c4e5) 4%, #1b1b1b);
      --score-grid: color-mix(in srgb, var(--color-accent, #90c4e5) 9%, transparent);
      display: flex;
      width: 100%;
      max-width: 880px;
      flex-direction: column;
      gap: 14px;
      padding: 8px 4px 4px;
    }
    .rhythm.invalid {
      min-height: 108px;
      justify-content: center;
      border: 1px solid var(--color-border-primary);
      border-radius: var(--r-md);
      background: var(--color-background-primary);
      padding: 16px;
    }

    .header {
      display: grid;
      min-width: 0;
      align-items: center;
      gap: 8px 10px;
      grid-template-columns: minmax(0, 1fr) auto auto;
      padding: 0 2px;
    }
    .title-block { min-width: 0; }
    .kicker,
    .eyebrow,
    .duration-label,
    .beats-title,
    .field-label {
      color: var(--color-text-tertiary);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .03em;
    }
    .kicker {
      color: var(--color-text-info);
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .title {
      margin: 3px 0 4px;
      overflow: hidden;
      color: var(--color-text-primary);
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -.02em;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .scene {
      max-width: 720px;
      margin: 0;
      overflow: hidden;
      color: var(--color-text-secondary);
      font-size: 12px;
      line-height: 1.5;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .duration-lock {
      display: grid;
      align-items: center;
      gap: 0 7px;
      grid-template-columns: auto auto;
      border: 1px solid var(--color-border-primary);
      border-radius: var(--r-md);
      background: var(--color-background-secondary);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.025);
      padding: 6px 10px;
    }
    .duration-value,
    .scrubber-time,
    .inline-value,
    .beat-row-time {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }
    .duration-value { font-size: 12px; font-weight: 600; }
    .duration-note {
      grid-column: 1 / -1;
      color: var(--color-text-tertiary);
      font-size: 9px;
      line-height: 1.35;
    }
    .reset-button {
      min-height: 32px;
      border: 0;
      border-radius: var(--r-sm);
      background: transparent;
      color: var(--color-text-secondary);
      cursor: pointer;
      font-size: 11px;
      padding: 0 9px;
      transition: background 120ms ease, color 120ms ease, transform 100ms ease;
    }
    .reset-button:hover {
      background: var(--interaction-hover);
      color: var(--color-text-primary);
    }
    .reset-button:active { transform: scale(.97); }

    .workspace {
      display: grid;
      min-width: 0;
      align-items: start;
      gap: 12px;
      grid-template-columns: minmax(0, 1fr) minmax(230px, 254px);
    }
    .score {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 12px;
    }
    .beats-section,
    .curve-section,
    .selection-editor {
      min-width: 0;
      box-sizing: border-box;
      border: 1px solid var(--color-border-primary);
      border-radius: var(--r-md);
      background: var(--score-surface);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.025);
    }
    .beats-section,
    .selection-editor { padding: 12px; }
    .curve-section { padding: 11px 12px 9px; }
    .beats-head,
    .curve-head,
    .selection-head {
      display: flex;
      min-width: 0;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }
    .beats-title {
      color: var(--color-text-primary);
      font-size: 12px;
    }
    .beats-meta,
    .curve-note {
      overflow: hidden;
      color: var(--color-text-tertiary);
      font-size: 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .beat-palette {
      display: grid;
      gap: 5px;
      margin-top: 9px;
      grid-template-columns: repeat(6, minmax(0, 1fr));
    }
    .beat-tool {
      min-width: 0;
      min-height: 32px;
      overflow: hidden;
      border: 1px solid var(--color-border-primary);
      border-radius: var(--r-sm);
      background: transparent;
      box-shadow: inset 2px 0 color-mix(in srgb, var(--beat) 72%, transparent);
      color: var(--color-text-secondary);
      cursor: pointer;
      font-size: 10px;
      padding: 5px 7px;
      text-overflow: ellipsis;
      transition: border-color 120ms ease, background 120ms ease, color 120ms ease,
        transform 100ms ease;
      white-space: nowrap;
    }
    .beat-tool:hover {
      border-color: var(--color-border-secondary);
      background: var(--interaction-hover);
      color: var(--color-text-primary);
    }
    .beat-tool:active { transform: scale(.97); }
    .beat-lane {
      position: relative;
      height: 46px;
      margin-top: 9px;
      overflow: hidden;
      border: 1px solid var(--color-border-primary);
      border-radius: var(--r-sm);
      background:
        linear-gradient(90deg, var(--score-grid) 1px, transparent 1px) 0 0 / 10% 100%,
        radial-gradient(circle at 50% 140%, var(--color-accent-06), transparent 58%),
        var(--color-background);
    }
    .lane-line {
      position: absolute;
      top: 50%;
      right: 10px;
      left: 10px;
      height: 1px;
      background: var(--color-border-secondary);
    }
    .beat-marker {
      position: absolute;
      top: 50%;
      display: inline-flex;
      width: 26px;
      height: 26px;
      align-items: center;
      justify-content: center;
      border: 1px solid color-mix(in srgb, var(--beat) 46%, var(--color-border-primary));
      border-radius: var(--r-sm);
      background: color-mix(in srgb, var(--beat) 10%, var(--color-background));
      color: color-mix(in srgb, var(--beat) 72%, white);
      cursor: ew-resize;
      font-family: var(--font-mono);
      font-size: 10px;
      touch-action: none;
      transform: translate(-50%, -50%);
      transition: border-color 120ms ease, background 120ms ease, box-shadow 120ms ease,
        transform 120ms ease;
      will-change: left, transform;
    }
    .beat-marker.selected {
      border-color: var(--color-accent);
      box-shadow: 0 0 0 3px var(--color-accent-12);
      transform: translate(-50%, -50%) scale(1.04);
    }
    .beat-marker.dragging {
      border-color: var(--color-accent);
      background: var(--color-accent-tint);
      box-shadow: 0 5px 16px rgba(0,0,0,.28), 0 0 0 4px var(--color-accent-12);
      cursor: grabbing;
      transform: translate(-50%, -50%) scale(1.08);
      transition: border-color 80ms ease, background 80ms ease, box-shadow 80ms ease;
    }
    .beat-selection-strip {
      display: flex;
      min-width: 0;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 7px;
      border-radius: var(--r-sm);
      border: 1px solid transparent;
      background: var(--color-background-secondary);
      padding: 7px 8px;
      transition: border-color 120ms ease, background 120ms ease;
    }
    .beat-selection-identity {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 8px;
    }
    .beat-selection-glyph,
    .beat-row-glyph {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      color: color-mix(in srgb, var(--beat) 72%, white);
      font-family: var(--font-mono);
    }
    .beat-selection-glyph {
      width: 24px;
      height: 24px;
      background: color-mix(in srgb, var(--beat) 10%, transparent);
      font-size: 10px;
    }
    .beat-selection-details {
      display: flex;
      min-width: 0;
      flex-direction: column;
    }
    .beat-selection-name {
      color: var(--color-text-primary);
      font-size: 11px;
      font-weight: 600;
    }
    .beat-selection-note {
      overflow: hidden;
      color: var(--color-text-tertiary);
      font-size: 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .beat-list {
      display: flex;
      max-height: 164px;
      flex-direction: column;
      gap: 2px;
      margin-top: 6px;
      overflow: auto;
    }
    .beat-row {
      display: grid;
      min-width: 0;
      min-height: 32px;
      align-items: center;
      gap: 7px;
      border: 0;
      border-radius: var(--r-sm);
      background: transparent;
      color: var(--color-text-secondary);
      cursor: pointer;
      grid-template-columns: 22px 46px 72px minmax(0, 1fr) auto;
      padding: 4px 7px;
      text-align: left;
      transition: border-color 120ms ease, background 120ms ease, color 120ms ease,
        transform 100ms ease;
    }
    .beat-row:hover { background: var(--interaction-hover); }
    .beat-row.selected {
      background: var(--color-accent-surface);
      color: var(--color-text-primary);
    }
    .beat-row:active { transform: scale(.985); }
    .beat-row-glyph {
      width: 20px;
      height: 20px;
      background: color-mix(in srgb, var(--beat) 9%, transparent);
      font-size: 9px;
    }
    .beat-row-time { color: var(--color-text-tertiary); font-size: 10px; }
    .beat-row-name,
    .beat-row-label { font-size: 11px; }
    .beat-row-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .beat-row-intensity {
      color: var(--color-text-tertiary);
      font-size: 10px;
    }
    .beat-empty {
      margin: 7px 0 0;
      border: 1px dashed var(--color-border-secondary);
      border-radius: var(--r-sm);
      color: var(--color-text-tertiary);
      font-size: 11px;
      padding: 10px;
      text-align: center;
    }

    .curve-head { margin-bottom: 7px; }
    .graph-shell {
      display: grid;
      min-height: 188px;
      overflow: hidden;
      border: 1px solid var(--color-border-primary);
      border-radius: var(--r-md);
      grid-template-columns: 38px minmax(0, 1fr);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.018);
    }
    .drive-axis {
      position: relative;
      background: var(--color-background);
    }
    .axis-label {
      position: absolute;
      right: 6px;
      color: var(--color-text-tertiary);
      font-size: 8px;
      transform: translateY(-50%);
    }
    .axis-label.high { top: 14%; }
    .axis-label.mid { top: 50%; }
    .axis-label.low { top: 86%; }
    .graph {
      position: relative;
      min-width: 0;
      min-height: 188px;
      overflow: hidden;
      border-left: 1px solid var(--color-border-primary);
      background:
        linear-gradient(90deg, var(--score-grid) 1px, transparent 1px) 0 0 / 10% 100%,
        radial-gradient(circle at 50% 115%, var(--color-accent-06), transparent 58%),
        var(--color-background);
    }
    .graph-svg {
      display: block;
      width: 100%;
      height: 188px;
      overflow: visible;
      cursor: crosshair;
    }
    .grid-line {
      stroke: var(--color-border-primary);
      stroke-dasharray: 4 7;
      vector-effect: non-scaling-stroke;
    }
    .grid-line.mid { stroke: var(--color-border-secondary); }
    .curve-fill { fill: url(#performance-breath); pointer-events: none; }
    .curve-line {
      fill: none;
      stroke: url(#performance-curve);
      stroke-linecap: round;
      stroke-width: 2.25;
      vector-effect: non-scaling-stroke;
      pointer-events: none;
    }
    .curve-point { cursor: grab; touch-action: none; }
    .curve-point:active { cursor: grabbing; }
    .point-hit { fill: transparent; }
    .point-ring {
      fill: var(--color-background);
      stroke: var(--color-text-secondary);
      stroke-width: 1.5;
      vector-effect: non-scaling-stroke;
      transition: r 120ms ease, stroke 120ms ease, fill 120ms ease;
    }
    .point-core { fill: var(--color-text-primary); }
    .curve-point.selected .point-ring {
      r: 12px;
      fill: var(--color-accent-tint);
      stroke: var(--color-accent);
      stroke-width: 2;
    }
    .curve-point.selected .point-core { fill: var(--color-accent); }
    .curve-point.dragging .point-ring {
      r: 14px;
      fill: var(--color-accent-tint-strong);
      stroke: var(--color-accent-on-tint);
      stroke-width: 2;
      transition: r 80ms ease, stroke 80ms ease, fill 80ms ease;
    }
    .curve-point.dragging .point-core { fill: var(--color-accent-on-tint); }
    .playhead-line {
      stroke: var(--color-text-tertiary);
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
      pointer-events: none;
    }
    .playhead-dot {
      fill: var(--color-text-primary);
      stroke: var(--color-background);
      stroke-width: 3;
      vector-effect: non-scaling-stroke;
      pointer-events: none;
    }
    .add-point-hint {
      position: absolute;
      right: 7px;
      bottom: 5px;
      color: var(--color-text-tertiary);
      font-size: 9px;
      pointer-events: none;
    }
    .scrubber {
      display: grid;
      align-items: center;
      gap: 9px;
      margin: 7px 0 0;
      grid-template-columns: 72px minmax(0, 1fr);
    }
    .scrubber-label {
      display: flex;
      flex-direction: column;
      color: var(--color-text-tertiary);
      font-size: 9px;
    }
    .scrubber-time {
      color: var(--color-text-primary);
      font-size: 11px;
    }
    .playhead-range,
    .drive-range {
      width: 100%;
      height: 18px;
      margin: 0;
      accent-color: var(--color-accent);
      cursor: ew-resize;
    }
    .playhead-range:active,
    .drive-range:active { cursor: grabbing; }

    .inspector {
      display: flex;
      min-width: 0;
      flex-direction: column;
    }
    .selection-editor {
      position: sticky;
      top: 0;
    }
    .selection-type {
      color: var(--color-text-primary);
      font-size: 12px;
      font-weight: 600;
    }
    .editor-content {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-top: 11px;
    }
    .field {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 5px;
    }
    .number-input,
    .select-input,
    .text-input {
      width: 100%;
      height: 34px;
      box-sizing: border-box;
      border: 1px solid var(--color-border-secondary);
      border-radius: var(--r-sm);
      background: var(--color-background-secondary);
      color: var(--color-text-primary);
      outline: none;
      transition: border-color 120ms ease, background 120ms ease, box-shadow 120ms ease;
    }
    .number-input,
    .text-input { padding: 0 9px; }
    .number-input {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }
    .number-input:disabled { cursor: not-allowed; opacity: .45; }
    .select-input { padding: 0 7px; }
    .text-input::placeholder { color: var(--color-text-tertiary); }
    .number-input:hover:not(:disabled),
    .select-input:hover,
    .text-input:hover { border-color: var(--color-border-info); }
    .number-input:focus,
    .select-input:focus,
    .text-input:focus {
      border-color: var(--color-accent-55);
      box-shadow: 0 0 0 2px var(--color-accent-06);
    }
    .drive-field {
      border-radius: var(--r-sm);
      background: var(--color-background-secondary);
      padding: 8px 9px;
    }
    .inline-value { color: var(--color-text-primary); font-size: 11px; }
    .editor-hint {
      margin: -1px 0 0;
      color: var(--color-text-tertiary);
      font-size: 10px;
    }
    .intensity-options {
      display: grid;
      gap: 4px;
      grid-template-columns: repeat(3, 1fr);
    }
    .intensity-option {
      min-height: 32px;
      border: 1px solid var(--color-border-primary);
      border-radius: var(--r-sm);
      background: transparent;
      color: var(--color-text-secondary);
      cursor: pointer;
      font-size: 10px;
      transition: border-color 120ms ease, background 120ms ease, color 120ms ease,
        transform 100ms ease;
    }
    .intensity-option:hover { background: var(--interaction-hover); }
    .intensity-option.selected {
      border-color: var(--color-accent-55);
      background: var(--color-accent-12);
      color: var(--color-text-primary);
    }
    .intensity-option:active { transform: scale(.97); }
    .delete-button {
      border: 0;
      background: transparent;
      color: var(--color-text-error);
      cursor: pointer;
      font-size: 11px;
    }
    .delete-button:disabled { cursor: not-allowed; opacity: .4; }
    .editor-content > .delete-button {
      width: 100%;
      min-height: 32px;
      border-radius: var(--r-sm);
      background: color-mix(in srgb, var(--color-text-error) 8%, transparent);
    }
    .delete-beat-button {
      flex: 0 0 auto;
      min-height: 28px;
      border-radius: var(--r-sm);
      padding: 4px 8px;
    }
    .delete-beat-button:hover {
      background: color-mix(in srgb, var(--color-text-error) 12%, transparent);
    }

    .footer {
      display: flex;
      flex-direction: column;
      gap: 9px;
      padding: 0 2px;
    }
    .review-option {
      display: flex;
      min-width: 0;
      min-height: 36px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 1px solid var(--color-border-primary);
      border-radius: var(--r-md);
      background: var(--score-surface);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.025);
      cursor: pointer;
      padding: 9px 10px;
      transition: border-color 120ms ease, background 120ms ease, transform 100ms ease;
    }
    .review-option:hover {
      border-color: var(--color-border-info);
      background: var(--color-accent-06);
    }
    .review-option:active { transform: scale(.992); }
    .review-copy {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 1px;
    }
    .review-label {
      color: var(--color-text-primary);
      font-size: 12px;
      font-weight: 600;
    }
    .review-hint {
      color: var(--color-text-tertiary);
      font-size: 10px;
      line-height: 1.4;
    }
    .review-switch {
      position: relative;
      display: inline-flex;
      flex: 0 0 auto;
    }
    .review-switch-input {
      position: absolute;
      z-index: 1;
      width: 100%;
      height: 100%;
      margin: 0;
      cursor: pointer;
      opacity: 0;
    }
    .review-switch-track {
      display: inline-flex;
      width: 34px;
      height: 20px;
      box-sizing: border-box;
      align-items: center;
      border: 1px solid var(--color-border-secondary);
      border-radius: 999px;
      background: var(--color-background-secondary);
      padding: 2px;
      transition: background 120ms ease, border-color 120ms ease;
    }
    .review-switch-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--color-text-tertiary);
      transition: background 120ms ease, transform 120ms ease;
    }
    .review-switch-input:checked + .review-switch-track {
      border-color: var(--color-accent);
      background: var(--color-accent);
    }
    .review-switch-input:checked + .review-switch-track .review-switch-thumb {
      background: var(--color-accent-fg);
      transform: translateX(14px);
    }
    .review-switch-input:focus-visible + .review-switch-track {
      outline: 2px solid var(--color-accent);
      outline-offset: 2px;
    }
    .review-switch-input:disabled {
      cursor: wait;
    }
    .review-switch-input:disabled + .review-switch-track { opacity: .55; }
    .footer-bottom {
      display: flex;
      min-height: 34px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .status {
      min-height: 16px;
      margin: 0;
      color: var(--color-text-error);
      font-size: 10px;
    }
    .actions { display: flex; gap: 6px; margin-left: auto; }
    .revise-button,
    .confirm-button {
      min-height: 34px;
      border-radius: var(--r-sm);
      cursor: pointer;
      font-size: 11px;
      padding: 0 13px;
      transition: border-color 120ms ease, background 120ms ease, color 120ms ease,
        opacity 120ms ease, transform 100ms ease;
    }
    .revise-button {
      border: 1px solid var(--color-border-secondary);
      background: transparent;
      color: var(--color-text-secondary);
    }
    .revise-button:hover {
      background: var(--interaction-hover);
      color: var(--color-text-primary);
    }
    .confirm-button {
      min-width: 126px;
      border: 1px solid var(--color-text-primary);
      background: var(--color-text-primary);
      color: var(--color-accent-fg);
      font-weight: 600;
    }
    .revise-button:active,
    .confirm-button:active:not(:disabled) { transform: scale(.98); }
    .confirm-button:hover:not(:disabled) { opacity: .9; }
    .confirm-button:disabled { cursor: wait; opacity: .55; }

    @media (max-width: 760px) {
      .workspace { grid-template-columns: 1fr; }
      .selection-editor { position: static; }
      .beat-palette { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .beat-list {
        max-height: none;
        flex-direction: row;
        gap: 5px;
        overflow-x: auto;
        overscroll-behavior-x: contain;
        padding: 1px 0 3px;
        scrollbar-width: thin;
        scroll-snap-type: x proximity;
      }
      .beat-row {
        width: 148px;
        min-height: 34px;
        flex: 0 0 auto;
        grid-template-columns: 20px 42px minmax(0, 1fr);
        scroll-snap-align: start;
      }
      .beat-row-name,
      .beat-row-intensity { display: none; }
    }
    @media (max-width: 520px) {
      .rhythm { gap: 10px; padding-top: 6px; }
      .header {
        align-items: start;
        grid-template-columns: minmax(0, 1fr) auto;
      }
      .title-block { grid-column: 1 / -1; }
      .duration-lock { justify-self: start; }
      .duration-note { display: none; }
      .scene { white-space: normal; }
      .graph-shell { min-height: 176px; grid-template-columns: 34px minmax(0, 1fr); }
      .graph, .graph-svg { height: 176px; min-height: 176px; }
      .curve-note { display: none; }
      .footer-bottom { align-items: stretch; flex-direction: column; }
      .actions { width: 100%; }
      .revise-button, .confirm-button { flex: 1; }
    }
    @media (max-width: 360px) {
      .beat-tool { font-size: 9px; padding-inline: 4px; }
      .beats-section,
      .curve-section,
      .selection-editor { padding: 10px; }
      .beat-row { width: 136px; }
      .review-hint { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .reset-button,
      .beat-tool,
      .beat-marker,
      .point-ring,
      .beat-row,
      .number-input,
      .select-input,
      .text-input,
      .intensity-option,
      .review-option,
      .review-switch-track,
      .review-switch-thumb,
      .revise-button,
      .confirm-button { transition: none; }
    }
    @media (prefers-reduced-transparency: reduce) {
      .rhythm { --score-surface: var(--color-background-primary); }
    }
    @media (prefers-contrast: more) {
      .beats-section,
      .curve-section,
      .selection-editor,
      .review-option,
      .duration-lock { border-color: var(--color-text-tertiary); }
    }
