<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animatic</title>
  <style>
    html, body { margin: 0; padding: 0; background: transparent; }
    body {
      font-family: var(--font-sans, sans-serif);
      color: var(--color-text-primary, #eee);
      font-size: 13px;
      line-height: 1.5;
    }
    button { font: inherit; }
    .animatic {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-height: 640px;
      min-height: 320px;
      overflow: hidden;
      border: 1px solid var(--color-border-primary);
      border-radius: var(--r-lg);
      background:
        radial-gradient(circle at 5% 0%, var(--color-accent-12), transparent 32%),
        var(--color-background);
    }
    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px 16px;
      align-items: center;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--color-border-primary);
    }
    .title-block { min-width: 0; }
    .kicker {
      display: block;
      color: var(--color-text-info);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1 {
      overflow: hidden;
      margin: 2px 0 0;
      color: var(--color-text-primary);
      font-size: 16px;
      font-weight: 600;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .stats {
      display: flex;
      grid-column: 1;
      gap: 10px;
      color: var(--color-text-tertiary);
      font-size: 11px;
      white-space: nowrap;
    }
    .stats span + span::before {
      content: "·";
      margin-right: 10px;
      color: var(--color-border-secondary);
    }
    .view-toggle {
      display: flex;
      grid-row: 1 / span 2;
      grid-column: 2;
      gap: 2px;
      padding: 3px;
      border-radius: var(--r-pill);
      background: var(--color-background-secondary);
    }
    .view-button {
      border: 0;
      border-radius: var(--r-pill);
      padding: 5px 11px;
      background: transparent;
      color: var(--color-text-secondary);
      font-size: 11px;
      cursor: pointer;
    }
    .view-button.active {
      background: var(--color-accent-tint-strong);
      color: var(--color-text-primary);
    }
    .content {
      min-height: 0;
      overflow: auto;
      padding: 12px 16px;
    }
    .stage {
      position: relative;
      overflow: hidden;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: var(--r-md);
      background: #0b0b0b;
      box-shadow: inset 0 0 0 1px var(--color-border-primary);
    }
    .frame-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transition: opacity 40ms linear;
    }
    .previous-frame { z-index: 1; }
    .current-frame { z-index: 2; }
    .shot-badge {
      position: absolute;
      z-index: 3;
      top: 10px;
      left: 10px;
      padding: 3px 8px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: var(--r-pill);
      background: rgba(0,0,0,.64);
      color: rgba(255,255,255,.92);
      font-family: var(--font-mono);
      font-size: 10px;
      backdrop-filter: blur(8px);
    }
    .image-error, .empty {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 180px;
      padding: 24px;
      color: var(--color-text-tertiary);
      text-align: center;
    }
    .shot-progress-track {
      height: 2px;
      overflow: hidden;
      margin-top: 8px;
      border-radius: var(--r-pill);
      background: var(--color-background-secondary);
    }
    .shot-progress {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: var(--color-accent);
    }
    .shot-info {
      display: grid;
      grid-template-columns: minmax(160px, auto) minmax(0, 1fr);
      gap: 12px;
      align-items: start;
      padding: 10px 0 6px;
    }
    .shot-info p {
      margin: 0;
      color: var(--color-text-secondary);
      font-size: 12px;
      line-height: 1.55;
    }
    .shot-meta {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }
    .shot-meta strong {
      margin-right: 2px;
      font-family: var(--font-mono);
      font-size: 12px;
    }
    .pill {
      padding: 2px 7px;
      border-radius: var(--r-pill);
      background: var(--color-background-secondary);
      color: var(--color-text-secondary);
      font-size: 10px;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 0 10px;
    }
    .icon-button, .play-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--color-border-secondary);
      border-radius: 50%;
      background: var(--color-background-secondary);
      color: var(--color-text-primary);
      cursor: pointer;
    }
    .icon-button { width: 28px; height: 28px; }
    .play-button {
      width: 34px;
      height: 34px;
      border-color: transparent;
      background: var(--color-accent);
      color: var(--color-accent-fg);
      font-size: 12px;
    }
    button:disabled {
      cursor: default;
      opacity: .38;
    }
    .time {
      margin-left: 3px;
      color: var(--color-text-primary);
      font-family: var(--font-mono);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }
    .sheet-label {
      overflow: hidden;
      margin-left: auto;
      color: var(--color-text-tertiary);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .timeline {
      display: flex;
      gap: 3px;
      min-width: max-content;
      padding-bottom: 4px;
    }
    .segment {
      position: relative;
      overflow: hidden;
      min-width: 34px;
      height: 25px;
      border: 1px solid var(--color-border-secondary);
      border-radius: 5px;
      background: var(--color-background-secondary);
      color: var(--color-text-tertiary);
      font-family: var(--font-mono);
      font-size: 9px;
      cursor: pointer;
    }
    .segment.sheet-start { margin-left: 7px; }
    .segment.sheet-start::before {
      position: absolute;
      top: -2px;
      bottom: -2px;
      left: -6px;
      width: 1px;
      background: var(--color-accent-55);
      content: "";
    }
    .segment.active {
      border-color: var(--color-accent-55);
      color: var(--color-text-primary);
    }
    .segment-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0;
      background: var(--color-accent-12);
      pointer-events: none;
    }
    .overview {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }
    .sheet-card {
      min-width: 0;
      padding: 10px;
      border: 1px solid var(--color-border-primary);
      border-radius: var(--r-md);
      background: var(--color-background-primary);
    }
    .sheet-card h2 {
      overflow: hidden;
      margin: 0 0 8px;
      color: var(--color-text-secondary);
      font-size: 11px;
      font-weight: 500;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sheet-visual {
      position: relative;
      overflow: hidden;
      min-height: 150px;
      border-radius: var(--r-sm);
      background: #0b0b0b;
    }
    .sheet-visual img {
      display: block;
      width: 100%;
      height: auto;
    }
    .cell-overlay {
      position: absolute;
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      border: 1px solid rgba(255,255,255,.16);
      padding: 4px;
      background: transparent;
      color: transparent;
      font-family: var(--font-mono);
      font-size: 9px;
      cursor: pointer;
    }
    .cell-overlay:hover, .cell-overlay.active {
      border-color: var(--color-accent);
      background: var(--color-accent-12);
      color: white;
      text-shadow: 0 1px 3px black;
    }
    .footer {
      display: flex;
      gap: 8px;
      align-items: center;
      min-height: 36px;
      padding: 10px 16px;
      border-top: 1px solid var(--color-border-primary);
      background: var(--color-background-primary);
    }
    .spacer { flex: 1; }
    .primary-button, .secondary-button {
      border-radius: var(--r-pill);
      padding: 7px 14px;
      cursor: pointer;
      font-size: 12px;
    }
    .primary-button {
      border: 1px solid transparent;
      background: var(--color-accent);
      color: var(--color-accent-fg);
      font-weight: 600;
    }
    .secondary-button {
      border: 1px solid var(--color-border-secondary);
      background: transparent;
      color: var(--color-text-secondary);
    }
    .send-error { color: var(--color-text-error); font-size: 11px; }
    .decision {
      width: 100%;
      color: var(--color-text-secondary);
      font-size: 12px;
    }
    .decision.confirm::before { content: "✓ "; color: var(--color-text-success); }
    .decision.reject::before { content: "↩ "; color: var(--color-text-warning); }
    @media (max-width: 560px) {
      .header { grid-template-columns: minmax(0, 1fr); }
      .stats { grid-column: 1; overflow: auto; }
      .view-toggle { grid-row: 3; grid-column: 1; width: fit-content; }
      .shot-info { grid-template-columns: 1fr; gap: 7px; }
      .sheet-label { display: none; }
      .footer { flex-wrap: wrap; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
