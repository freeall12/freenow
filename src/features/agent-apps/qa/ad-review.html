<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>广告创意审核 · 官方本地媒体验收</title>
<style>body{margin:24px;max-width:1100px;background:#161616;color:#eee;font:14px system-ui}textarea{box-sizing:border-box;width:100%;min-height:160px;padding:12px;background:#252525;color:#eee;border:1px solid #555;font:13px monospace}button,select{margin:8px 10px 12px 0;padding:8px 12px}label{display:block;margin:10px 0}output{display:block;white-space:pre-wrap;margin:12px 0}#cards{margin:16px 0}#sources img,#sources video{width:240px;max-height:180px;object-fit:contain;margin:8px}</style>
<style>body{line-height:20px}h1{font-size:28px;line-height:32px;margin:24px 0}h2{font-size:24px;line-height:28px;margin:20px 0}p{margin:16px 0}textarea{display:block;height:160px;line-height:20px}#sources img,#sources video{vertical-align:top;height:180px}label{line-height:20px}button,select{line-height:20px}#cards{display:flow-root}</style>
<h1>广告创意审核 · 官方本地媒体验收</h1><p>三阶段只收用户创意判断；不代表平台合规、模型审核或真实投放数据。未修改官方HTML，复用生产controller/card/host；图片由本页Canvas绘制，视频来自本机QA MP4，均保存进独立IndexedDB。此页不调用模型或投放服务。</p>
<button id="fixture" disabled>保存真实本地验收素材</button><label>阶段 <select id="stage"><option value="frame_cull">首帧快筛</option><option value="pilot_review">试拍评审</option><option value="final_review">成片验收</option></select>语言 <select id="locale"><option>zh-CN</option><option>en-US</option><option>ja-JP</option><option>ko-KR</option><option>fr-FR</option></select></label>
<section id="sources"></section><label for="input">实际素材引用与官方字段（JSON）</label><textarea id="input"></textarea><button id="open" disabled>打开官方广告审核</button><button id="rerender" disabled>普通会话重绘</button><label><input id="busy" type="checkbox" disabled>模拟会话运行中（拒绝交接）</label><button id="replace" disabled>替换源图验证失效保护</button><output id="status" aria-live="polite">正在读取隔离存储…</output><section id="cards"></section><h2>已保存的交接队列</h2><p>标记和备注保存延迟400ms，需等待提交后确认；未提交状态不能得到成功交接。阶段与媒体来源不一致或源字节更换会失败。重复确认不重复排队。</p><textarea id="reply" readonly aria-label="真实审核交接结果"></textarea><script type="module" src="./ad-review.mjs"></script></html>
