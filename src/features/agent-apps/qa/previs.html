<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>预演 · 官方工作流验收</title><style>body{margin:24px;background:#161616;color:#eee;font:14px system-ui;max-width:1300px}button,input{padding:8px;margin:8px 8px 8px 0}label{display:block}output{display:block;white-space:pre-wrap;margin:12px 0}textarea{width:100%;box-sizing:border-box;height:240px;background:#222;color:#eee;padding:12px}#nodes{display:flex;flex-wrap:wrap;gap:12px}figure{margin:0}figcaption{max-width:280px;overflow-wrap:anywhere}#cards{margin:16px 0}</style><h1>预演 · 官方工作流验收</h1><p>未修改的官方 previs@v3，使用生产 registry/controller/host/runtime。九格源图是本地 Canvas 绘制并落盘的明确标记 QA 输入，绝非模型结果。编辑和实际待续消息保存在独立 IndexedDB；确认仅保存真实待续记录，独立页不会启动 Agent 或伪造运行完成。变体/图板生成调用本机真实 TaskService 和生成网关；必须配置图片服务及模型，产生真实任务才会回填。</p><button id="open" disabled>打开真实图板预演</button><button id="missing" disabled>打开缺图板镜头计划</button><button id="refresh" disabled>只查询原任务并回填已应用图板</button><button id="apply" disabled>应用已取回任务到原占位</button><button id="generate" disabled>明确确认生成已接受计划的图板</button><button id="undo" disabled>撤销最近结果</button><button id="verify" disabled>回读保存状态</button><label>图片模型别名（取自本机配置）<input id="model" placeholder="留空使用本机默认路由"></label><label><input id="busy" type="checkbox">模拟会话运行中</label><label><input id="fail" type="checkbox">模拟保存失败</label><output id="status" aria-live="polite">正在读取独立验收数据库…</output><div id="cards"></div><h2>真实源图、生成占位与结果</h2><div id="nodes"></div><h2>实际保存、消息与任务请求证据</h2><textarea id="evidence" readonly></textarea><script src="/generation-api.js"></script><script type="module" src="./previs.mjs"></script></html>
