<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>平台适配 · 原始官方页验收</title>
<style>body{margin:24px;max-width:1100px;background:#161616;color:#eee;font:14px/20px system-ui}h1{font-size:28px;line-height:36px;margin:0 0 12px}h2{font-size:20px;line-height:28px;margin:20px 0 12px}p{margin:0 0 12px}button,input{font:inherit}.qa-controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}button{box-sizing:border-box;min-height:38px;padding:8px 12px;border:1px solid #555;margin:0}label{display:inline-flex;align-items:center;min-height:38px;margin:0}output{display:block;white-space:pre-wrap;line-height:20px;margin:12px 0}#results{display:flex;flex-wrap:wrap;gap:20px}figure{margin:0;max-width:300px}figure img{display:block;max-width:280px;max-height:300px}figcaption{font:12px/16px monospace;white-space:pre-wrap;margin-top:8px}#cards{margin:20px 0}#source img{display:block;max-width:400px;max-height:240px}textarea{box-sizing:border-box;width:100%;min-height:180px;color:#eee;background:#222;border:1px solid #555;font:12px/16px monospace;padding:12px}</style>
<h1>平台适配 · 原始官方页验收</h1><p>生产 controller/card/host 与未改动的官方页面。真实源图和裁切PNG写入本页独立 IndexedDB；整批产物一次画布提交，成功等待画布与会话事务。未调用模型或生成服务。</p>
<div class="qa-controls"><label>真实源图 <input id="file" type="file" accept="image/png,image/jpeg,image/webp" disabled></label><button id="sample" disabled>载入实际像素测试图</button><button id="open" disabled>打开官方平台适配</button><button id="rerender" disabled>普通重绘</button><button id="undo" disabled>撤销上一批裁切</button>
<label><input id="busy" type="checkbox" disabled>会话运行中</label><label><input id="failGraph" type="checkbox" disabled>画布保存失败</label><label><input id="failChat" type="checkbox" disabled>会话回执保存失败</label></div>
<output id="status" aria-live="polite">正在读取本页独立存储…</output><section id="source"></section><section id="cards"></section><h2>实际裁切产物</h2><section id="results"></section><h2>已提交的真实回执</h2><textarea id="receipts" readonly></textarea>
<script type="module" src="./platform-resize.mjs"></script></html>
