<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>表演节奏 · 官方页面确定性验收</title>
<style>body{background:#161616;color:#eee;font:14px system-ui;margin:24px;max-width:1000px}textarea{box-sizing:border-box;width:100%;min-height:180px;background:#252525;color:#eee;border:1px solid #555;padding:12px;font:13px monospace}button{padding:8px 14px;margin:8px 8px 16px 0}output{display:block;white-space:pre-wrap;margin:10px 0}#cards{margin:16px 0}label{display:block;margin:8px 0}</style>
<h1>表演节奏 · 官方页面确定性验收</h1><p>官方页面与生产 card/host；原始资源 SHA 不变，严格绑定派生修复本地保存和快速确认竞态。输入为捕获官方示例，可改成实际场景与节奏。这里只保存真实编辑和排队回执，未调用模型、媒体或生成接口。</p>
<label for="input">实际输入（JSON，3–12个曲线点，最多24个节拍）</label><textarea id="input"></textarea>
<button id="open" disabled>打开表演节奏页</button><button id="rerender" disabled>普通会话重绘</button><button id="close" disabled>关闭面板</button><button id="reopen" disabled>重新打开已保存面板</button><button id="reload" disabled>重载官方页面</button>
<label><input id="busy" type="checkbox" disabled>模拟会话运行中（拒绝提交）</label>
<label>状态保存延迟（毫秒，0–5000）<input id="save-delay" type="number" min="0" max="5000" step="100" value="0" disabled></label><label><input id="fail-save" type="checkbox" disabled>仅下一次状态保存失败（可重试）</label>
<output id="status" aria-live="polite">正在读取专用 IndexedDB…</output><output id="persistence" aria-live="polite">尚无状态保存</output><section id="cards"></section>
<details><summary>实际已提交状态</summary><textarea id="state" readonly aria-label="实际已提交的表演节奏状态"></textarea></details>
<h2>实际已排队结果</h2><p>确认需PS1与已提交存储事务的曲线/节拍一致。固定时长和来源场景保留，曲线不会变成视频速度修改。</p><textarea id="reply" readonly aria-label="已排队的表演节奏结果"></textarea>
<script type="module" src="./performance-rhythm.mjs"></script></html>
