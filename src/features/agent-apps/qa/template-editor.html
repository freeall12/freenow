<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>合成编辑器 UI 验收</title>
<style>
body{margin:24px;background:#eeeae3;color:#282823;font:14px system-ui}main{max-width:1040px;margin:auto}button{padding:8px 12px;margin:4px}label{display:inline-flex;gap:6px;align-items:center;margin:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;padding:16px}p{line-height:1.6}.agent-template-source-editor[data-template-editor-qa] .agent-html-disclaimer{display:none}.template-editor-qa-note{font-size:13px;line-height:1.6;color:#fff9}.template-editor-qa-switches{display:flex;flex-direction:column;gap:8px}.template-editor-qa-switches label{font-size:13px;margin:0}
</style>
<main>
<h1>合成编辑器 UI 验收，不是官方模板导入</h1>
<p>复用生产源码编辑器；仅编辑此页独立 IndexedDB 内的普通自由 HTML。没有官方模板正文或来源身份，不进入精确模板导入链，不修改 crypto，不启动模型。</p>
<button id="open">打开合成 HTML 编辑器</button>
<button id="read">实际回读已保存正文</button>
<button id="reload">刷新页面核对持久化</button>
<label><input id="fail" type="checkbox">保存失败</label>
<label><input id="invalid" type="checkbox">让当前来源失效</label>
<p>编辑后保存，再实际回读或刷新。修改后按 Escape / 点击外部，应提示继续编辑或放弃；失败保存应保留草稿。来源恢复后，需要重新打开编辑器。</p>
<pre id="receipt" aria-live="polite">正在读取独立验收数据库…</pre>
</main>
<script type="module" src="./template-editor.mjs"></script>
</html>
