<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人物站位 · 官方页面本地验收</title>
<style>body{background:#161616;color:#eee;font:14px system-ui;margin:24px;max-width:1100px}textarea{box-sizing:border-box;width:100%;min-height:150px;background:#252525;color:#eee;border:1px solid #555;padding:12px;font:13px monospace}button{padding:8px 14px;margin:8px 8px 16px 0}output{display:block;white-space:pre-wrap;margin:10px 0}#cards{margin:16px 0}label{display:block;margin:8px 0}#reply{min-height:200px}#portraits img{width:96px;height:96px;object-fit:cover;margin-right:12px}</style>
<h1>人物站位 · 官方页面本地验收</h1><p>原始官方 HTML、生产 registry/controller/host、本地头像 runtime。默认为明确标注 QA 的两张测试人物图片，实际保存本地资产并由浏览器真实解码、裁切为 WebP。专用 IndexedDB 保存输入图片、节点、站位状态和交接队列，不接触用户画布。页面没有调用模型或图片/视频生成接口；队列仅展示实际已保存的交接。</p>
<label for="input">应用输入（JSON；可删除 portrait_source 验证官方姓名首字母展示）</label><textarea id="input"></textarea>
<label>替换林岚参考图片（导入本页本地存储）<input id="upload" type="file" accept="image/png,image/jpeg,image/webp" disabled></label>
<button id="open" disabled>打开官方人物站位页</button><button id="rerender" disabled>普通会话重绘</button>
<label><input id="busy" type="checkbox" disabled>模拟会话运行中（拒绝交接）</label><label><input id="fail-save" type="checkbox" disabled>模拟状态保存失败（验证保存失败不可排队，关闭后可重试）</label>
<output id="status" aria-live="polite">正在读取专用 IndexedDB…</output><section id="portraits"></section><section id="cards"></section>
<h2>实际已保存站位</h2><textarea id="state" readonly aria-label="实际已保存站位状态"></textarea>
<h2>实际已保存交接队列</h2><textarea id="reply" readonly aria-label="实际已保存人物站位交接"></textarea>
<script type="module" src="./character-blocking.mjs"></script></html>
