<h1>人物情绪 · 官方页面确定性验收</h1><p>原始官方 HTML、生产 controller/host 和生产灰模保存 runtime。默认两张标明 QA 的真实本地图片作为来源与人物参考；灰模参考必须由官方页面真实渲染导出。专用 IndexedDB 保存图片、节点、状态和队列，不接触用户画布，未调用模型或生成接口。</p>
