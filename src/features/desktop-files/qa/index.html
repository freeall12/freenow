<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本地文件夹整理 · 实机验收</title><style>body{color:#ddd;background:#181818;font:15px system-ui;margin:32px;max-width:1000px}h1{font-size:24px}button{font:inherit;margin:0 8px 12px 0;padding:10px 14px;background:#333;color:#eee;border:1px solid #555;cursor:pointer}button:disabled{opacity:.4}textarea{box-sizing:border-box;display:block;background:#222;color:#eee;width:100%;height:190px;border:1px solid #555;padding:14px;font:14px monospace}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#222;padding:14px}#state{min-height:40px}.caption{color:#aaa}</style><h1>本地文件夹整理 · 实机验收</h1><p>仅操作本次启动新建的临时 QA 文件夹。没有读取已有用户数据或模型 Key。</p><p id="folder"></p><button id="authorize">选择并授权 QA 文件夹</button><button id="status">查询授权与回执</button><button id="list">读取真实目录列表</button><button id="revoke">撤销目录授权</button><p class="caption">预览不会修改文件。执行按钮会打开原生整批确认，默认取消。</p><textarea id="ops" aria-label="整批操作">[
