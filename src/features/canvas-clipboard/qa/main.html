<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>普通副本 · 隔离生产QA</title><style>body{margin:0;background:#161616;color:#eee;font:13px/1.5 system-ui}header{padding:8px 16px}button{margin-right:8px}iframe{display:block;width:100%;height:620px;border:0;border-top:1px solid #555}pre{margin:8px 16px;white-space:pre-wrap;word-break:break-word}</style></head><body>
<header><strong>生产画布右键副本 · 公开素材隔离QA</strong><p>右键“右键此图 → 副本”图片选择副本。检查副本右移320且y不变、脱离分组、图库清空、原入边order=3和新出边order=10。随后在画布按⌘Z或点撤销，检查完整图恢复。所有数据和模板库隔离，模型网络被阻断。</p><button id="new">新隔离会话</button><button data-action="undo">生产撤销</button><button data-action="report">回读</button></header>
<iframe id="frame" title="普通副本生产画布"></iframe><pre id="report" aria-label="副本坐标连线与持久化诊断">正在准备…</pre><script>
const frame=document.querySelector('iframe'),query=new URLSearchParams(location.search);let session=query.get('session')||'duplicate-'+Date.now();function load(){const url=new URL(location.href);url.searchParams.set('session',session);history.replaceState(null,'',url);frame.src='/src/features/canvas-clipboard/qa/frame.html?session='+encodeURIComponent(session);}document.querySelector('#new').onclick=()=>{session='duplicate-'+Date.now();load();};document.querySelectorAll('[data-action]').forEach(button=>button.onclick=()=>frame.contentWindow.postMessage({action:button.dataset.action},location.origin));window.addEventListener('message',event=>{if(event.source===frame.contentWindow&&event.origin===location.origin&&event.data?.type==='canvas-duplicate-qa')document.querySelector('#report').textContent=JSON.stringify(event.data.report,null,2);});load();
</script></body></html>
