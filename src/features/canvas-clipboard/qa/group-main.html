<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>分组与多选复制 · 隔离生产QA</title><style>body{margin:0;background:#161616;color:#eee;font:13px/1.5 system-ui}header{padding:8px 16px}button{margin-right:8px}iframe{display:block;width:100%;height:650px;border:0;border-top:1px solid #555}pre{margin:8px 16px;white-space:pre-wrap;word-break:break-word}</style></head><body>
<header><strong>生产分组 / 多选复制粘贴 · 公开隔离QA</strong><p>组：点击“复制此嵌套组”的边框，或用准备按钮选择组。多选：先点击文本节点body，再按Shift点击图片body。随后在生产画布按⌘C，移动指针至画布右侧空白处，按⌘V；也可按⌘D验证复制→粘贴。不要使用组右键副本。组副本保留图片/文本父子；只复制图片+文本时脱离原父组。两种复制均保留外部入边order3与内部边order4，排除出边，清图库/运行归属，原图不变；每次粘贴一次保存。原位第二次⌘V偏移40屏幕像素。⌘Z或生产撤销应恢复。</p><button id="new">新隔离会话</button><button data-action="select-group">准备：选择嵌套组</button><button data-action="select-text">准备：选择文本，再Shift点图片</button><button data-action="undo">生产撤销</button><button data-action="report">回读</button></header>
<iframe id="frame" title="分组多选生产画布"></iframe><pre id="report" aria-label="分组多选父子连线与持久化诊断">正在准备…</pre><script>
const frame=document.querySelector('iframe'),query=new URLSearchParams(location.search);let session=query.get('session')||'group-copy-'+Date.now();function load(){const url=new URL(location.href);url.searchParams.set('session',session);history.replaceState(null,'',url);frame.src='/src/features/canvas-clipboard/qa/group-frame.html?session='+encodeURIComponent(session);}document.querySelector('#new').onclick=()=>{session='group-copy-'+Date.now();load();};document.querySelectorAll('[data-action]').forEach(button=>button.onclick=()=>frame.contentWindow.postMessage({action:button.dataset.action},location.origin));window.addEventListener('message',event=>{if(event.source===frame.contentWindow&&event.origin===location.origin&&event.data?.type==='canvas-group-copy-qa')document.querySelector('#report').textContent=JSON.stringify(event.data.report,null,2);});load();
</script></body></html>
