<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>正式片连线落点 QA</title></head><body><p>正在载入生产画布与隔离连线夹具…</p><script>
(async()=>{
  const response=await fetch('/index.html');if(!response.ok)throw Error('生产画布入口不可读取');
  let html=await response.text();
  if(!html.includes('<head>')||!/<script src="canvas-store\.js[^\"]*"><\/script>/.test(html))throw Error('生产画布入口结构已变化');
  html=html.replace('<head>','<head><base href="/"><script src="/src/features/canvas-connections/qa/fixture.js"><\/script>');
  html=html.replace(/(<script src="canvas-store\.js[^\"]*"><\/script>)/,'$1<script src="/src/features/canvas-connections/qa/store-bootstrap.js"><\/script>');
  html=html.replace('</body>','<script type="module" src="/src/features/canvas-connections/qa/controls.mjs"><\/script></body>');
  document.open();document.write(html);document.close();
})().catch(error=>{document.body.textContent='连线 QA 加载失败：'+error.message;});
</script></body></html>
