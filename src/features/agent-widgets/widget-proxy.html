<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Widget Proxy</title>
  <style>
    html, body { margin: 0; height: 100%; width: 100%; overflow: hidden; }
    body { display: flex; flex-direction: column; }
    * { box-sizing: border-box; }
    iframe { background-color: transparent; border: 0px none transparent; padding: 0px; overflow: hidden; flex-grow: 1; }
  </style>
</head>
<body>
  <!-- Sandboxed proxy: receives widget HTML via postMessage from an allowed parent and renders it in a nested sandboxed iframe. -->
  <script>
    (function () {
      "use strict";

      var inner = document.createElement("iframe");
      inner.style = "width:100%; height:100%; border:none;";
      inner.setAttribute("sandbox", "allow-scripts allow-same-origin allow-forms");
      document.body.appendChild(inner);

      var parentOrigin = "*";
      var currentNonce = null;

      // ENV_POLICY:BEGIN
      function getEnvPolicy() {
        var selfHost = location.hostname;
        // prod
        if (selfHost === "usercontent.tapnow.art") {
          return {
            patterns: [
              "https://app.tapnow.ai",
              "https://app.tapnow.media",
              "https://app.tapnow.zone",
              "https://app.tapnow.plus",
              "https://app.tapnow.tv"
            ],
            allowVercelPreview: false,
            allowLocalhost: false,
            allowSameOrigin: false
          };
        }
        // test
        if (selfHost === "usercontent-testing.tapnow.art") {
          return {
            patterns: [
              "https://preview.tapnow.ai",
              "https://preview.tapnow.media",
              "https://preview.tapnow.top",
              "https://tamaredge.top"
            ],
            allowVercelPreview: true,
            allowLocalhost: false,
            allowSameOrigin: false
          };
        }
        // fallback。
        return {
          patterns: [],
          allowVercelPreview: false,
          allowLocalhost: true,
          allowSameOrigin: true
        };
      }

      var ENV_POLICY = getEnvPolicy();
      var VERCEL_PREVIEW_HOST_REGEX = /^tapnow-(?:test|cn)-pr-\d+(?:-test-[1-5])?\.vercel\.app$/;

      function isAllowedOrigin(origin) {
        try {
          if (ENV_POLICY.allowSameOrigin && origin === location.origin) {
            return true;
          }
          var url = new URL(origin);
          var host = url.hostname;
          if (ENV_POLICY.allowVercelPreview && url.protocol === "https:" && VERCEL_PREVIEW_HOST_REGEX.test(host)) {
            return true;
          }
          if (ENV_POLICY.allowLocalhost && (host === "localhost" || host === "127.0.0.1")) {
            return true;
          }
          return ENV_POLICY.patterns.some(function (pattern) {
            var patternUrl = new URL(pattern);
            return host === patternUrl.hostname || host.endsWith("." + patternUrl.hostname);
          });
        } catch (e) {
          return false;
        }
      }
      // ENV_POLICY:END

      // 内层 srcdoc 的 CSP：核心是 connect-src 'none' 封掉网络外带（fetch/XHR/WebSocket/beacon），
      // 并禁外部脚本、子 frame、表单提交。widget 全内联，脚本/样式放行 inline；
      // 图片/媒体放行 https:（widget 可能引用生成结果图/视频 URL），域名白名单收紧留作后续。
      var CSP_CONTENT = "default-src 'none'; "
        + "script-src 'unsafe-inline'; "
        + "style-src 'unsafe-inline'; "
        + "img-src data: blob: https:; "
        + "media-src data: blob: https:; "
        + "font-src data:; "
        + "connect-src 'none'; "
        + "frame-src 'none'; "
        + "form-action 'none'; "
        + "base-uri 'none'";

      var DESIGN_TOKEN_CSS = ""
        + ":root{"
        + "--color-background:#161616;"
        + "--color-background-primary:color-mix(in srgb, var(--color-accent) 6%, #1F1F1F);"
        + "--color-background-secondary:rgba(255,255,255,0.08);"
        + "--color-background-info:rgba(255,255,255,0.12);"
        + "--color-text-primary:rgba(255,255,255,0.95);"
        + "--color-text-secondary:rgba(255,255,255,0.7);"
        + "--color-text-tertiary:rgba(255,255,255,0.55);"
        + "--color-text-success:#7CD5A7;"
        + "--color-text-warning:#FDCE8B;"
        + "--color-text-error:#D36A6A;"
        + "--color-border-secondary:rgba(255,255,255,0.1);"
        + "--color-border-tertiary:color-mix(in srgb, var(--color-accent) 10%, transparent);"
        + "--color-accent:#90C4E5;"
        + "--color-accent-fg:#0F0F0F;"
        + "--color-text-info:var(--color-accent);"
        + "--color-border-info:color-mix(in srgb, var(--color-accent) 30%, transparent);"
        + "--color-accent-surface:color-mix(in srgb, var(--color-accent) 8%, var(--color-background-primary));"
        + "--color-accent-tint:color-mix(in srgb, var(--color-accent) 18%, #0a0a0a);"
        + "--color-accent-tint-strong:color-mix(in srgb, var(--color-accent) 28%, #0a0a0a);"
        + "--color-accent-on-tint:color-mix(in srgb, var(--color-accent) 60%, #ffffff);"
        + "--color-accent-06:color-mix(in srgb, var(--color-accent) 6%, transparent);"
        + "--color-accent-12:color-mix(in srgb, var(--color-accent) 12%, transparent);"
        + "--color-accent-55:color-mix(in srgb, var(--color-accent) 55%, transparent);"
        + "--interaction-hover:rgba(255,255,255,0.05);"
        + "--interaction-pressed:rgba(255,255,255,0.1);"
        + "--r-sm:8px;"
        + "--r-md:12px;"
        + "--r-lg:16px;"
        + "--r-pill:9999px;"
        + "--border-radius-md:12px;"
        + "--border-radius-lg:16px;"
        + "}"
        + "html,body{margin:0;overflow:hidden;}"
        + "body{"
        + "font-family:'Inter','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;"
        + "font-size:13px;"
        + "color:var(--color-text-primary);"
        + "background:var(--color-background);"
        + "line-height:1.65;"
        + "letter-spacing:0.01em;"
        + "-webkit-font-smoothing:antialiased;"
        + "}"
        + "button{color:inherit;font-family:inherit;font-size:13px;line-height:1.4;background:var(--color-background-secondary);border:1px solid var(--color-border-secondary);border-radius:var(--r-sm);padding:5px 11px;cursor:pointer;transition:all 120ms;}"
        + "button:hover{background:var(--color-background-info);}"
        + "input,textarea,select{color:inherit;font-family:inherit;font-size:13px;line-height:1.4;background:var(--color-background-secondary);border:1px solid var(--color-border-secondary);border-radius:var(--r-sm);padding:4px 8px;outline:none;transition:border-color 120ms;}"
        + "input:focus,textarea:focus,select:focus{border-color:var(--color-accent-55);}"
        + "textarea{resize:vertical;line-height:1.5;}"
        + "a{color:var(--color-accent);text-decoration:none;transition:opacity 120ms;}"
        + "a:hover{text-decoration:underline;}"
        + "code{background:var(--color-background-secondary);border-radius:3px;padding:1px 5px;font-size:0.9em;font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;}"
        + "pre{background:var(--color-background-secondary);border:1px solid var(--color-border-secondary);border-radius:var(--r-sm);padding:10px;margin:8px 0;overflow-x:auto;font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;font-size:12px;line-height:1.5;}"
        + "pre code{background:transparent;padding:0;font-size:inherit;}"
        + "hr{border:0;border-top:1px solid var(--color-border-tertiary);margin:12px 0;}"
        + "blockquote{border-left:2px solid var(--color-border-secondary);padding:2px 12px;margin:8px 0;color:var(--color-text-secondary);}"
        + "table{border-collapse:collapse;width:100%;margin:8px 0;font-size:13px;}"
        + "th,td{border-bottom:1px solid var(--color-border-tertiary);padding:6px 8px;text-align:left;vertical-align:top;}"
        + "th{color:var(--color-text-secondary);font-weight:500;font-size:12px;letter-spacing:0.04em;}"
        + "details{margin:6px 0;}"
        + "summary{cursor:pointer;color:var(--color-text-primary);padding:4px 0;list-style:disclosure-closed;}"
        + "details[open] summary{list-style:disclosure-open;}"
        + "summary:hover{color:var(--color-accent-on-tint);}"
        + "mark{background:var(--color-accent-12);color:var(--color-accent-on-tint);padding:0 3px;border-radius:2px;}"
        + ".sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}";

      // 返回 bridge 的纯 JS 源码（不含 <script> 标签，经 DOM createElement 注入）。
      function buildBridgeJs(nonce) {
        return ""
          + "window.sendPrompt=function(t){"
          + "window.parent.postMessage({type:'sendPrompt',text:String(t),nonce:'" + nonce + "'},'*');"
          + "};"
          + "window.openLink=function(u){"
          + "window.parent.postMessage({type:'openLink',url:String(u),nonce:'" + nonce + "'},'*');"
          + "};"
          + "window.tapnow={sendPrompt:window.sendPrompt,openLink:window.openLink};"
          + "function _reportHeight(){"
          + "if(!document.body)return;"
          + "var el=document.documentElement;"
          + "var prev=el.style.height;"
          + "el.style.height='0';"
          + "var h=document.body.scrollHeight+2;"
          + "el.style.height=prev;"
          + "window.parent.postMessage({type:'resize',height:h,nonce:'" + nonce + "'},'*');"
          + "}"
          + "function _initObservers(){"
          + "var _ro=new ResizeObserver(_reportHeight);"
          + "_ro.observe(document.documentElement);"
          + "var _mo=new MutationObserver(function(){requestAnimationFrame(_reportHeight);});"
          + "_mo.observe(document.body,{childList:true,subtree:true,attributes:true});"
          + "_reportHeight();"
          + "}"
          + "if(document.body){_initObservers();}else{document.addEventListener('DOMContentLoaded',_initObservers);}"
          + "window.addEventListener('load',_reportHeight);";
      }

      // 构造内层 srcdoc：widget HTML 是对抗性输入（提示注入可控），不能用正则/字符串替换找
      // 注入点——注释、<title>/<textarea> 等 raw-text 里的假 <head> 都能骗过字符串匹配，把
      // CSP 插进惰性上下文而失效。改用 DOMParser（惰性解析，不执行脚本）拿到真实 <head>，
      // 依次前置 CSP meta、design token 样式（默认值，widget 自身样式在其后可覆盖）与
      // bridge 脚本，再整体序列化——CSP 必然先于文档内任何脚本生效。
      function buildSrcdoc(html, nonce, localBridge) {
        var doc = new DOMParser().parseFromString(html, "text/html");
        var head = doc.head;
        var meta = doc.createElement("meta");
        meta.setAttribute("http-equiv", "Content-Security-Policy");
        meta.setAttribute("content", CSP_CONTENT);
        head.insertBefore(meta, head.firstChild);
        var style = doc.createElement("style");
        style.textContent = DESIGN_TOKEN_CSS;
        head.insertBefore(style, meta.nextSibling);
        var bridge = doc.createElement("script");
        bridge.textContent = buildBridgeJs(nonce) + (typeof localBridge === "string" ? localBridge : "");
        head.insertBefore(bridge, style.nextSibling);
        return "<!doctype html>" + doc.documentElement.outerHTML;
      }

      function handleParentMessage(data, onHandshake) {
        if (!data || typeof data !== "object") return;
        if (data.type === "uploadToCanvasResult" && data.nonce === currentNonce) {
          inner.contentWindow.postMessage(data, "*");return;
        }
        if (data.type !== "render" || typeof data.html !== "string" || typeof data.nonce !== "string") return;
        if (data.localBridge !== undefined && (typeof data.localBridge !== "string" || data.localBridge.length > 60000)) return;

        if (onHandshake) onHandshake();
        currentNonce = data.nonce;

        inner.srcdoc = buildSrcdoc(data.html, data.nonce, data.localBridge);
        inner.onload = function () {
          window.parent.postMessage({ type: "rendered", nonce: data.nonce }, parentOrigin);
        };
      }

      window.addEventListener("message", function (event) {
        if (event.source === window.parent && isAllowedOrigin(event.origin)) {
          handleParentMessage(event.data, function () {
            parentOrigin = event.origin;
          });
        } else if (event.source === inner.contentWindow) {
          var data = event.data;
          if (data && data.type === "resize" && typeof data.height === "number") {
            inner.style.height = data.height + "px";
          }
          window.parent.postMessage(data, parentOrigin);
        }
      });

      window.parent.postMessage({ type: "proxy-ready" }, "*");
    })();
  </script>
</body>
</html>
