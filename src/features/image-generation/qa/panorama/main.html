<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>Hunyuan全景 · 隔离公开QA</title><style>body{margin:0;background:#171717;color:#eee;font:13px/1.5 system-ui}header{padding:8px 16px}button,select{margin-right:8px}iframe{display:block;width:100%;height:620px;border:0;border-top:1px solid #555}pre{margin:10px 16px;white-space:pre-wrap;word-break:break-word}</style></head><body>
<header><strong>生产画布 · Hunyuan图生360全景公开夹具</strong><p>点击右侧生成节点，检查模型/规格/数量菜单后生成。结果为本地PNG夹具，并非付费模型实测。源图、数据库和模板库均隔离；所有真实API与外部请求被阻断。</p><select id="case" aria-label="测试场景"><option value="success">2:1解码成功</option><option value="unconfigured">未配置</option><option value="wrong-ratio">错误画幅</option><option value="decode-fail">损坏图片</option><option value="deferred">延迟回执/守卫</option><option value="unknown">状态待确认</option></select><button id="reload">新隔离会话</button><button data-action="finish">完成延迟回执</button><button data-action="camera">激活不支持相机</button><button data-action="extra-source">增加第二张图</button><button data-action="report">回读状态</button></header>
<iframe id="canvas-frame" title="Hunyuan全景生产画布"></iframe><pre id="report" aria-label="全景请求和应用诊断">正在准备…</pre><script>
const frame=document.querySelector('iframe'),select=document.querySelector('select'),query=new URLSearchParams(location.search);let session=query.get('session')||'panorama-'+Date.now();select.value=query.get('case')||'success';function load(){const url=new URL(location.href);url.searchParams.set('session',session);url.searchParams.set('case',select.value);history.replaceState(null,'',url);frame.src='/src/features/image-generation/qa/panorama/frame.html?case='+select.value+'&session='+encodeURIComponent(session);}select.onchange=load;document.querySelector('#reload').onclick=()=>{session='panorama-'+Date.now();load();};document.querySelectorAll('[data-action]').forEach(button=>button.onclick=()=>frame.contentWindow.postMessage({action:button.dataset.action},location.origin));window.addEventListener('message',event=>{if(event.origin===location.origin&&event.source===frame.contentWindow&&event.data?.type==='panorama-native-qa')document.querySelector('#report').textContent=JSON.stringify(event.data.report,null,2);});load();
</script></body></html>
