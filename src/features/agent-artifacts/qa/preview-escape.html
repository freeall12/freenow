<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>HTML 预览 Escape QA</title><link rel="stylesheet" href="../styles.css"><style>body{background:#151515;color:#eee;font:14px system-ui;margin:32px}button{padding:8px 12px;margin:8px}p{max-width:760px}</style></head><body><h1>HTML 双 iframe Escape 检查</h1><p>只创建内存 HTML 预览，不改画布、会话或模型设置。预览内先点输入框，再按 Esc 应关闭预览并回到下方打开按钮。打开内部菜单后，第一下 Esc 只关闭菜单；第二下关闭预览。</p><button id="open">打开 HTML 预览</button><button id="other">外部焦点目标</button><label>讨论结果 <select id="outcome"><option value="success">成功加入草稿</option><option value="reject">拒绝并保留预览</option></select></label><label><input type="checkbox" id="newer">预览打开后模拟更新到版本 2</label><textarea id="composer" aria-label="讨论草稿" placeholder="只写入本地草稿，不发送"></textarea><p id="status" role="status">尚未打开</p><script type="module">
import {openHtmlPreview} from '../html-preview.mjs';
let handle;const open=document.querySelector('#open'),status=document.querySelector('#status');
const content=`<!doctype html><html><body style="font:16px system-ui;background:#202023;color:white;padding:30px"><h2>真实沙箱预览</h2><label>内部输入框 <input aria-label="内部输入框" placeholder="点击后按 Escape"></label><p><button id="menu-open">打开内部菜单</button><button id="native-open">打开内部对话框</button></p><div id="menu" hidden style="padding:20px;border:1px solid gray"><button id="inside">内部菜单控件</button><p>第一下 Escape 只收起此菜单。</p></div><dialog id="native"><p>内部原生 HTML dialog</p><button onclick="this.closest('dialog').close()">关闭内部对话框</button></dialog><p id="message"></p><script>const menu=document.querySelector('#menu');document.querySelector('#menu-open').onclick=()=>{menu.hidden=false;document.querySelector('#inside').focus();};document.querySelector('#native-open').onclick=()=>document.querySelector('#native').showModal();window.addEventListener('keydown',event=>{if(event.key==='Escape'&&!menu.hidden){event.preventDefault();event.stopPropagation();menu.hidden=true;document.querySelector('#menu-open').focus();document.querySelector('#message').textContent='内部已消费一次 Escape';}});<\/script></body></html>`;
const file={artifact_path:'artifacts/escape-qa.html',content_type:'html',revision:1,title:'Escape 焦点检查',content};
open.onclick=async()=>{handle?.close();let current=file;handle=openHtmlPreview({file,getCurrentFile:async()=>current,getResourceOptions:async()=>({}),onDiscuss:async latest=>{if(document.querySelector('#outcome').value==='reject')return false;const composer=document.querySelector('#composer');composer.value=`讨论 ${latest.artifact_path}，版本 ${latest.revision}`;requestAnimationFrame(()=>composer.focus());return true;},onError:message=>status.textContent=message});status.textContent='预览已打开；等待资源准备完成后点击内部输入框';await handle.ready;if(document.querySelector('#newer').checked)current={...file,revision:2,content:content+'<!-- latest -->'};};
open.addEventListener('focus',()=>{if(handle)status.textContent='焦点已返回打开按钮';});window.addEventListener('pagehide',()=>handle?.close());
</script></body></html>
