<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>文本生成引用独立验收</title>
<style>body{background:#111;color:#ddd;margin:12px;font:14px system-ui}button{padding:8px}pre{white-space:pre-wrap;max-height:190px;overflow:auto}iframe{display:block;width:1000px;height:900px;border:0}</style>
<button id="run">运行文本引用聚焦验收</button><button id="show">查看文本提示词</button><button id="picker">查看画布参考选择</button><span id="status">未运行</span><pre id="results"></pre><iframe title="文本引用隔离画布"></iframe>
<script>
const frame=document.querySelector('iframe'),results=[],params=new URLSearchParams(location.search),pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
let session=params.get('session')||'text-reference-'+Date.now();
// A unique QA namespace uses the production IndexedDB path without clearing any storage.
frame.src='/src/features/text-generation/qa/text-app.html?session='+encodeURIComponent(session);
const ready=async fn=>{for(let i=0;i<300;i++){if(fn())return;await pause(20);}throw Error('等待超时');};
let w,d,a;function bind(){w=frame.contentWindow;d=w.document;a=w.CanvasApp;}const get=id=>a.getState().nodes.find(node=>node.id===id),panel=()=>d.querySelector('#text-generation-panel'),prompt=()=>w.TextAPI.promptEditor,check=(name,passed,detail)=>{results.push({name,passed:!!passed,detail});if(!passed)throw Error(name);};
async function select(){await ready(()=>frame.contentWindow.CanvasApp&&frame.contentWindow.TextAPI);bind();a.select('g');a.setView({x:-52050.25,y:2140.5,scale:1});await ready(()=>prompt());}
document.querySelector('#show').onclick=async()=>{bind();await select();prompt().dom.focus();};
document.querySelector('#picker').onclick=async()=>{bind();await select();panel().querySelector('.reference-add').focus();panel().querySelector('.reference-add').click();};
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;try{
  // Manual preview and a previous run may leave a live picker or changed graph.
  // Use a new QA database, preserving the inspected session and all user storage.
  session=session+'-run-'+Date.now();frame.src='/src/features/text-generation/qa/text-app.html?session='+encodeURIComponent(session);await new Promise(resolve=>frame.onload=resolve);
  await ready(()=>frame.contentWindow.CanvasApp&&frame.contentWindow.TextAPI);bind();
  await ready(()=>w.TextAPI&&a&&get('g'));await select();if(w.TEXT_QA_ERRORS?.length)throw Error('QA初始化异常：'+w.TEXT_QA_ERRORS.join('; '));
  check('实际生成提示词为Tiptap可编辑节点',prompt().dom.contentEditable==='true'&&!panel().querySelector('textarea')&&prompt().dom.getAttribute('aria-label')==='文本生成提示词');
  const initialBounds=[get('g').x,get('g').y,get('g').width,get('g').height],add=panel().querySelector('.reference-add');add.focus();add.click();await ready(()=>d.body.classList.contains('canvas-reference-picking')&&d.querySelector('.canvas-reference-banner:not([aria-hidden="true"])'));
  const liveBanner=d.querySelector('.canvas-reference-banner:not([aria-hidden="true"])');
  check('plus立即进入画布选择而非checkbox dialog',liveBanner.querySelector('strong').textContent==='从画布选择参考'&&!d.querySelector('.text-reference-picker')&&d.querySelector('.canvas-reference-hit'),{heading:liveBanner.querySelector('strong').textContent,candidates:[...d.querySelectorAll('.canvas-reference-hit')].map(button=>button.dataset.sourceId)});
  d.activeElement.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true,cancelable:true}));await pause(30);
  check('picker Escape保留选中并回实际plus',!d.body.classList.contains('canvas-reference-picking')&&a.getState().selected[0]==='g'&&d.activeElement===add);
  const beforeConnect=a.historyState().undoCount;add.click();await ready(()=>d.querySelector('.canvas-reference-hit[data-source-id=i]'));d.querySelector('.canvas-reference-hit[data-source-id=i]').click();await pause(30);
  check('画布点选增加真实参考边且单步撤销',a.getState().edges.some(edge=>edge.source==='i'&&edge.target==='g')&&a.historyState().undoCount===beforeConnect+1);
  a.undo();check('连接撤销移除参考',!a.getState().edges.some(edge=>edge.source==='i'&&edge.target==='g'));a.undo(true);await select();const initialPrompt=prompt().dom;
  panel().querySelector('[data-reference-key="node:s"] button').click();await pause(30);
  check('点击文本参考插入稳定身份原子mention',prompt().dom.querySelector('.composer-mention[data-reference-key="node:s"]')?.contentEditable==='false'&&get('g').generation.prompt.includes('{{Text 1}}')&&get('g').generation.promptReferenceBindings.some(binding=>binding.referenceKey==='node:s'));
  check('普通编辑和参考插入保持同一编辑DOM',prompt().dom===initialPrompt);
  const s2=a.addConnectionNode('g','left',{type:'text',textMode:'pure',title:'第二份文本',content:'第二段来源',x:52400.25,y:-1600.5,width:300,height:200});await select();
  w.TextAPI.setConfig('g',{prompt:'比较 {{Text 1}} 与 {{Text 2}} {{Image 1}}'});const beforeSort=get('g').generation.prompt,beforeOrder=JSON.stringify(get('g').generation.referenceIds),dom=prompt().dom;
  const chip=panel().querySelector('[data-reference-key="node:'+s2.id+'"]');chip.focus();chip.dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowLeft',altKey:true,bubbles:true,cancelable:true}));
  check('同类键盘排序同步token且焦点返回来源chip',get('g').generation.prompt==='比较 {{Text 2}} 与 {{Text 1}} {{Image 1}}'&&d.activeElement.dataset.referenceKey==='node:'+s2.id&&prompt().dom===dom);
  const projected=await w.TextAPI.buildRequest('g');check('请求按来源语义内联文本一次',projected.prompt.includes('比较 '+get('s').content+' 与 第二段来源')&&!projected.prompt.includes('{{Text ')&&projected.prompt.split('第二段来源').length===2);
  a.undo();check('排序单步撤销恢复提示词与顺序',get('g').generation.prompt===beforeSort&&JSON.stringify(get('g').generation.referenceIds)===beforeOrder);a.undo(true);await select();
  const beforeRemove=JSON.stringify(get('g').generation),undoCount=a.historyState().undoCount;panel().querySelector('[data-reference-key="node:'+s2.id+'"] button:last-child').click();
  check('chip删除参考边和对应mentions同属一条历史',!a.getState().edges.some(edge=>edge.source===s2.id&&edge.target==='g')&&get('g').generation.prompt==='比较 {{Text 1}} 与  {{Image 1}}'&&a.historyState().undoCount===undoCount+1);
  a.undo();check('参考删除单步撤销恢复全部绑定',JSON.stringify(get('g').generation)===beforeRemove&&a.getState().edges.some(edge=>edge.source===s2.id&&edge.target==='g'));await select();
  const sourceDom=prompt().dom;a.updateNode('s',{title:'重命名来源',content:'最新来源正文'});
  check('来源重命名正文变化同步mention并保留焦点DOM',prompt().dom===sourceDom&&prompt().dom.querySelector('[data-reference-key="node:s"] .composer-mention-label').textContent==='重命名来源'&&(await w.TextAPI.buildRequest('g')).prompt.includes('最新来源正文'));
  a.updateNode('i',{fullImage:'/assets/tap-logo.webp',title:'替换图片'});check('来源图片替换保留稳定key并用于新请求',(await w.TextAPI.buildRequest('g')).inputs.find(input=>input.id==='i').key==='node:i'&&prompt().dom.querySelector('[data-reference-key="node:i"] .composer-mention-label').textContent==='替换图片');
  const snapshot=prompt().captureSelection();check('voice transcript沿编辑器选区提交',prompt().commitTranscript(snapshot,'语音补充')&&get('g').generation.prompt.includes('语音补充'));
  const stale=prompt().captureSelection();w.TextAPI.setConfig('g',{prompt:get('g').generation.prompt+' 新编辑'});check('voice迟到结果不覆盖已编辑prompt',prompt().commitTranscript(stale,'不应写入')===false&&!get('g').generation.prompt.includes('不应写入'));
  const beforeDelete=JSON.stringify(get('g').generation),deleteHistory=a.historyState().undoCount;a.remove([s2.id]);
  check('删除来源节点清理对应绑定且单条历史',!get(s2.id)&&!get('g').generation.promptReferenceBindings.some(binding=>binding.referenceKey==='node:'+s2.id)&&a.historyState().undoCount===deleteHistory+1);
  a.undo();check('删除来源单步撤销恢复节点和绑定',!!get(s2.id)&&JSON.stringify(get('g').generation)===beforeDelete);await select();
  check('全部引用操作保持文本节点绝对坐标尺寸',JSON.stringify([get('g').x,get('g').y,get('g').width,get('g').height])===JSON.stringify(initialBounds));
  const saved=JSON.stringify(get('g').generation);await a.saveProject();frame.src='/src/features/text-generation/qa/text-app.html?session='+encodeURIComponent(session);await new Promise(resolve=>frame.onload=resolve);bind();await ready(()=>w.TextAPI&&get('g'));await select();
  check('真实IndexedDB整页重开保持token顺序稳定bindings',JSON.stringify(get('g').generation)===saved&&prompt().dom.querySelectorAll('.composer-mention').length>0);
  w.TextAPI.setConfig('g',{prompt:'{{Text 1}}'});const p=prompt().dom.querySelector('p');prompt().dom.focus();const range=d.createRange();range.selectNodeContents(p);range.collapse(false);d.getSelection().removeAllRanges();d.getSelection().addRange(range);await pause(80);prompt().dom.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Backspace',bubbles:true,cancelable:true}));await pause(30);
  check('Backspace完整移除原子mention',get('g').generation.prompt===''&&!prompt().dom.querySelector('.composer-mention'));
  w.TextAPI.setConfig('g',{prompt:'最终提示词 {{Text 1}} {{Image 1}}'});await pause(500);if(w.TEXT_QA_ERRORS?.length)throw Error('QA运行异常：'+w.TEXT_QA_ERRORS.join('; '));document.querySelector('#status').textContent=results.length+'/'+results.length+' passed';
}catch(error){results.push({passed:false,error:error.stack||error.message});document.querySelector('#status').textContent=error.message;}finally{document.querySelector('#results').textContent=JSON.stringify(results,null,2);}};
</script></html>
